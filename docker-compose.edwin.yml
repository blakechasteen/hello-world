# EdWIN AI Tutor - Docker Compose Configuration
# Development and testing environment
#
# Usage:
#   docker-compose -f docker-compose.edwin.yml up -d     # Start all services
#   docker-compose -f docker-compose.edwin.yml down      # Stop all services
#   docker-compose -f docker-compose.edwin.yml logs -f api    # View API logs
#   docker-compose -f docker-compose.edwin.yml ps        # List running services
#
# Implementation Date: November 15, 2025

version: '3.8'

services:
  # ==========================================================================
  # EdWIN API Server (Port 8000)
  # ==========================================================================
  edwin-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edwin-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - EDWIN_ENV=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=edwin_password_2025
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
    command: uvicorn EduVerse.edwin.api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./EduVerse:/app/EduVerse:ro
      - ./HoloLoom:/app/HoloLoom:ro
      - edwin-logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edwin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Teacher Dashboard (Port 8001)
  # ==========================================================================
  edwin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edwin-dashboard
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - EDWIN_ENV=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=edwin_password_2025
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: uvicorn EduVerse.edwin.teacher_dashboard:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./EduVerse:/app/EduVerse:ro
      - ./HoloLoom:/app/HoloLoom:ro
      - edwin-logs:/app/logs
    depends_on:
      - edwin-api
      - neo4j
      - qdrant
      - redis
    networks:
      - edwin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Mobile API (Port 8002)
  # ==========================================================================
  edwin-mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edwin-mobile
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - EDWIN_ENV=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=edwin_password_2025
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: uvicorn EduVerse.edwin.mobile_api:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ./EduVerse:/app/EduVerse:ro
      - ./HoloLoom:/app/HoloLoom:ro
      - edwin-logs:/app/logs
    depends_on:
      - edwin-api
      - neo4j
      - qdrant
      - redis
    networks:
      - edwin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Neo4j - Knowledge Graph Database
  # ==========================================================================
  neo4j:
    image: neo4j:5.13-community
    container_name: edwin-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/edwin_password_2025
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/import
      - neo4j-plugins:/plugins
    networks:
      - edwin-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "edwin_password_2025", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Qdrant - Vector Database
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: edwin-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - edwin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================================================
  # Redis - Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: edwin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - edwin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Prometheus - Metrics Collection (Optional)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: edwin-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - edwin-network
    profiles:
      - monitoring

  # ==========================================================================
  # Grafana - Visualization (Optional)
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: edwin-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - edwin-network
    profiles:
      - monitoring

# ==============================================================================
# Networks
# ==============================================================================
networks:
  edwin-network:
    driver: bridge
    name: edwin-network

# ==============================================================================
# Volumes (Persistent Storage)
# ==============================================================================
volumes:
  neo4j-data:
    name: edwin-neo4j-data
  neo4j-logs:
    name: edwin-neo4j-logs
  neo4j-import:
    name: edwin-neo4j-import
  neo4j-plugins:
    name: edwin-neo4j-plugins
  qdrant-data:
    name: edwin-qdrant-data
  redis-data:
    name: edwin-redis-data
  edwin-logs:
    name: edwin-logs
  prometheus-data:
    name: edwin-prometheus-data
  grafana-data:
    name: edwin-grafana-data
