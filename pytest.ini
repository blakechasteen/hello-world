[pytest]
# HoloLoom pytest configuration
# Fast, isolated, elegant tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output
testpaths = HoloLoom/tests
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Asyncio configuration
asyncio_mode = auto

# Coverage reporting (when using pytest-cov)
[coverage:run]
source = HoloLoom
omit =
    */tests/*
    */demos/*
    */examples/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Performance markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    fast: marks tests as fast (<150ms)
