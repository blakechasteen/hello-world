<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learner Chat - Persistent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 15px 30px;
            border-bottom: 2px solid #00d4ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #00d4ff;
            font-size: 24px;
        }

        .header button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .header button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message.assistant {
            margin-right: auto;
        }

        .message-content {
            background: #1a1a1a;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .message.user .message-content {
            background: #2a5298;
            border-color: #00d4ff;
        }

        .input-area {
            padding: 20px;
            background: #111;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 12px;
        }

        .input-area textarea {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .input-area button {
            background: #2a5298;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .input-area button:hover {
            background: #3a62a8;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            padding: 8px;
            text-align: center;
            background: #1a1a1a;
            font-size: 12px;
            color: #888;
        }

        .status.saved {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💬 Learner Chat - Persistent</h1>
        <button onclick="clearChat()">🗑️ Clear Chat</button>
    </div>

    <div class="status" id="status">Chat history persists across page refreshes</div>

    <div class="chat-container">
        <div class="messages" id="messages"></div>
    </div>

    <div class="input-area">
        <textarea
            id="messageInput"
            placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
            rows="2"
        ></textarea>
        <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>

    <script>
        // Load chat history from localStorage
        function loadHistory() {
            const history = localStorage.getItem('chat_history');
            return history ? JSON.parse(history) : [];
        }

        // Save chat history to localStorage
        function saveHistory(history) {
            localStorage.setItem('chat_history', JSON.stringify(history));
            const status = document.getElementById('status');
            status.textContent = `💾 Saved ${history.length} messages`;
            status.className = 'status saved';
            setTimeout(() => {
                status.textContent = 'Chat history persists across page refreshes';
                status.className = 'status';
            }, 2000);
        }

        // Render messages
        function renderMessages() {
            const messagesDiv = document.getElementById('messages');
            const history = loadHistory();

            messagesDiv.innerHTML = history.map(msg => `
                <div class="message ${msg.role}">
                    <div class="message-content">
                        ${msg.content.replace(/\n/g, '<br>')}
                    </div>
                </div>
            `).join('');

            // Auto-scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Add message to history
        function addMessage(role, content) {
            const history = loadHistory();
            history.push({ role, content, timestamp: new Date().toISOString() });
            saveHistory(history);
            renderMessages();
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addMessage('user', message);
            input.value = '';

            // Disable send button
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Thinking...';

            // Call API (using port 8000 backend)
            try {
                const response = await fetch('http://localhost:11434/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'deepseek-r1:8b',
                        messages: [{ role: 'user', content: message }],
                        stream: false
                    })
                });

                const data = await response.json();
                const reply = data.message?.content || 'Sorry, I had trouble generating a response.';

                addMessage('assistant', reply);
            } catch (error) {
                console.error('Error:', error);
                addMessage('assistant', 'Error: Could not connect to Ollama. Make sure it\'s running on port 11434.');
            }

            // Re-enable send button
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
            input.focus();
        }

        // Clear chat
        function clearChat() {
            if (confirm('Clear all chat history? This cannot be undone.')) {
                localStorage.removeItem('chat_history');
                renderMessages();
                document.getElementById('status').textContent = '🗑️ Chat cleared';
            }
        }

        // Handle Enter key
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Load messages on page load
        renderMessages();

        console.log('💾 Chat persistence enabled via localStorage');
        console.log(`📂 Loaded ${loadHistory().length} messages from history`);
    </script>
</body>
</html>
