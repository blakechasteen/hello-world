<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Details - HoloLoom</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/issues.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a href="../" class="site-logo">HoloLoom</a>
            <ul class="nav-links">
                <li><a href="../">Home</a></li>
                <li><a href="./">Issues</a></li>
                <li><a href="../docs/">Documentation</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <!-- Back to Issues -->
        <div class="back-link">
            <a href="./">← Back to Issues</a>
        </div>

        <!-- Issue Header -->
        <div id="issue-header" class="issue-header">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Issue Body and Sidebar -->
        <div class="issue-detail-wrapper">
            <!-- Main Content -->
            <div class="issue-main">
                <!-- Original Description -->
                <section class="issue-description-section">
                    <div class="issue-description-header">
                        <span class="text-muted">Description</span>
                        <button id="edit-description-btn" class="btn-icon" title="Edit description" style="display: none;">
                            ✏️ Edit
                        </button>
                    </div>
                    <div id="issue-description" class="issue-description">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </section>

                <!-- Edit Description Form (Hidden by default) -->
                <section id="edit-description-form" class="edit-form" style="display: none;">
                    <textarea id="edit-description-textarea" class="form-textarea" rows="12"></textarea>
                    <div class="form-actions">
                        <button id="save-description-btn" class="btn btn-primary">Save</button>
                        <button id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
                    </div>
                </section>

                <!-- Comments Section -->
                <section class="issue-comments-section">
                    <h3>Comments <span id="comment-count" class="badge">0</span></h3>

                    <div id="comments-list" class="comments-list">
                        <!-- Comments will be populated here -->
                    </div>

                    <!-- Add Comment Form -->
                    <div class="add-comment-form">
                        <h4>Add a comment</h4>
                        <form id="add-comment-form">
                            <textarea
                                id="comment-text"
                                class="form-textarea"
                                placeholder="Share your thoughts... Markdown supported"
                                rows="5"
                                required
                            ></textarea>
                            <small class="form-help">
                                Markdown formatting supported: **bold**, *italic*, `code`
                            </small>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Post Comment</button>
                            </div>
                            <div id="comment-error" class="form-error" style="display: none;"></div>
                        </form>
                    </div>
                </section>
            </div>

            <!-- Sidebar -->
            <aside class="issue-sidebar">
                <!-- Status Control -->
                <div class="sidebar-section">
                    <h4>Status</h4>
                    <div id="status-display" class="status-display">
                        <!-- Will be populated by JavaScript -->
                    </div>
                    <button id="toggle-status-btn" class="btn btn-secondary full-width" style="margin-top: 10px;">
                        <!-- Dynamic text -->
                    </button>
                </div>

                <!-- Metadata -->
                <div class="sidebar-section">
                    <h4>Metadata</h4>
                    <div class="metadata-list">
                        <div class="metadata-item">
                            <span class="metadata-label">Component:</span>
                            <span id="issue-component" class="metadata-value">—</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Priority:</span>
                            <span id="issue-priority" class="metadata-value">—</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Created:</span>
                            <span id="issue-created" class="metadata-value">—</span>
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Updated:</span>
                            <span id="issue-updated" class="metadata-value">—</span>
                        </div>
                    </div>
                </div>

                <!-- Labels -->
                <div class="sidebar-section">
                    <h4>Labels</h4>
                    <div id="issue-labels" class="labels-container">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Delete Issue (Admin only) -->
                <div class="sidebar-section">
                    <button id="delete-issue-btn" class="btn btn-danger full-width" style="display: none;">
                        Delete Issue
                    </button>
                </div>
            </aside>
        </div>
    </main>

    <!-- Confirmation Dialog -->
    <div id="confirm-dialog" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="confirm-title">Confirm</h3>
            <p id="confirm-message"></p>
            <div class="modal-actions">
                <button id="confirm-btn" class="btn btn-primary">Confirm</button>
                <button id="cancel-confirm-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>
    <div id="modal-overlay" class="modal-overlay" style="display: none;"></div>

    <footer class="site-footer">
        <p>&copy; 2025 HoloLoom. <a href="../">Back to home</a></p>
    </footer>

    <script src="../assets/js/issues.js"></script>
    <script>
        let currentIssue = null;
        let isEditingDescription = false;

        function getIssueIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id'));
        }

        function showConfirmDialog(title, message, onConfirm) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;

            const dialog = document.getElementById('confirm-dialog');
            const overlay = document.getElementById('modal-overlay');
            const confirmBtn = document.getElementById('confirm-btn');
            const cancelBtn = document.getElementById('cancel-confirm-btn');

            dialog.style.display = 'block';
            overlay.style.display = 'block';

            const handleConfirm = () => {
                dialog.style.display = 'none';
                overlay.style.display = 'none';
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
                onConfirm();
            };

            const handleCancel = () => {
                dialog.style.display = 'none';
                overlay.style.display = 'none';
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
            };

            confirmBtn.addEventListener('click', handleConfirm);
            cancelBtn.addEventListener('click', handleCancel);
        }

        function renderIssue(issue) {
            currentIssue = issue;

            // Header
            const header = document.getElementById('issue-header');
            header.innerHTML = `
                <div class="issue-title-bar">
                    <h1>#${issue.id} ${issue.title}</h1>
                    <div class="issue-status-badge" data-status="${issue.status}">
                        ${issue.status === 'open' ? '🟢 Open' : '🔴 Closed'}
                    </div>
                </div>
            `;

            // Description
            const descriptionHTML = IssuesMarkdown.toHTML(issue.description);
            document.getElementById('issue-description').innerHTML = descriptionHTML;

            // Metadata
            document.getElementById('issue-component').textContent = issue.component || '—';
            document.getElementById('issue-priority').innerHTML = `
                <span class="priority-badge priority-${issue.priority}">
                    ${issue.priority.charAt(0).toUpperCase() + issue.priority.slice(1)}
                </span>
            `;
            document.getElementById('issue-created').textContent = new Date(issue.created).toLocaleDateString();
            document.getElementById('issue-updated').textContent = new Date(issue.updated).toLocaleDateString();

            // Labels
            const labelsContainer = document.getElementById('issue-labels');
            if (issue.labels && issue.labels.length > 0) {
                labelsContainer.innerHTML = issue.labels
                    .map(label => `<span class="label-badge label-${label}">${label}</span>`)
                    .join('');
            } else {
                labelsContainer.innerHTML = '<span class="text-muted">No labels</span>';
            }

            // Status display
            const statusDisplay = document.getElementById('status-display');
            statusDisplay.innerHTML = `<span class="status-badge status-${issue.status}">${issue.status.toUpperCase()}</span>`;

            // Toggle status button
            const toggleBtn = document.getElementById('toggle-status-btn');
            toggleBtn.textContent = issue.status === 'open' ? 'Close Issue' : 'Reopen Issue';

            // Comments
            renderComments(issue);

            // Show/hide edit button (for simplicity, always show in this version)
            document.getElementById('edit-description-btn').style.display = 'block';
        }

        function renderComments(issue) {
            const list = document.getElementById('comments-list');
            const count = document.getElementById('comment-count');

            count.textContent = issue.comments?.length || 0;

            if (!issue.comments || issue.comments.length === 0) {
                list.innerHTML = '<p class="text-muted">No comments yet. Be the first to comment!</p>';
                return;
            }

            list.innerHTML = issue.comments
                .map(comment => `
                    <div class="comment">
                        <div class="comment-header">
                            <span class="comment-author">${escapeHTML(comment.author)}</span>
                            <span class="comment-time">${new Date(comment.timestamp).toLocaleString()}</span>
                            <button class="btn-icon delete-comment-btn" data-comment-id="${comment.id}" title="Delete comment">
                                🗑️
                            </button>
                        </div>
                        <div class="comment-body">
                            ${IssuesMarkdown.toHTML(comment.text)}
                        </div>
                    </div>
                `)
                .join('');

            // Add delete comment handlers
            document.querySelectorAll('.delete-comment-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const commentId = parseInt(btn.dataset.commentId);
                    showConfirmDialog(
                        'Delete Comment',
                        'Are you sure you want to delete this comment?',
                        () => deleteComment(commentId)
                    );
                });
            });
        }

        function deleteComment(commentId) {
            currentIssue.comments = currentIssue.comments.filter(c => c.id !== commentId);
            IssuesManager.updateIssue(currentIssue.id, currentIssue);
            renderComments(currentIssue);
        }

        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            IssuesManager.init();

            const issueId = getIssueIdFromURL();
            if (!issueId) {
                document.body.innerHTML = '<main class="container"><p class="error">Invalid issue ID</p></main>';
                return;
            }

            const issue = IssuesManager.getIssue(issueId);
            if (!issue) {
                document.body.innerHTML = '<main class="container"><p class="error">Issue not found</p></main>';
                return;
            }

            renderIssue(issue);

            // Toggle Status
            document.getElementById('toggle-status-btn').addEventListener('click', () => {
                showConfirmDialog(
                    `${issue.status === 'open' ? 'Close' : 'Reopen'} Issue`,
                    `Are you sure you want to ${issue.status === 'open' ? 'close' : 'reopen'} this issue?`,
                    () => {
                        issue.status = issue.status === 'open' ? 'closed' : 'open';
                        issue.updated = new Date().toISOString();
                        IssuesManager.updateIssue(issue.id, issue);
                        renderIssue(issue);
                    }
                );
            });

            // Edit Description
            document.getElementById('edit-description-btn').addEventListener('click', () => {
                isEditingDescription = !isEditingDescription;
                const form = document.getElementById('edit-description-form');
                const desc = document.querySelector('.issue-description-section');

                if (isEditingDescription) {
                    document.getElementById('edit-description-textarea').value = issue.description;
                    form.style.display = 'block';
                    desc.style.display = 'none';
                } else {
                    form.style.display = 'none';
                    desc.style.display = 'block';
                }
            });

            document.getElementById('save-description-btn').addEventListener('click', () => {
                issue.description = document.getElementById('edit-description-textarea').value.trim();
                issue.updated = new Date().toISOString();
                IssuesManager.updateIssue(issue.id, issue);

                isEditingDescription = false;
                document.getElementById('edit-description-form').style.display = 'none';
                document.querySelector('.issue-description-section').style.display = 'block';
                renderIssue(issue);
            });

            document.getElementById('cancel-edit-btn').addEventListener('click', () => {
                isEditingDescription = false;
                document.getElementById('edit-description-form').style.display = 'none';
                document.querySelector('.issue-description-section').style.display = 'block';
            });

            // Delete Issue
            document.getElementById('delete-issue-btn').addEventListener('click', () => {
                showConfirmDialog(
                    'Delete Issue',
                    'Are you sure? This cannot be undone.',
                    () => {
                        IssuesManager.deleteIssue(issueId);
                        window.location.href = './';
                    }
                );
            });

            // Add Comment
            document.getElementById('add-comment-form').addEventListener('submit', (e) => {
                e.preventDefault();

                const text = document.getElementById('comment-text').value.trim();
                if (!text) return;

                try {
                    const commentId = IssuesManager.addComment(issueId, {
                        author: 'Anonymous',
                        text: text
                    });

                    issue.comments = issue.comments || [];
                    issue.comments.push({
                        id: commentId,
                        author: 'Anonymous',
                        text: text,
                        timestamp: new Date().toISOString()
                    });
                    issue.updated = new Date().toISOString();
                    IssuesManager.updateIssue(issueId, issue);

                    document.getElementById('comment-text').value = '';
                    document.getElementById('comment-error').style.display = 'none';
                    renderComments(issue);
                    renderIssue(issue);
                } catch (error) {
                    const errorDiv = document.getElementById('comment-error');
                    errorDiv.textContent = error.message;
                    errorDiv.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
