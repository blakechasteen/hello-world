setup_commands:
  - cmd: "python -m venv .venv && .venv\\Scripts\\activate"
    desc: "Create virtualenv (Windows)"
  - cmd: "pip install -r requirements.txt"
    desc: "Install dependencies"
  - cmd: "python scripts/verify_setup.py --level quick"
    desc: "Verify setup"
  - cmd: "docker-compose up -d"
    desc: "Start backends (optional)"

server_commands:
  - cmd: "uvicorn hololoom.apps.server.agentic_api:app --port 8000"
    desc: "Start Agentic API (queries, monitoring)"
  - cmd: "uvicorn hololoom.apps.server.agent_manager_api:app --port 8002"
    desc: "Start Agent Manager (threads, swarms)"

testing_commands:
  - cmd: "pytest hololoom/tests/unit/ -v"
