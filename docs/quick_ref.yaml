metadata:
  title: "hololoom Quick Reference"
  version: "1.0"
  tagline: "Kubernetes for AI Agents"
  last_updated: "2025-12-15"

identity:
  positioning: "AI Agent Infrastructure"
  three_pillars:
    - name: "Amplifier"
      desc: "100x cache speedup, 40-90% token savings"
    - name: "Governance"
      desc: "Audit trails, budgets, safety guardrails"
    - name: "Memory"
      desc: "Persistent state that compounds over time"

cli_commands:
  query:
    - cmd: "hololoom query \"What is X?\""
      desc: "Simple query (FAST mode)"
    - cmd: "hololoom query --mode research \"Compare X and Y\""
      desc: "Deep research mode"
    - cmd: "hololoom query --mode verify \"Claim to verify\""
      desc: "Verify a claim"

  agent:
    - cmd: "hololoom agent list"
      desc: "List available agents"
    - cmd: "hololoom agent run --workflow research \"Topic\""
      desc: "Run research workflow"
    - cmd: "hololoom agent status"
      desc: "Check agent status"
    - cmd: "hololoom agent logs --limit 10"
      desc: "View recent logs"

  cluster:
    - cmd: "hololoom cluster status"
      desc: "Cluster health"
    - cmd: "hololoom cluster nodes"
      desc: "List cluster nodes"

modes:
  - name: "BARE"
    latency: "<50ms"
    use_case: "Simple lookups"
  - name: "FAST"
    latency: "<150ms"
    use_case: "Standard queries"
  - name: "FUSED"
