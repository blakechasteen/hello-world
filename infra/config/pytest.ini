[pytest]
# Pytest configuration for Trough & BossPig testing infrastructure
# Week 1-3: Comprehensive test suite for AI slop detection

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths =
    tests
    hololoom/tests
    hololoom/memory/tests
    hololoom/rag/tests
    hololoom/server/tests
    hololoom/agentic/tests
    hololoom/alignment/tests
    hololoom/routing/learning/tests
    hololoom/departments/tests
    hololoom/integrations/langchain/tests
    hololoom/web_dashboard
    hololoom/context
    hololoom/prompting/tests

# Markers for test organization
markers =
    unit: Fast isolated component tests (<5s)
    integration: Multi-component integration tests (<30s)
    e2e: End-to-end pipeline tests (<2min)
    slow: Slow tests (benchmarks, load tests)
    trough: Trough-specific tests
    bosspig: BossPig-specific tests
    fixture: Fixture-related tests
    performance: Performance benchmark tests
    edge_case: Edge case tests
    smoke: Quick smoke tests

# Coverage configuration
addopts =
    --strict-markers
    --verbose
    --tb=short
    -ra

# Timeout settings (in seconds)
timeout = 30
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/logs/pytest.log
log_file_level = DEBUG

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

fail_under = 80
