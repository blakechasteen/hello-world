# HoloLoom Proxy Parameters
# Date: 2025-11-15
# Used by all proxy_pass directives

# Proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $server_name;
proxy_set_header X-Request-ID $request_id;

# Security headers
proxy_set_header X-Client-Cert $ssl_client_cert;
proxy_set_header X-Threat-Level $threat_level;
proxy_set_header X-Rule-ID $rule_id;

# Custom HoloLoom headers
proxy_set_header X-HoloLoom-WAF-Status "active";
proxy_set_header X-HoloLoom-Region $geoip_country_code;

# Proxy connection settings
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 30s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Buffering
proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 4k;
proxy_busy_buffers_size 8k;

# Cache settings
proxy_cache_bypass $http_upgrade;
proxy_no_cache $http_pragma $http_authorization;

# Redirect handling
proxy_redirect off;

# WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
