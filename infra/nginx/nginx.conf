# HoloLoom Nginx Configuration with ModSecurity WAF
# Version: 1.0.0
# Date: 2025-11-15
# Purpose: Reverse proxy with Web Application Firewall protection

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load ModSecurity module
load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security context
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'cs=$ssl_cipher ssl=$ssl_protocol';

    # WAF-specific logging format
    log_format waf_log '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       'modsec=$http_x_modsec_violations '
                       'threat_level=$http_x_threat_level '
                       'rule_id=$http_x_rule_id';

    # Security headers logging
    log_format security_log '$remote_addr - [$time_local] "$request" '
                            'action=$action severity=$severity '
                            'rule_id=$rule_id tags=$tags';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/waf.log waf_log;
    access_log /var/log/nginx/security.log security_log;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # GZip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;

    # Rate limiting by URI pattern
    limit_req_zone $binary_remote_addr$uri zone=per_uri:10m rate=5r/s;

    # Upstream HoloLoom backend
    upstream hololoom_backend {
        least_conn;
        server hololoom:8000 max_fails=3 fail_timeout=30s;
        server hololoom-backup:8000 backup max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Map for threat levels
    map $status $threat_level {
        default "INFO";
        400 "WARNING";
        401 "MEDIUM";
        403 "HIGH";
        429 "CRITICAL";
    }

    # Map for security actions
    map $http_x_modsec_action $action {
        default "PASS";
        "block" "BLOCK";
        "alert" "ALERT";
        "deny" "DENY";
    }

    # Geo-blocking map (loaded from geoip module)
    geo $country {
        default ZZ;
        include /etc/nginx/geo-ip.conf;
    }

    # Whitelist trusted IPs
    geo $trusted_ip {
        default 0;
        include /etc/nginx/whitelist-ips.conf;
    }

    # Server context for HTTPS redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # Main HTTPS server with WAF
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name hololoom.local localhost;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/hololoom.crt;
        ssl_certificate_key /etc/nginx/ssl/hololoom.key;

        # Security headers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Enable OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/hololoom.crt;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'" always;

        # ModSecurity enabled
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsec/main.conf;

        # WAF request context variables
        set $rule_id "";
        set $severity "";
        set $tags "";

        # Geo-blocking: Block countries from blacklist
        if ($country ~* (KP|IR|SY)) {
            return 403;
        }

        # Block requests from non-trusted IPs during high-risk operations
        location /api/admin {
            if ($trusted_ip = 0) {
                return 403;
            }
            proxy_pass http://hololoom_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # Rate limiting for general endpoints
        location / {
            limit_req zone=general burst=20 nodelay;

            # Block if too many rate limit violations
            if ($status = 429) {
                return 429;
            }

            proxy_pass http://hololoom_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # API endpoint with stricter rate limiting
        location /api {
            limit_req zone=api burst=10 nodelay;

            # ModSecurity specific rules for API
            modsecurity_rules '
                SecRule REQUEST_METHOD "^(GET|POST|PUT|DELETE)$" "phase:2,pass,nolog"
                SecRule REQUEST_HEADERS:Content-Type "!^(application/json|application/x-www-form-urlencoded|multipart/form-data)" "phase:2,deny,status:400,msg:\"Invalid Content-Type\""
            ';

            proxy_pass http://hololoom_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # Login endpoint with rate limiting
        location /auth/login {
            limit_req zone=login burst=3 nodelay;

            proxy_pass http://hololoom_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # File upload with validation
        location /api/upload {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 50M;

            # ModSecurity rules for file uploads
            modsecurity_rules '
                SecRule FILES_SIZES "@gt 52428800" "phase:2,deny,status:413,msg:\"File too large\""
                SecRule FILES_NAMES "@rx \.(exe|bat|cmd|com|dll|msi|scr|vbs|js)$" "phase:2,deny,status:400,msg:\"Executable file type not allowed\""
            ';

            proxy_pass http://hololoom_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # Health check endpoint (bypass WAF)
        location /health {
            modsecurity off;
            access_log off;

            proxy_pass http://hololoom_backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # Metrics endpoint (restricted access)
        location /metrics {
            if ($trusted_ip = 0) {
                return 403;
            }
            modsecurity off;

            proxy_pass http://hololoom_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # Status page (internal only)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }

        # Block common attack patterns
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /\.well-known {
            allow all;
        }

        # Block access to sensitive files
        location ~ \.(env|conf|sql|db|bak|backup)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Error pages
        error_page 400 /400.html;
        error_page 401 /401.html;
        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 405 /405.html;
        error_page 413 /413.html;
        error_page 429 /429.html;
        error_page 500 502 503 504 /500.html;

        # Custom error page location
        location ~ ^/[0-9]{3}\.html$ {
            internal;
            default_type text/html;
            alias /usr/share/nginx/html$request_filename;
        }
    }

    # Server for WAF rule testing/debugging
    server {
        listen 8080 default_server;
        server_name localhost;

        location /test {
            modsecurity on;
            modsecurity_rules_file /etc/nginx/modsec/test.conf;

            default_type text/plain;
            return 200 "WAF test endpoint\n";
        }
    }

    # Include additional configuration files
    include /etc/nginx/conf.d/*.conf;
}
