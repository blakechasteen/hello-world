services:
  # Neo4j - Graph Database
  neo4j:
    image: neo4j:5.15.0
    container_name: hololoom-neo4j
    ports:
      # SECURITY: Bind to localhost only - access via internal network
      - "127.0.0.1:7474:7474"  # HTTP (admin only)
      - "127.0.0.1:7687:7687"  # Bolt (admin only)
    environment:
      # SECURITY: Password from environment - no defaults
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD environment variable is required}
      - NEO4J_PLUGINS=["apoc"]
      # SECURITY: Whitelist only necessary APOC procedures (not apoc.*)
      - NEO4J_dbms_security_procedures_unrestricted=apoc.path.*,apoc.cypher.*,apoc.coll.*,apoc.text.*
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - hololoom
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: hololoom-qdrant
    ports:
      # SECURITY: Bind to localhost only - access via internal network
      - "127.0.0.1:6333:6333"  # HTTP API (admin only)
      - "127.0.0.1:6334:6334"  # gRPC API (admin only)
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hololoom
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HoloLoom API Server (production deployment)
  hololoom-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hololoom-api
    ports:
      - "8000:8000"  # API server
      - "8001:8001"  # Workflow executor
      - "9090:9090"  # Prometheus metrics
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_HOST=emotion-intelligence
      - NODE_PORT=3000
      - PYTHONPATH=/app
      - HOLOLOOM_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=9090
    volumes:
      - ./HoloLoom:/app/HoloLoom:ro
      - ./demos:/app/demos:ro
      - hololoom_logs:/app/logs
      - hololoom_cache:/app/.cache
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      emotion-intelligence:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hololoom
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn HoloLoom.server.agentic_api:app --host 0.0.0.0 --port 8000 --workers 4

  # Node.js Emotional Intelligence Service (110/100 system)
  emotion-intelligence:
    build:
      context: .
      dockerfile: docker/Dockerfile.emotion
    container_name: emotion-intelligence
    ports:
      - "3000:3000"  # Emotion analysis API
      - "9091:9091"  # Prometheus metrics
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FUSION_STRATEGY=bayesian
      - META_MODE=full_meta
      - PLANNING_STRATEGY=adaptive
      - PROMETHEUS_ENABLED=true
      - METRICS_PORT=9091
    volumes:
      - ./HoloLoom/voice_ux:/app/voice_ux:ro
      - emotion_logs:/app/logs
    networks:
      - hololoom
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis Cache (for query caching and session state)
  redis:
    image: redis:7.2-alpine
    container_name: hololoom-redis
    ports:
      # SECURITY: Bind to localhost only - access via internal network
      - "127.0.0.1:6379:6379"
    # SECURITY: Require password authentication
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
    volumes:
      - redis_data:/data
    networks:
      - hololoom
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: hololoom-prometheus
    ports:
      - "9092:9090"  # Using 9092 to avoid conflict with HoloLoom metrics
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - hololoom-api
      - emotion-intelligence
    networks:
      - hololoom
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.1.0
    container_name: hololoom-grafana
    ports:
      - "3001:3000"  # Grafana UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # SECURITY: No default password - must be set in environment
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD environment variable is required}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hololoom
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  qdrant_data:
    driver: local
  hololoom_logs:
    driver: local
  hololoom_cache:
    driver: local
  emotion_logs:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  hololoom:
    driver: bridge