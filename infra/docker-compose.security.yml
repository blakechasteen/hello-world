version: '3.8'

# HoloLoom Security Infrastructure
# Complete stack for production deployment
# Usage: docker-compose -f docker-compose.security.yml up -d

services:
  # Redis - Distributed rate limiting + RBAC storage
  redis:
    image: redis:7-alpine
    container_name: hololoom-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hololoom-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Redis Replica - High availability
  redis-replica:
    image: redis:7-alpine
    container_name: hololoom-redis-replica
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis-replica-data:/data
    command: redis-server --replicaof redis 6379
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hololoom-network

  # PostgreSQL - Forensic logs + audit trail
  postgres:
    image: postgres:15-alpine
    container_name: hololoom-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hololoom_security
      POSTGRES_USER: ${POSTGRES_USER:-hololoom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./postgres/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hololoom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hololoom-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Neo4j - Advanced RBAC + knowledge graph
  neo4j:
    image: neo4j:5.14-community
    container_name: hololoom-neo4j
    restart: always
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hololoom-network

  # Qdrant - Vector storage
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: hololoom-qdrant
    restart: always
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hololoom-network

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: hololoom-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hololoom-network
    depends_on:
      - redis
      - postgres

  # Grafana - Dashboards + visualization
  grafana:
    image: grafana/grafana:10.2.2
    container_name: hololoom-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hololoom-network
    depends_on:
      - prometheus

  # Nginx - WAF + reverse proxy
  nginx:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: hololoom-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./waf/modsecurity.conf:/etc/modsecurity.d/modsecurity.conf:ro
      - ./waf/owasp-crs.conf:/etc/modsecurity.d/owasp-crs/crs-setup.conf:ro
      - ./waf/custom-rules.conf:/etc/modsecurity.d/custom-rules.conf:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hololoom-network
    depends_on:
      - hololoom-api

  # Splunk - SIEM (optional, comment out if using ELK/Datadog)
  splunk:
    image: splunk/splunk:9.1
    container_name: hololoom-splunk
    restart: always
    ports:
      - "8000:8000"  # Web UI
      - "8088:8088"  # HEC (HTTP Event Collector)
      - "9997:9997"  # Forwarder
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    volumes:
      - splunk-data:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/en-US/account/login"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hololoom-network

  # HoloLoom API - Main application
  hololoom-api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    container_name: hololoom-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Database connections
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER:-hololoom}:${POSTGRES_PASSWORD}@postgres:5432/hololoom_security
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      # Security secrets
      API_KEY_SECRET: ${API_KEY_SECRET}
      USER_HASH_SALT: ${USER_HASH_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}

      # OAuth2 providers
      OAUTH2_AUTH0_CLIENT_ID: ${OAUTH2_AUTH0_CLIENT_ID}
      OAUTH2_AUTH0_CLIENT_SECRET: ${OAUTH2_AUTH0_CLIENT_SECRET}
      OAUTH2_OKTA_CLIENT_ID: ${OAUTH2_OKTA_CLIENT_ID}
      OAUTH2_OKTA_CLIENT_SECRET: ${OAUTH2_OKTA_CLIENT_SECRET}

      # SIEM
      SIEM_BACKEND: ${SIEM_BACKEND:-splunk}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
      SPLUNK_ENDPOINT: http://splunk:8088

      # Alerting
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      PAGERDUTY_API_KEY: ${PAGERDUTY_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}

      # Application
      ENVIRONMENT: production
      LOG_LEVEL: info
      WORKERS: 4
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hololoom-network
    depends_on:
      - redis
      - postgres
      - neo4j
      - qdrant
      - prometheus
      - splunk

networks:
  hololoom-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  redis-data:
  redis-replica-data:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  qdrant-data:
  prometheus-data:
  grafana-data:
  splunk-data:
  splunk-etc:
  nginx-logs:
