apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    orgId: 1
    url: http://elasticsearch:9200
    password: 'elastic'
    user: 'elastic'
    database: ''
    basicAuth: true
    isDefault: false
    jsonData:
      esVersion: '8.0.0'
      logMessageField: message
      logLevelField: level
      timeField: '@timestamp'
      timeInterval: 10s
      maxConcurrentShardRequests: 5
      httpMethod: GET
    readOnly: false
    editable: true
    uid: elasticsearch
    secureJsonData:
      basicAuthPassword: 'elastic'
