# ModSecurity Configuration for HoloLoom
# Version: 2.9.x / 3.x compatible
# Date: 2025-11-15
# Reference: https://github.com/SpiderLabs/ModSecurity/wiki/Reference-Manual

# ============================================================================
# CORE CONFIGURATION
# ============================================================================

# Enable ModSecurity
SecEngine On

# Set processing mode
# - On: Process rules (default, production mode)
# - DetectionOnly: Log violations without blocking
SecAuditEngine On
SecAuditLogFormat JSON

# Set audit log type
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log

# Debug log (only for development)
# SecDebugLog /var/log/modsec/debug.log
# SecDebugLogLevel 3

# ============================================================================
# REQUEST/RESPONSE BODY HANDLING
# ============================================================================

# Process request bodies
SecRequestBodyAccess On
SecRequestBodyLimit 131072          # 128 KB
SecRequestBodyNoFilesLimit 1048576  # 1 MB
SecRequestBodyLimitAction ProcessPartial
SecRequestBodyProcessor URLENCODED
SecRequestBodyProcessor JSON

# Process response bodies
SecResponseBodyAccess On
SecResponseBodyLimit 524288         # 512 KB
SecResponseBodyLimitAction ProcessPartial
SecResponseBodyProcessor JSON

# Store payloads for analysis
SecTmpDir /var/tmp/modsec
SecDataDir /var/lib/modsec

# ============================================================================
# ARGUMENT HANDLING
# ============================================================================

# Argument separators
SecArgumentSeparator &
SecCookieFormat 0

# Argument processing
SecArgsLimit 1000
SecArgsLimitAction ProcessPartial

# Handle URL-encoded parameters
SecCollectionTimeout 600

# ============================================================================
# PAYLOAD INSPECTION
# ============================================================================

# Inspect request headers
SecInspectRequestHeaders On

# Inspect response headers
SecInspectResponseHeaders On

# Inspect request body
SecInspectRequestBodyOnModDelivery On

# Inspect response body
SecInspectResponseBodyOnModDelivery On

# ============================================================================
# ENCODING HANDLING
# ============================================================================

# Character encoding
SecUnicodeMapFile unicode.mapping 20127

# Handle various encodings
SecDecodingMode TrimLeft TrimRight UnifySlashes DecodeUTF8

# ============================================================================
# KNOWN EXTENSIONS
# ============================================================================

# List of known request file extensions
SecKnownExtensions .pdf .asp .aspx .class .cer .cgi .com .exe .jsp .jspx \
    .java .jar .jhtml .js .jsw .jspf .php .phtml .php3 .php4 .php5 .php7 \
    .pht .phar .pl .plx .pm .py .pyx .rb .rhtml .run .sh .so .sql .txt \
    .war .xml .zip .action .do .go .groovy .groovy .jspf .lasso .less .lua \
    .njs .node .vb .vcf .vbhtml .xhtml .scala .clj .cljs .cljx .edn .ftl \
    .gsp .gsx .gvy .html .htm .hta .htc .htr .htx .inc .info .jad .jax .jee \
    .jnlp .jsp .jspx .jst .jsx .dhtml .kml .kmz .mako .pl .psgi .py .pyx \
    .rake .rjs .rpy .rxml .shtml .tmpl .tpl .vm .vmx .vsd .webp .wtf .yaws

# ============================================================================
# ANOMALY SCORING
# ============================================================================

# Anomaly scoring mode (CRS v3 compatible)
SecAnomalyScoreThreshold 5

# Score adjustments (used with CRS)
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecDefaultAction "phase:3,log,auditlog,pass"
SecDefaultAction "phase:4,log,auditlog,pass"
SecDefaultAction "phase:5,log,auditlog,pass"

# ============================================================================
# PHASE CONFIGURATION
# ============================================================================

# Phase 1: Request headers are processed
# Phase 2: Request body is processed
# Phase 3: Response headers are processed
# Phase 4: Response body is processed
# Phase 5: Post-process (logging)

# ============================================================================
# RULES PROCESSING
# ============================================================================

# Disable currently disabled rulesets
SecMarker BEGIN-DISABLED-RULES
# Rules can be disabled by ID using ctl:ruleEngine=Off

# ============================================================================
# VARIABLES AND TRANSFORMATIONS
# ============================================================================

# Common transformations
# - lowercase: Convert to lowercase
# - replaceComments: Remove comments
# - removeComments: Remove comments
# - removeWhitespace: Remove whitespace
# - compressWhitespace: Compress whitespace
# - trimLeft: Trim left whitespace
# - trimRight: Trim right whitespace
# - trim: Trim whitespace
# - replaceNulls: Replace null bytes
# - htmlEntityDecode: Decode HTML entities
# - urlDecodeUni: URL decode (Unicode)
# - utf8toUnicode: UTF-8 to Unicode

# ============================================================================
# RESPONSE MONITORING
# ============================================================================

# Monitor response headers for suspicious patterns
SecRule RESPONSE_STATUS "@eq 200" \
    "id:10001,phase:3,pass,nolog,skipAfter:END-RESPONSE-MONITORING"

SecMarker END-RESPONSE-MONITORING

# ============================================================================
# MULTIPART/FORM-DATA HANDLING
# ============================================================================

# Handle file uploads
SecTmpSaveUploadedFiles On
SecUploadDir /var/lib/modsec/uploads
SecUploadFileMode 0600

# File upload limits
SecUploadFileLimit 100         # Maximum files in single upload
SecMaxFileSize 52428800        # 50 MB max file size

# ============================================================================
# CUSTOM ERROR MESSAGES
# ============================================================================

# Define error page template
SecErrorDocument 400 '400: Bad Request'
SecErrorDocument 401 '401: Unauthorized'
SecErrorDocument 403 '403: Access Denied'
SecErrorDocument 404 '404: Not Found'
SecErrorDocument 405 '405: Method Not Allowed'
SecErrorDocument 413 '413: Payload Too Large'
SecErrorDocument 429 '429: Too Many Requests'
SecErrorDocument 500 '500: Internal Server Error'

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Audit log format
SecAuditLogFormat JSON

# Log relevant parts
SecAuditLogParts ABDEFHIJZ

# ABDEFHIJZ:
# A - Audit log header (mandatory)
# B - Request headers
# C - Request body
# D - Reserved
# E - Response headers
# F - Response body
# G - Reserved
# H - Audit log trailer
# I - Compact log information (ModSec 2.6+)
# J - Informational messages
# K - Encrypted multipart files
# Z - Final boundary

# Conditional logging (log only on violations)
SecAuditLogRelevantStatus "^(?:4|5)"

# ============================================================================
# VARIABLE SETTINGS
# ============================================================================

# Client IP sources
SecRemoteIpInternalProxy 10.0.0.0/8
SecRemoteIpInternalProxy 172.16.0.0/12
SecRemoteIpInternalProxy 192.168.0.0/16
SecRemoteIpInternalProxy 127.0.0.1
SecRemoteIpTrustProxy On

# Cookie handling
SecCookieFormat 0
SecCookieV0Separator Off

# Request size limits
SecMaxRequestSize 10485760      # 10 MB
SecMaxPostSize 10485760         # 10 MB

# ============================================================================
# COMPATIBILITY
# ============================================================================

# XML handling
SecXmlExternalEntity Off

# Allow # character in URLs
SecAllowMissingQuotes On

# ============================================================================
# INCLUDE RULESETS
# ============================================================================

# Include OWASP Core Rule Set
Include /etc/nginx/modsec/owasp-crs.conf

# Include HoloLoom custom rules
Include /etc/nginx/modsec/custom-rules.conf

# Include whitelist rules
Include /etc/nginx/modsec/whitelist.conf

# ============================================================================
# RATE LIMITING RULES
# ============================================================================

# Detect and rate limit excessive requests
SecRule IP:global_request_count "@gt 100" \
    "id:11001,phase:1,deny,status:429,msg:\"Rate limit exceeded\",nolog"

# Reset counter hourly
SecRule &IP:global_request_count "@gt 0" \
    "id:11002,phase:5,pass,nolog,setvar:ip.global_request_count=%{IP:global_request_count}+1,expirevar:ip.global_request_count=3600"

SecRule REQUEST_METHOD "!^$" \
    "id:11003,phase:1,pass,nolog,setvar:ip.global_request_count=%{IP:global_request_count}+1,expirevar:ip.global_request_count=3600"

# ============================================================================
# GEOLOCATION RULES
# ============================================================================

# Block high-risk countries
SecRule GEO:COUNTRY_CODE "@rx ^(KP|IR|SY)$" \
    "id:12001,phase:1,deny,status:403,msg:\"Geographic restriction\",tag:geo-block"

# Log geolocation
SecRule GEO:COUNTRY_CODE "!@rx ^(US|CA|GB|AU|NZ|DE|FR|JP)$" \
    "id:12002,phase:1,log,msg:\"Request from %{GEO:COUNTRY_CODE}\",tag:geo-tracking"

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
