# OWASP Core Rule Set for ModSecurity
# Version: 3.3.x compatible
# Date: 2025-11-15
# Reference: https://coreruleset.org/

# This configuration implements OWASP Top 10 protection rules

# ============================================================================
# CRS SETTINGS
# ============================================================================

# Paranoia Level (1-4)
# Level 1: Standard protection (minimal false positives)
# Level 2: Increased sensitivity (some false positives expected)
# Level 3: Aggressive detection (more false positives)
# Level 4: Maximum sensitivity (many false positives likely)
SecRule &PARANOIA_LEVEL "@eq 0" \
    "id:900000,phase:1,pass,nolog,setvar:tx.paranoia_level=1"

# Anomaly scoring mode (1 = anomaly scoring, 0 = traditional)
SecRule &ANOMALY_SCORING "@eq 0" \
    "id:900001,phase:1,pass,nolog,setvar:tx.anomaly_scoring=1"

# Executing paranoia level
SecRule &EXECUTING_PARANOIA_LEVEL "@eq 0" \
    "id:900010,phase:1,pass,nolog,setvar:tx.executing_paranoia_level=%{tx.paranoia_level}"

# ============================================================================
# CRS VARIABLES
# ============================================================================

# Initialize anomaly scores
SecRule &tx.inbound_anomaly_score "@eq 0" \
    "id:900020,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score=0"

SecRule &tx.outbound_anomaly_score "@eq 0" \
    "id:900021,phase:1,pass,nolog,setvar:tx.outbound_anomaly_score=0"

# ============================================================================
# RULE 1: SQL INJECTION DETECTION
# ID: 942xxx
# ============================================================================

# Detect common SQL injection patterns
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY|!HEADERS:User-Agent \
    "@rx (?i:union|select|insert|delete|update|drop|create|alter|exec|execute|script|javascript|onclick|onerror|onload|prompt|alert)" \
    "id:942100,phase:2,deny,status:403,msg:\"SQL Injection attempt detected\",tag:SQL-INJECTION,tag:OWASP-A1,severity:8"

# SQL comments detection
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:(--|#|/\*|\*/|;|\b(or|and)\b))" \
    "id:942110,phase:2,chain,msg:\"SQL injection attempt detected\""
    SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:(select|union|insert|delete|update|drop))" \
        "id:942111,phase:2,deny,status:403,tag:SQL-INJECTION,tag:OWASP-A1,severity:8"

# Blind SQL injection attempts
SecRule REQUEST_BODY|ARGS "@rx (?i:(sleep|benchmark|waitfor))\(" \
    "id:942120,phase:2,deny,status:403,msg:\"Blind SQL injection detected\",tag:SQL-INJECTION,tag:OWASP-A1,severity:8"

# Time-based blind SQL injection
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:sleep\s*\(\s*\d+\)|benchmark\s*\(\s*\d+)" \
    "id:942130,phase:2,deny,status:403,msg:\"Time-based blind SQL injection\",tag:SQL-INJECTION,tag:OWASP-A1,severity:8"

# ============================================================================
# RULE 2: CROSS-SITE SCRIPTING (XSS) DETECTION
# ID: 941xxx
# ============================================================================

# Basic XSS patterns
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY|!HEADERS:Content-Type "@rx (?i:<script|javascript:|onerror=|onload=|onclick=|onmouseover=|<iframe|<embed|<object)" \
    "id:941100,phase:2,deny,status:403,msg:\"XSS Attack detected\",tag:XSS,tag:OWASP-A3,severity:8"

# HTML/Script tag detection
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:<(?:script|img|svg|iframe|object|embed)[^>]*>)" \
    "id:941110,phase:2,chain,msg:\"XSS attack pattern detected\""
    SecRule &WHITELISTED_XSS_PARAM "@eq 0" \
        "id:941111,phase:2,deny,status:403,tag:XSS,tag:OWASP-A3,severity:8"

# JavaScript protocol detection
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:javascript:|vbscript:|data:text/html)" \
    "id:941120,phase:2,deny,status:403,msg:\"JavaScript protocol detected\",tag:XSS,tag:OWASP-A3,severity:8"

# Event handler detection
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:on(?:load|error|click|mouse|focus|blur|change|submit)=)" \
    "id:941130,phase:2,deny,status:403,msg:\"Event handler XSS detected\",tag:XSS,tag:OWASP-A3,severity:8"

# Unicode/encoded XSS
SecRule ARGS "@rx (?:%3cscript|%3Cscript|&#60;script|&#x3c;script)" \
    "id:941140,phase:2,deny,status:403,msg:\"Encoded XSS attack\",tag:XSS,tag:OWASP-A3,severity:8"

# ============================================================================
# RULE 3: PATH TRAVERSAL DETECTION
# ID: 930xxx
# ============================================================================

# Unix path traversal
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY|REQUEST_URI "@rx (?:\.\.\/|\.\.\\\\|%2e%2e\/|%2e%2e\\\\)" \
    "id:930100,phase:2,deny,status:403,msg:\"Path traversal attack detected\",tag:PATH-TRAVERSAL,tag:OWASP-A1,severity:8"

# Windows path traversal
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY|REQUEST_URI "@rx (?:\.\.\\\\|\.\.\/|\\\\\.\.)" \
    "id:930110,phase:2,deny,status:403,msg:\"Windows path traversal\",tag:PATH-TRAVERSAL,tag:OWASP-A1,severity:8"

# File system escape attempts
SecRule REQUEST_URI "@rx (?:etc/passwd|windows/system32|boot\.ini|web\.config)" \
    "id:930120,phase:2,deny,status:403,msg:\"System file access attempt\",tag:PATH-TRAVERSAL,tag:OWASP-A1,severity:8"

# Null byte injection
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY|REQUEST_URI "@rx %00|\\x00" \
    "id:930130,phase:2,deny,status:403,msg:\"Null byte injection detected\",tag:PATH-TRAVERSAL,tag:OWASP-A1,severity:7"

# ============================================================================
# RULE 4: COMMAND INJECTION DETECTION
# ID: 932xxx
# ============================================================================

# Common command injection patterns
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:(sh|bash|cmd|powershell|perl|python|ruby)\s*[;&|`$(])" \
    "id:932100,phase:2,deny,status:403,msg:\"Shell command injection detected\",tag:COMMAND-INJECTION,tag:OWASP-A1,severity:8"

# Command chaining operators
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?:[;&|`$()\\n\\r]|&&|\\|\\||>;|<)" \
    "id:932110,phase:2,chain,msg:\"Command chaining detected\""
    SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:(bin/|cmd\.exe|powershell|bash|sh|whoami|id|ifconfig))" \
        "id:932111,phase:2,deny,status:403,tag:COMMAND-INJECTION,tag:OWASP-A1,severity:8"

# System command execution
SecRule ARGS|HEADERS|COOKIES|REQUEST_BODY "@rx (?i:exec\(|system\(|passthru\(|shell_exec\(|proc_open\()" \
    "id:932120,phase:2,deny,status:403,msg:\"System execution function detected\",tag:COMMAND-INJECTION,tag:OWASP-A1,severity:8"

# ============================================================================
# RULE 5: LOCAL FILE INCLUSION (LFI) DETECTION
# ID: 930xxx
# ============================================================================

# LFI patterns
SecRule ARGS|REQUEST_URI "@rx (?i:file=|page=|load=|document=|read=|include=|require=|include_once=|require_once=)" \
    "id:930200,phase:2,chain,msg:\"LFI attempt detected\""
    SecRule ARGS "@rx (?:\.\.\/|\.\.\\\\|etc/passwd|windows/system32)" \
        "id:930201,phase:2,deny,status:403,tag:LFI,tag:OWASP-A1,severity:8"

# Protocol wrappers
SecRule ARGS|REQUEST_BODY "@rx (?i:php://|file://|data://|zlib://|glob://|phar://)" \
    "id:930210,phase:2,deny,status:403,msg:\"Protocol wrapper detected\",tag:LFI,tag:OWASP-A1,severity:8"

# Remote file inclusion
SecRule ARGS|REQUEST_BODY "@rx (?i:http://|https://|ftp://|//)" \
    "id:930220,phase:2,chain,msg:\"Remote file inclusion attempt\""
    SecRule REQUEST_URI "@rx (?i:(?:include|require|load|file|document)=)" \
        "id:930221,phase:2,deny,status:403,tag:RFI,tag:OWASP-A1,severity:8"

# ============================================================================
# RULE 6: FILE UPLOAD ATTACKS
# ID: 933xxx
# ============================================================================

# Executable file upload
SecRule FILES_NAMES "@rx (?i:\.(exe|bat|cmd|com|dll|msi|scr|vbs|js|jar|zip|rar|7z|gz|tar)$)" \
    "id:933100,phase:2,deny,status:403,msg:\"Executable file upload blocked\",tag:FILE-UPLOAD,tag:OWASP-A4,severity:8"

# PHP file upload
SecRule FILES_NAMES "@rx (?i:\.(php|php3|php4|php5|php7|phtml|phar)$)" \
    "id:933110,phase:2,deny,status:403,msg:\"PHP file upload blocked\",tag:FILE-UPLOAD,tag:OWASP-A4,severity:8"

# Archive file upload
SecRule FILES_NAMES "@rx (?i:\.(zip|rar|7z|tar|gz|bzip2)$)" \
    "id:933120,phase:2,deny,status:403,msg:\"Archive file upload blocked\",tag:FILE-UPLOAD,tag:OWASP-A4,severity:7"

# File upload size limit
SecRule FILES_SIZES "@gt 52428800" \
    "id:933130,phase:2,deny,status:413,msg:\"File size exceeds limit\",tag:FILE-UPLOAD,tag:OWASP-A4,severity:7"

# ============================================================================
# RULE 7: ANTIVIRUS SCANNING
# ID: 933xxx (continued)
# ============================================================================

# Detect suspicious patterns in uploaded files
SecRule FILES_TMPNAMES "@inspectFile /usr/bin/file" \
    "id:933140,phase:2,chain,msg:\"File type validation failed\""
    SecRule INSPECTION_RESULT "@rx (?i:executable|script|archive)" \
        "id:933141,phase:2,deny,status:403,tag:FILE-UPLOAD,tag:OWASP-A4,severity:8"

# ============================================================================
# RULE 8: CROSS-SITE REQUEST FORGERY (CSRF) PROTECTION
# ID: 940xxx
# ============================================================================

# CSRF token validation (requires token in POST/PUT/DELETE)
SecRule REQUEST_METHOD "@rx ^(POST|PUT|DELETE|PATCH)$" \
    "id:940100,phase:1,chain,msg:\"Missing CSRF token\""
    SecRule &CSRF_TOKEN "@eq 0" \
        "id:940101,phase:1,deny,status:403,tag:CSRF,tag:OWASP-A8,severity:7"

# ============================================================================
# RULE 9: AUTHENTICATION ATTACK DETECTION
# ID: 920xxx
# ============================================================================

# Brute force detection (>10 failed login attempts)
SecRule LOGIN_FAILED_COUNT "@gt 10" \
    "id:920100,phase:1,deny,status:429,msg:\"Brute force attack detected\",tag:BRUTE-FORCE,tag:OWASP-A2,severity:8"

# Credential stuffing detection
SecRule REQUEST_URI "@rx /(?:login|signin|authenticate)" \
    "id:920110,phase:1,chain,msg:\"Login attempt from suspicious source\""
    SecRule IP:FAILED_LOGIN_COUNT "@gt 5" \
        "id:920111,phase:1,deny,status:429,tag:BRUTE-FORCE,tag:OWASP-A2,severity:8"

# ============================================================================
# RULE 10: PROTOCOL ATTACK DETECTION
# ID: 921xxx
# ============================================================================

# Invalid HTTP method
SecRule REQUEST_METHOD "!@rx ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH|CONNECT|TRACE)$" \
    "id:921100,phase:1,deny,status:405,msg:\"Invalid HTTP method\",tag:PROTOCOL-ATTACK,tag:OWASP-A3,severity:7"

# Invalid HTTP version
SecRule SERVER_PROTOCOL "!@rx ^HTTP/(?:1\.0|1\.1|2\.0)$" \
    "id:921110,phase:1,deny,status:400,msg:\"Invalid HTTP version\",tag:PROTOCOL-ATTACK,tag:OWASP-A3,severity:6"

# Missing Host header
SecRule &REQUEST_HEADERS:Host "@eq 0" \
    "id:921120,phase:1,deny,status:400,msg:\"Missing Host header\",tag:PROTOCOL-ATTACK,tag:OWASP-A3,severity:6"

# ============================================================================
# ANOMALY SCORING
# ============================================================================

# Count violations and calculate anomaly score
SecRule &tx.inbound_anomaly_score "@eq 0" \
    "id:942999,phase:2,pass,nolog,setvar:tx.inbound_anomaly_score=0"

# Final anomaly check (threshold: 5)
SecRule tx.inbound_anomaly_score "@ge 5" \
    "id:949000,phase:2,deny,status:403,msg:\"Anomaly score exceeded\",tag:ANOMALY-SCORE,severity:9"

# ============================================================================
# LOGGING AND TRACKING
# ============================================================================

# Initialize violation counter
SecRule &VIOLATIONS_COUNT "@eq 0" \
    "id:990010,phase:5,pass,nolog,setvar:ip.violations_count=0"

# Increment violation counter
SecRule RESPONSE_STATUS "@ge 400" \
    "id:990020,phase:5,pass,nolog,setvar:ip.violations_count=%{ip.violations_count}+1,expirevar:ip.violations_count=3600"

# Block on too many violations (>50 per hour)
SecRule ip.violations_count "@gt 50" \
    "id:990030,phase:1,deny,status:429,msg:\"Too many violations detected\",tag:DOS-PROTECTION"

# ============================================================================
# END OF OWASP CRS RULES
# ============================================================================
