# HoloLoom Geo-IP Blocking Configuration
# Version: 1.0.0
# Date: 2025-11-15
# Purpose: Geographic IP filtering and blocking rules

# ============================================================================
# COUNTRY CODE REFERENCE
# ============================================================================
# Standard ISO 3166-1 alpha-2 country codes
# This file uses those codes for blocking/allowing regions

# ============================================================================
# BLACKLISTED COUNTRIES (High-risk regions)
# ============================================================================
# These countries are blocked by default due to sanctions or high threat level

# North Korea (KP), Iran (IR), Syria (SY)
# Note: Comply with your local regulations and international law

# ============================================================================
# GEO-IP DATABASE CONFIGURATION (Nginx geo module)
# ============================================================================

# This file is sourced by Nginx to populate the $country variable
# To use this file, install and configure the GeoIP2 module:
#
# 1. Install GeoIP2 database:
#    apt-get install geoip2-database
#
# 2. Download MaxMind database:
#    wget https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=YOUR_KEY -O /usr/share/GeoIP/GeoLite2-Country.mmdb
#
# 3. Configure Nginx:
#    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
#        $country iso_code;
#    }

# ============================================================================
# COUNTRY BLOCKING LIST (Default: Block high-risk countries)
# ============================================================================

# KP = North Korea (blocked due to sanctions)
KP 1;

# IR = Iran (blocked due to sanctions)
IR 1;

# SY = Syria (blocked due to sanctions)
SY 1;

# CU = Cuba (blocked due to sanctions)
CU 1;

# ============================================================================
# WHITELIST EXCEPTIONS (Allow specific countries)
# ============================================================================

# US = United States (allowed)
US 0;

# CA = Canada (allowed)
CA 0;

# GB = United Kingdom (allowed)
GB 0;

# AU = Australia (allowed)
AU 0;

# NZ = New Zealand (allowed)
NZ 0;

# DE = Germany (allowed)
DE 0;

# FR = France (allowed)
FR 0;

# JP = Japan (allowed)
JP 0;

# SG = Singapore (allowed)
SG 0;

# HK = Hong Kong (allowed)
HK 0;

# ============================================================================
# RESTRICTED COUNTRIES (Require authentication)
# ============================================================================

# CN = China (restricted - requires authentication)
# Users from China must authenticate before accessing
CN 2;

# RU = Russia (restricted)
# Note: May be updated based on current geopolitical situation
RU 2;

# IN = India (allowed, but monitor)
IN 0;

# BR = Brazil (allowed)
BR 0;

# MX = Mexico (allowed)
MX 0;

# ============================================================================
# VPN/PROXY DETECTION
# ============================================================================

# ZZ = Unknown/VPN/Proxy (potentially dangerous)
# Users from unidentified locations (VPNs, proxies) should be logged
ZZ 3;

# ============================================================================
# RATE LIMITING BY COUNTRY
# ============================================================================

# These settings define different rate limits for different regions:
# 0 = allowed (full access)
# 1 = blocked (403 Forbidden)
# 2 = restricted (requires authentication)
# 3 = monitored (allowed but logged, rate limited)

# ============================================================================
# NOTES FOR IMPLEMENTATION
# ============================================================================

# To implement geo-blocking in Nginx with GeoIP2:
#
# 1. Install GeoIP2 module:
#    apt-get install nginx-geoip2
#
# 2. Add to nginx.conf main block:
#    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
#        $country iso_code;
#    }
#
# 3. Use in server block:
#    if ($country ~* (KP|IR|SY)) {
#        return 403;
#    }
#
# 4. For restricted countries, require auth:
#    if ($country = "CN") {
#        if ($http_authorization = "") {
#            return 401;
#        }
#    }
#
# 5. Log geo-blocking:
#    access_log /var/log/nginx/geo.log geo_log_format;

# ============================================================================
# EMERGENCY COUNTRY BLOCKING (Manual override)
# ============================================================================

# Temporarily block countries during attacks
# Uncomment to activate (remember to comment out after emergency)

# BD = Bangladesh (temporary block during DDoS)
# BD 1;

# PK = Pakistan (temporary block)
# PK 1;

# ============================================================================
# REGIONAL GROUPING
# ============================================================================

# For convenience, here are regions by typical security posture:

# HIGH-TRUST (Western countries):
# US, CA, GB, AU, NZ, DE, FR, IT, ES, SE, NO, FI, DK, NL, AT, CH, BE, LU

# MEDIUM-TRUST (Developed/developing economies):
# JP, SG, HK, KR, NZ, AU, TW, IN, BR, MX, TR, UAE, SA, IL, ZA

# LOW-TRUST (High fraud/attack risk):
# CN, RU, KP, IR, SY, CU

# UNKNOWN (VPN/Proxy):
# ZZ

# ============================================================================
# IMPLEMENTATION CHECKLIST
# ============================================================================

# Before deploying geo-blocking:
# [ ] Obtain MaxMind GeoIP2 database license
# [ ] Install GeoIP2 module and database
# [ ] Test with VPN from each region
# [ ] Verify legitimate users can still access
# [ ] Monitor false positives in logs
# [ ] Document business/compliance requirements
# [ ] Set up monitoring alerts for geo-block hits
# [ ] Implement appeals process for false positives
# [ ] Consider GDPR compliance for logging IP data
# [ ] Test fallback behavior if GeoIP database unavailable

# ============================================================================
# PERFORMANCE NOTES
# ============================================================================

# GeoIP2 lookups are cached by Nginx (minimal performance impact)
# Typical latency: <1ms per request
# Memory usage: ~50MB for GeoIP2 database
# Database updates: Recommended monthly

# ============================================================================
# COMPLIANCE CONSIDERATIONS
# ============================================================================

# GDPR: Log geo-IP blocking for compliance (EU)
# CCPA: Respect California privacy laws
# Sanctions: Comply with OFAC/EU/UN sanctions lists
# Business: Document business rationale for country blocks
# Appeals: Provide process for false positive appeals

# ============================================================================
# END OF GEO-IP CONFIGURATION
