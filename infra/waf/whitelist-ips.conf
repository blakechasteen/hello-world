# ============================================================================
# NOTES
# ============================================================================

# 1. Entry format: <IP or CIDR> <value>;
#    - value = 1 means trusted/allowed
#    - value = 0 means not trusted (default)

# 2. CIDR blocks are supported:
#    - 192.168.1.0/24 covers 192.168.1.0 to 192.168.1.255
#    - Use /32 for single IPs (optional, /32 is default)

# 3. IPv6 addresses are also supported:
#    - ::1 is IPv6 loopback
#    - 2001:db8::/32 is IPv6 documentation prefix

# 4. Order doesn't matter (Nginx optimizes lookup)

# 5. Comments are stripped (lines starting with #)

# 6. To add your organization's IP:
#    - Get your public IP: curl ifconfig.me
#    - Add as: YOUR_IP 1;

