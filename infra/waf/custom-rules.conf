# HoloLoom Custom WAF Rules
# Version: 1.0.0
# Date: 2025-11-15
# Purpose: Custom rules for HoloLoom-specific threats

# ============================================================================
# HOLOLOOM API PROTECTION
# ============================================================================

# Protect /api endpoints
SecRule REQUEST_URI "@beginsWith /api" \
    "id:50001,phase:1,pass,nolog,setvar:is_api=1"

# API request validation
SecRule is_api "@eq 1" \
    "id:50002,phase:2,chain,msg:\"Invalid API request\""
    SecRule REQUEST_METHOD "@rx ^(GET|POST|PUT|DELETE|PATCH)$" \
        "id:50003,phase:2,pass,nolog"

# API rate limiting (more strict than general)
SecRule is_api "@eq 1" \
    "id:50004,phase:1,pass,nolog,setvar:api_request_count=%{ip.api_request_count}+1,expirevar:ip.api_request_count=60"

SecRule ip.api_request_count "@gt 100" \
    "id:50005,phase:1,deny,status:429,msg:\"API rate limit exceeded\",tag:RATE-LIMIT,severity:5"

# ============================================================================
# QUERY INJECTION PREVENTION (HoloLoom Specific)
# ============================================================================

# Protect weaving orchestrator queries
SecRule REQUEST_URI "@rx /api/weave|/api/query|/api/reason" \
    "id:51001,phase:2,chain,msg:\"Suspicious query parameters\""
    SecRule ARGS:query|REQUEST_BODY "@rx (?i:(drop|delete|truncate|alter)\s+(table|database))" \
        "id:51002,phase:2,deny,status:403,tag:QUERY-INJECTION,tag:HOLOLOOM,severity:8"

# Prevent memory injection attacks
SecRule REQUEST_URI "@rx /api/memory" \
    "id:51010,phase:2,chain,msg:\"Memory injection attempt\""
    SecRule REQUEST_BODY "@rx (?i:(memory_address|pointer|heap|stack|buffer))" \
        "id:51011,phase:2,deny,status:403,tag:MEMORY-ATTACK,tag:HOLOLOOM,severity:9"

# ============================================================================
# EMBEDDING POISONING PREVENTION
# ============================================================================

# Protect embedding endpoints
SecRule REQUEST_URI "@rx /api/embedding|/api/embed" \
    "id:52001,phase:2,pass,nolog,setvar:is_embedding_api=1"

# Validate embedding dimensions
SecRule is_embedding_api "@eq 1" \
    "id:52002,phase:2,chain,msg:\"Invalid embedding dimensions\""
    SecRule REQUEST_BODY "@rx \"dimension\":\s*(?:[^0-9]|[0-9]{5,})" \
        "id:52003,phase:2,deny,status:400,tag:EMBEDDING-ATTACK,tag:HOLOLOOM,severity:6"

# Detect embedding poisoning patterns (unusual payload sizes)
SecRule is_embedding_api "@eq 1" \
    "id:52010,phase:2,chain,msg:\"Embedding payload size anomaly\""
    SecRule CONTENT_LENGTH "@gt 10485760" \
        "id:52011,phase:2,deny,status:413,tag:EMBEDDING-ATTACK,tag:HOLOLOOM,severity:7"

# ============================================================================
# KNOWLEDGE GRAPH PROTECTION
# ============================================================================

# Protect graph endpoints
SecRule REQUEST_URI "@rx /api/graph|/api/knowledge|/api/yarn" \
    "id:53001,phase:2,pass,nolog,setvar:is_graph_api=1"

# Detect graph traversal attacks
SecRule is_graph_api "@eq 1" \
    "id:53002,phase:2,chain,msg:\"Graph traversal attack detected\""
    SecRule ARGS:depth "@gt 100" \
        "id:53003,phase:2,deny,status:403,tag:GRAPH-ATTACK,tag:HOLOLOOM,severity:6"

# Prevent malicious node creation
SecRule is_graph_api "@eq 1" \
    "id:53010,phase:2,chain,msg:\"Malicious graph node\""
    SecRule REQUEST_BODY "@rx (?i:(shellcode|payload|backdoor|rootkit))" \
        "id:53011,phase:2,deny,status:403,tag:GRAPH-ATTACK,tag:HOLOLOOM,severity:8"

# ============================================================================
# REFLECTION BUFFER PROTECTION
# ============================================================================

# Protect reflection/learning endpoints
SecRule REQUEST_URI "@rx /api/reflect|/api/learn|/api/feedback" \
    "id:54001,phase:2,pass,nolog,setvar:is_learning_api=1"

# Prevent feedback poisoning
SecRule is_learning_api "@eq 1" \
    "id:54002,phase:2,chain,msg:\"Feedback poisoning attempt\""
    SecRule REQUEST_BODY "@rx (?i:(label|score)\":\s*(-[0-9]+|[0-9]{3,}))" \
        "id:54003,phase:2,deny,status:400,tag:FEEDBACK-ATTACK,tag:HOLOLOOM,severity:6"

# Rate limit learning endpoints (important for training stability)
SecRule is_learning_api "@eq 1" \
    "id:54010,phase:1,pass,nolog,setvar:learning_request_count=%{ip.learning_request_count}+1,expirevar:ip.learning_request_count=60"

SecRule ip.learning_request_count "@gt 30" \
    "id:54011,phase:1,deny,status:429,msg:\"Learning endpoint rate limit\",tag:RATE-LIMIT,tag:HOLOLOOM,severity:5"

# ============================================================================
# AUTHENTICATION TOKEN PROTECTION
# ============================================================================

# Validate authentication headers
SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9\-_=.]{50,}$" \
    "id:55001,phase:1,pass,nolog,setvar:valid_token=1"

SecRule REQUEST_HEADERS:Authorization "@beginsWith Bearer" \
    "id:55002,phase:1,chain,msg:\"Invalid bearer token format\""
    SecRule valid_token "@eq 0" \
        "id:55003,phase:1,deny,status:401,tag:AUTH-ATTACK,tag:HOLOLOOM,severity:7"

# Prevent token reuse attacks
SecRule REQUEST_HEADERS:Authorization \
    "id:55010,phase:1,chain,msg:\"Possible token replay\""
    SecRule &http_x_token_timestamp "@eq 0" \
        "id:55011,phase:1,pass,nolog,setvar:http.x_token_timestamp=%{time_offset}"

SecRule http.x_token_timestamp "@gt 3600" \
    "id:55012,phase:1,deny,status:401,msg:\"Token expired\",tag:AUTH-ATTACK,tag:HOLOLOOM,severity:6"

# ============================================================================
# PROMPT INJECTION PREVENTION
# ============================================================================

# Detect prompt injection in query parameters
SecRule REQUEST_URI "@rx /api/query|/api/weave" \
    "id:56001,phase:2,chain,msg:\"Prompt injection attempt\""
    SecRule ARGS:query|ARGS:text|REQUEST_BODY "@rx (?i:(ignore|forget|override|sys:|system:|root:|admin:))" \
        "id:56002,phase:2,deny,status:403,tag:PROMPT-INJECTION,tag:HOLOLOOM,severity:8"

# Detect instruction override attempts
SecRule ARGS:query|ARGS:text|REQUEST_BODY "@rx (?i:(disregard previous|instead of|follow this|new instruction|updated instruction))" \
    "id:56010,phase:2,deny,status:403,msg:\"Instruction override detected\",tag:PROMPT-INJECTION,tag:HOLOLOOM,severity:8"

# Detect context injection (asking for internal state)
SecRule ARGS:query|ARGS:text|REQUEST_BODY "@rx (?i:(show me|print|return|export).*(system|config|setting|token|password|key|secret))" \
    "id:56020,phase:2,deny,status:403,msg:\"Context injection detected\",tag:PROMPT-INJECTION,tag:HOLOLOOM,severity:8"

# ============================================================================
# MALICIOUS PAYLOAD DETECTION
# ============================================================================

# Detect known malware signatures in requests
SecRule REQUEST_BODY|ARGS "@rx (?i:(mimikatz|metasploit|msfvenom|shellcode|opcodes))" \
    "id:57001,phase:2,deny,status:403,msg:\"Malware signature detected\",tag:MALWARE,tag:HOLOLOOM,severity:9"

# Detect encoded payloads
SecRule REQUEST_BODY "@rx (?:[A-Za-z0-9+/]{100,}={0,2})" \
    "id:57010,phase:2,chain,msg:\"Suspicious base64 payload\""
    SecRule REQUEST_BODY "@inspectFile /usr/bin/file" \
        "id:57011,phase:2,deny,status:403,tag:MALWARE,tag:HOLOLOOM,severity:8"

# ============================================================================
# DENIAL OF SERVICE PREVENTION
# ============================================================================

# Prevent zip bomb attacks on file upload
SecRule REQUEST_URI "@rx /api/upload" \
    "id:58001,phase:2,chain,msg:\"Zip bomb detected\""
    SecRule FILES_NAMES "@rx (?i:\.(zip|rar|7z)$)" \
        "id:58002,phase:2,chain"
        SecRule FILES_TMPNAMES "@inspectFile /usr/bin/file" \
            "id:58003,phase:2,deny,status:403,tag:DOS-ATTACK,tag:HOLOLOOM,severity:8"

# Prevent algorithmic complexity attacks
SecRule ARGS:query|REQUEST_BODY "@rx (?i:(recursive|repeat|loop)).{0,20}(?:1000|10000|100000)" \
    "id:58010,phase:2,deny,status:403,msg:\"Algorithmic complexity attack\",tag:DOS-ATTACK,tag:HOLOLOOM,severity:7"

# Prevent large graph traversal (DoS via expensive computation)
SecRule ARGS:depth "@gt 50" \
    "id:58020,phase:2,deny,status:403,msg:\"Graph depth limit exceeded\",tag:DOS-ATTACK,tag:HOLOLOOM,severity:6"

# ============================================================================
# SUSPICIOUS USER AGENT DETECTION
# ============================================================================

# Block known malicious user agents
SecRule REQUEST_HEADERS:User-Agent "@rx (?i:(sqlmap|nikto|nmap|nessus|masscan|shodan|metasploit))" \
    "id:59001,phase:1,deny,status:403,msg:\"Known scanning tool detected\",tag:SCANNING,tag:HOLOLOOM,severity:7"

# Block missing or suspicious user agents
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:59010,phase:1,pass,nolog,setvar:suspicious_request=1"

SecRule REQUEST_METHOD "@rx ^(POST|PUT|DELETE)$" \
    "id:59011,phase:1,chain,msg:\"Missing user agent on state-changing request\""
    SecRule suspicious_request "@eq 1" \
        "id:59012,phase:1,deny,status:403,tag:SCANNING,tag:HOLOLOOM,severity:6"

# ============================================================================
# RESPONSE FILTERING
# ============================================================================

# Hide sensitive information in error responses
SecRule RESPONSE_STATUS "@ge 400" \
    "id:60001,phase:4,pass,nolog,ctl:ruleRemoveByTag=ERROR-DETAILS"

# Redact database errors
SecRule RESPONSE_BODY "@rx (?i:(sql|mysql|postgresql|oracle|error|exception))" \
    "id:60010,phase:4,pass,nolog,ctl:ruleModifySecAction:id:60010;ctl:setvar:response_sanitized=1"

SecRule response_sanitized "@eq 1" \
    "id:60011,phase:4,pass,nolog,ctl:ruleModifySecAction:id:60011;msg:\"Error details redacted\""

# ============================================================================
# WHITELIST EXCEPTIONS
# ============================================================================

# Allow health check without WAF restrictions
SecRule REQUEST_URI "@eq /health" \
    "id:60100,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Allow metrics endpoint (but require authentication)
SecRule REQUEST_URI "@eq /metrics" \
    "id:60110,phase:1,pass,nolog"

# ============================================================================
# THREAT SCORING
# ============================================================================

# Initialize threat score
SecRule &THREAT_SCORE "@eq 0" \
    "id:61001,phase:1,pass,nolog,setvar:tx.threat_score=0"

# Increment threat score on violations
SecRule RESPONSE_STATUS "@ge 403" \
    "id:61010,phase:5,pass,nolog,setvar:tx.threat_score=%{tx.threat_score}+1"

# Log high threat scores
SecRule tx.threat_score "@gt 5" \
    "id:61020,phase:5,log,msg:\"High threat score: %{tx.threat_score}\",tag:THREAT-ASSESSMENT,tag:HOLOLOOM"

# ============================================================================
# END OF CUSTOM HOLOLOOM RULES
# ============================================================================
