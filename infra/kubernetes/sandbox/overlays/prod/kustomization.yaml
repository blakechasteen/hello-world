# CARTS Sandbox Production Overlay
# ==================================
# Production environment configuration
#
# Features:
# - Full resource allocation
# - Maximum security enforcement
# - Metrics and monitoring enabled
# - Strict timeouts
# - Cost tracking enabled
#
# Author: CARTS Team
# Date: 2025-12-09

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Extend base
resources:
  - ../../base

# Environment-specific namespace suffix
nameSuffix: -prod

# Environment labels
commonLabels:
  environment: prod
  carts.hololoom.dev/tier: production

# Cost tracking annotations
commonAnnotations:
  carts.hololoom.dev/cost-center: production
  carts.hololoom.dev/project: carts
  carts.hololoom.dev/budget: redteam

# Patches for production configuration
patches:
  # Full resource limits
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1024Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/ephemeral-storage
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
    target:
      kind: Job
      name: carts-sandbox-job

  # Strict timeout
  - patch: |-
      - op: replace
        path: /spec/activeDeadlineSeconds
        value: 180
    target:
      kind: Job
      name: carts-sandbox-job

  # Always pull latest image in prod
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Job
      name: carts-sandbox-job

# ConfigMap patches
configMapGenerator:
  - name: carts-sandbox-config
    behavior: merge
    literals:
      - TIMEOUT_SECONDS=180
      - MAX_MEMORY_MB=1024
      - LOG_LEVEL=WARNING
      - METRICS_ENABLED=true
      - COST_TRACKING_ENABLED=true
