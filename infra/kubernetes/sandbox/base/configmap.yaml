# CARTS Sandbox ConfigMap
# ========================
# Configuration for sandbox workloads
#
# Author: CARTS Team
# Date: 2025-12-09

apiVersion: v1
kind: ConfigMap
metadata:
  name: carts-sandbox-config
  namespace: carts
  labels:
    app.kubernetes.io/name: carts-sandbox
data:
  # Sandbox configuration
  SANDBOX_MODE: "isolated"
  PYTHONPATH: "/workspace"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

  # Resource limits (read by sandbox runtime)
  TIMEOUT_SECONDS: "300"
  MAX_MEMORY_MB: "512"
  MAX_CPU_PERCENT: "100"

  # Network policy
  NETWORK_ENABLED: "false"
  ALLOWED_HOSTS: ""
  ALLOWED_PORTS: ""

  # Output configuration
  OUTPUT_DIR: "/output"
  WORKSPACE_DIR: "/workspace"
