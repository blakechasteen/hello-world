# CARTS Sandbox Job Template
# ===========================
# Template for sandbox execution jobs
#
# Author: CARTS Team
# Date: 2025-12-09

apiVersion: batch/v1
kind: Job
metadata:
  name: carts-sandbox-job
  namespace: carts
  labels:
    app.kubernetes.io/name: carts-sandbox
    app.kubernetes.io/component: job
spec:
  # Auto-cleanup after 1 hour
  ttlSecondsAfterFinished: 3600

  # No retries - fail fast
  backoffLimit: 0

  # Max execution time
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app.kubernetes.io/name: carts-sandbox
        app.kubernetes.io/component: job
    spec:
      # Use sandbox service account
      serviceAccountName: carts-sandbox
      automountServiceAccountToken: false

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Don't restart on failure
      restartPolicy: Never

      containers:
        - name: sandbox
          image: hololoom/carts-sandbox:latest
          imagePullPolicy: IfNotPresent

          # Command to execute (override at runtime)
          command: ["python", "-c", "print('sandbox ready')"]

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: carts-sandbox-config

          # Resource limits
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            requests:
              cpu: "250m"
              memory: "256Mi"

          # Security context
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Volume mounts
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: output
              mountPath: /output
            - name: tmp
              mountPath: /tmp

      # Volumes
      volumes:
        - name: workspace
          emptyDir: {}
        - name: output
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
