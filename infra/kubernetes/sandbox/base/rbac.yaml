# CARTS Sandbox RBAC Configuration
# ==================================
# Minimal permissions for sandbox workloads
#
# Author: CARTS Team
# Date: 2025-12-09

---
# Service Account for sandbox pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carts-sandbox
  namespace: carts
  labels:
    app.kubernetes.io/name: carts-sandbox

---
# Role with minimal permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: carts-sandbox-role
  namespace: carts
rules:
  # Read-only access to ConfigMaps (for config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Read-only access to own secrets
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["carts-sandbox-secrets"]
    verbs: ["get"]
  # No access to other resources - sandboxed by default

---
# Bind role to service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: carts-sandbox-binding
  namespace: carts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: carts-sandbox-role
subjects:
  - kind: ServiceAccount
    name: carts-sandbox
    namespace: carts
