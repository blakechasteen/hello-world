# hololoom API Kubernetes Deployment
# Production API server with autoscaling

apiVersion: v1
kind: ConfigMap
metadata:
  name: hololoom-config
  namespace: hololoom
data:
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  PYTHONPATH: "/app"
  HOLOLOOM_ENV: "production"

---
apiVersion: v1
kind: Secret
metadata:
  name: hololoom-secrets
  namespace: hololoom
  annotations:
    # SECURITY: Replace placeholder before applying
    # Use: kubectl create secret generic hololoom-secrets --from-literal=NEO4J_PASSWORD="YOUR_PASSWORD" -n hololoom
type: Opaque
stringData:
  NEO4J_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"

---
apiVersion: v1
kind: Service
metadata:
  name: hololoom-api
  namespace: hololoom
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: hololoom-api
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hololoom-api
  namespace: hololoom
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hololoom-api
  template:
    metadata:
      labels:
        app: hololoom-api
    spec:
      containers:
        - name: hololoom-api
          image: hololoom/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: hololoom-config
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hololoom-secrets
                  key: NEO4J_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hololoom-api-hpa
  namespace: hololoom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hololoom-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
