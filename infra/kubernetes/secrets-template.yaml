# hololoom Kubernetes Secrets Template
# ==============================================================================
# SECURITY: This is a TEMPLATE file - DO NOT commit with real values!
#
# Usage:
#   1. Copy this file to secrets.yaml (which is gitignored)
#   2. Fill in your actual secret values
#   3. Apply: kubectl apply -f secrets.yaml -n hololoom
#
# Or create secrets directly via kubectl:
#   kubectl create secret generic hololoom-secrets \
#     --from-literal=NEO4J_PASSWORD="your-secure-password" \
#     --from-literal=GRAFANA_PASSWORD="your-grafana-password" \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..." \
#     --from-literal=OPENAI_API_KEY="sk-..." \
#     -n hololoom
#
# IMPORTANT: Ensure secrets.yaml is in .gitignore!
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: hololoom-secrets
  namespace: hololoom
  labels:
    app: hololoom
    component: secrets
  annotations:
    # SECURITY WARNING: Replace ALL placeholder values before applying
    description: "hololoom production secrets - DO NOT commit real values"
type: Opaque
stringData:
  # ==============================================================================
  # Database Credentials (REQUIRED)
  # ==============================================================================

  # Neo4j password - must match NEO4J_AUTH in neo4j deployment
  # Minimum 8 characters, mix of letters/numbers/symbols recommended
  NEO4J_PASSWORD: ""  # REQUIRED: Set your Neo4j password

  # ==============================================================================
  # Monitoring Credentials (REQUIRED)
  # ==============================================================================

  # Grafana admin password
  # Used for accessing Grafana dashboard at /grafana
  GRAFANA_PASSWORD: ""  # REQUIRED: Set your Grafana admin password

  # ==============================================================================
  # LLM API Keys (Optional - required for LLM features)
  # ==============================================================================

  # Anthropic API key for Claude models
  # Get from: https://console.anthropic.com/
  ANTHROPIC_API_KEY: ""  # Optional: Set for Claude integration

  # OpenAI API key for GPT models
  # Get from: https://platform.openai.com/api-keys
  OPENAI_API_KEY: ""  # Optional: Set for OpenAI integration

---
# ==============================================================================
# SECURITY NOTES:
# ==============================================================================
#
# 1. NEVER commit this file with real values to version control
#
# 2. Consider using external secret management:
#    - HashiCorp Vault: https://www.vaultproject.io/
#    - AWS Secrets Manager + External Secrets Operator
#    - Azure Key Vault + CSI Driver
#    - Google Secret Manager + External Secrets
#
# 3. For production, consider:
#    - Rotating secrets regularly (every 90 days)
#    - Using separate secrets for different environments
#    - Enabling audit logging for secret access
#    - Using RBAC to restrict secret access
#
# 4. Verify secrets are encrypted at rest in your cluster:
#    kubectl get secrets hololoom-secrets -n hololoom -o yaml
#
# ==============================================================================
