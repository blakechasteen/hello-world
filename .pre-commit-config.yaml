# Pre-commit hooks configuration for HoloLoom
# Automated code quality checks on every commit
#
# Setup instructions:
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files  # first run
#
# Philosophy: "Reliable Systems: Safety First"
# - Fail fast on errors
# - Auto-fix where possible (black, isort, trailing-whitespace)
# - Provide clear error messages for manual fixes
# - Skip slow checks in local pre-commit (run in CI instead)

default_language_version:
  python: python3.8  # Minimum supported version

default_stages: [commit]
fail_fast: false  # Don't stop on first failure, show all issues

repos:
  # ============================================================================
  # STANDARD CHECKS: File formatting, syntax validation, merge conflicts
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-args=--blanks]  # Preserve blank lines in markdown
        stages: [commit]

      # Fix missing newline at end of files
      - id: end-of-file-fixer
        stages: [commit]

      # Validate YAML syntax
      - id: check-yaml
        args: [--unsafe]  # Allow ! tags for custom YAML
        exclude: ^(\.github/|\.pre-commit-config\.yaml)
        stages: [commit]

      # Validate JSON syntax
      - id: check-json
        args: [--autofix]
        stages: [commit]

      # Prevent large files from being committed (500kb limit)
      - id: check-added-large-files
        args: [--maxkb=500]
        stages: [commit]

      # Detect merge conflict markers
      - id: check-merge-conflict
        stages: [commit]

      # Detect mixed line ending
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [commit]

      # Detect Python 2 to Python 3 migration issues
      - id: check-ast
        stages: [commit]

      # Check that private keys are not committed
      - id: detect-private-key
        stages: [commit]

  # ============================================================================
  # PYTHON CODE FORMATTING: Black (official formatter)
  # ============================================================================
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.8
        args: [--line-length=100]
        stages: [commit]

  # ============================================================================
  # PYTHON LINTING: Ruff (fast linting, replaces flake8)
  # Rules: F (Pyflakes), E/W (pycodestyle), I (isort), C (mccabe complexity)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: [--fix, --line-length=100]
        stages: [commit]
      - id: ruff-format
        args: [--line-length=100]
        stages: [commit]

  # ============================================================================
  # IMPORT SORTING: isort (organize imports)
  # ============================================================================
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args:
          - --profile
          - black
          - --line-length
          - "100"
        stages: [commit]

  # ============================================================================
  # TYPE CHECKING: mypy (optional but recommended)
  # NOTE: Run in CI for full effectiveness (slow on local)
  # ============================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-requests]
        args:
          - --ignore-missing-imports
          - --no-implicit-optional
          - --warn-redundant-casts
          - --warn-unused-ignores
        exclude: ^(tests/|setup.py|HoloLoom/tests/)
        stages: [manual]  # Run manually or in CI: pre-commit run --hook-stage manual

  # ============================================================================
  # PYTHON SECURITY: Bandit (detect security issues)
  # NOTE: Run in CI for full effectiveness (slow on local)
  # ============================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args:
          - -ll  # Only report medium/high severity issues
          - --skip
          - B101  # Skip assert_used (common in tests)
        exclude: ^(tests/|setup.py|HoloLoom/tests/)
        stages: [manual]  # Run manually or in CI

  # ============================================================================
  # MARKDOWN LINTING: markdownlint (consistency and best practices)
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: [--fix]
        stages: [commit]

  # ============================================================================
  # GIT: Conventional Commits (enforce commit message format)
  # Types: feat, fix, docs, test, perf, refactor, style, chore, ci, build, revert
  # ============================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v2.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --force-atom
          - --scope-regex=\(.*\)|\[.*\]
          - --force-atom

  # ============================================================================
  # GIT: Prevent commits to main/master branches
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: no-commit-to-branches
        args: [--branch, main, --branch, master]
        stages: [commit]

  # ============================================================================
  # DEPENDENCIES: Check for vulnerable packages (optional)
  # Uncomment if safety is installed: pip install safety
  # ============================================================================
  # - repo: https://github.com/Lucas-C/pre-commit-hooks
  #   rev: v1.5.4
  #   hooks:
  #     - id: python-safety-dependencies-check
  #       args: [--groups, develop]
  #       stages: [commit]

# ============================================================================
# Configuration for tools without dedicated pre-commit repos
# ============================================================================

# Black configuration (if needed, can also use pyproject.toml)
# black:
#   line-length: 100
#   target-version: ['py38']
#   include: '\.pyi?$'
#   exclude: |
#     /(
#       \.git
#       | \.hg
#       | \.mypy_cache
#       | \.tox
#       | \.venv
#       | _build
#       | buck-out
#       | build
#       | dist
#     )/

# Ruff configuration (if needed, can also use pyproject.toml)
# ruff:
#   line-length: 100
#   target-version: 'py38'
#   select: ['F', 'E', 'W', 'I', 'C']
#   ignore: ['E501']

# isort configuration (if needed, can also use pyproject.toml)
# isort:
#   profile: black
#   line_length: 100
#   multi_line_mode: 3
#   include_trailing_comma: true
#   force_grid_wrap: 0
#   use_parentheses: true
#   ensure_newline_before_comments: true

# mypy configuration (if needed, can also use mypy.ini or setup.cfg)
# mypy:
#   python_version: '3.8'
#   warn_return_any: true
#   warn_unused_configs: true
#   ignore_missing_imports: true

# markdownlint configuration (see .markdownlintrc for details)
# Rules:
#   MD003 (heading style): consistent
#   MD007 (list indent): 2 spaces
#   MD013 (line length): 100 chars
#   MD029 (list markers): ordered (1, 2, 3...)

