# Pre-commit hooks for HoloLoom
# Run with: pre-commit run --all-files

repos:
  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3.11
        args: ['--line-length=100']

  # Ruff - Fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      # Run linter
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
      # Run formatter
      - id: ruff-format

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.txt)$
      - id: end-of-file-fixer
        exclude: ^(.*\.md|.*\.txt)$
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix', '--indent=2']
        exclude: ^(package-lock\.json)$

  # Python-specific checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: ['--pytest-test-first']
        exclude: ^HoloLoom/tests/unit/test_.*\.py$

  # MyPy - Type checking (optional, can be slow)
  # Uncomment to enable type checking on commit
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.18.2
  #   hooks:
  #     - id: mypy
  #       args: ['--ignore-missing-imports', '--no-strict-optional']
  #       additional_dependencies: ['types-all']
  #       exclude: ^(tests/|demos/|examples/)

# Configuration
default_language_version:
  python: python3.11

# Exclude patterns
exclude: |
  (?x)(
    ^archive/|
    ^\.git/|
    ^node_modules/|
    ^__pycache__/|
    .*\.pyc$|
    ^\.pytest_cache/|
    ^htmlcov/|
    ^\.venv/|
    ^venv/|
    ^build/|
    ^dist/|
    ^\.mypy_cache/|
    ^\.ruff_cache/
  )
