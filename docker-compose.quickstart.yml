# hololoom Quickstart - Minimal deployment that just works
#
# Usage:
#   docker-compose -f docker-compose.quickstart.yml up -d
#
# Access:
#   - hololoom API: http://localhost:8000
#   - Neo4j Browser: http://localhost:7474 (neo4j/hololoom)
#   - Qdrant Dashboard: http://localhost:6333/dashboard
#
# Test:
#   curl http://localhost:8000/health
#
# Stop:
#   docker-compose -f docker-compose.quickstart.yml down
#
# See docs/SELF_HOSTING.md for full documentation

services:
  # Neo4j - Knowledge Graph Database
  neo4j:
    image: neo4j:5.14.0-community
    container_name: hololoom-neo4j
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/hololoom
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - hololoom_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: hololoom-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - hololoom_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # hololoom API
  hololoom:
    image: python:3.11-slim
    container_name: hololoom-api
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=hololoom
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # LLM (optional - set in host environment)
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./hololoom:/app/hololoom:ro
      - ./demos:/app/demos:ro
      - ./requirements.txt:/app/requirements.txt:ro
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    command: >
      bash -c "
        pip install --no-cache-dir -q torch numpy gymnasium fastapi uvicorn httpx aiohttp &&
        pip install --no-cache-dir -q networkx qdrant-client neo4j sentence-transformers &&
        pip install --no-cache-dir -q anthropic openai ollama 2>/dev/null || true &&
        echo '✓ Dependencies installed' &&
        echo '✓ Starting hololoom API on http://localhost:8000' &&
        uvicorn hololoom.apps.server.agentic_api:app --host 0.0.0.0 --port 8000
      "

volumes:
  hololoom_neo4j:
  hololoom_qdrant:
