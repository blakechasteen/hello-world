version: '3.8'

services:
  # ============================================================================
  # Jaeger All-in-One
  # ============================================================================
  #
  # Complete Jaeger deployment with:
  # - Agent (receives traces via Thrift)
  # - Collector (aggregates traces)
  # - Query (serves UI and API)
  # - In-memory storage (for development)
  #
  # Production Note: For production, use separate services with persistent storage
  # (Cassandra, Elasticsearch, or Kafka)
  # ============================================================================

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: hololoom-jaeger
    hostname: jaeger

    environment:
      # Storage
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=100000

      # Collector settings
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_GRPC_HOST_PORT=:4317
      - COLLECTOR_OTLP_HTTP_HOST_PORT=:4318

      # Query settings
      - QUERY_BASE_PATH=/
      - QUERY_MAX_CLOCK_SKEW_ADJUSTMENT=0s

      # Sampling
      - SAMPLING_STRATEGIES_FILE=/etc/jaeger/sampling_strategies.json

      # Log level
      - LOG_LEVEL=info

    ports:
      # Agent ports (Thrift)
      - "6831:6831/udp"  # Compact Thrift (default for Python client)
      - "6832:6832/udp"  # Binary Thrift
      - "5778:5778"      # HTTP config

      # Collector ports
      - "14268:14268"    # HTTP collector
      - "14250:14250"    # gRPC collector
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP

      # Query UI
      - "16686:16686"    # Jaeger UI (http://localhost:16686)

      # Zipkin compatibility
      - "9411:9411"      # Zipkin HTTP

    volumes:
      # Mount sampling strategies
      - ./config/jaeger-sampling.json:/etc/jaeger/sampling_strategies.json:ro

    networks:
      - hololoom-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    labels:
      com.hololoom.service: "distributed-tracing"
      com.hololoom.component: "jaeger"
      com.hololoom.description: "Distributed tracing with Jaeger"

  # ============================================================================
  # Optional: Jaeger Agent (for sidecar pattern)
  # ============================================================================
  #
  # Uncomment to deploy agent as separate sidecar container
  # Useful for microservices architecture where each service has local agent
  # ============================================================================

  # jaeger-agent:
  #   image: jaegertracing/jaeger-agent:1.51
  #   container_name: hololoom-jaeger-agent
  #   hostname: jaeger-agent
  #
  #   command:
  #     - "--reporter.grpc.host-port=jaeger:14250"
  #     - "--log-level=info"
  #
  #   ports:
  #     - "6831:6831/udp"
  #     - "6832:6832/udp"
  #     - "5778:5778"
  #
  #   networks:
  #     - hololoom-network
  #
  #   depends_on:
  #     - jaeger
  #
  #   restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================

networks:
  hololoom-network:
    name: hololoom-network
    driver: bridge
    external: false

# ============================================================================
# Volumes (for persistent storage in production)
# ============================================================================
#
# For production, uncomment and use persistent storage:
# ============================================================================

# volumes:
#   jaeger-cassandra-data:
#     driver: local
#   jaeger-elasticsearch-data:
#     driver: local
