name: meta-prompt
version: 1.0.0
description: Transform casual prompts into structured GPT-5/Claude ready prompts using the 7-component framework
author: Promptly Team
created: 2025-11-10
tags: [meta, preprocessing, gpt5, claude, structure, enhancement]

# Skill configuration
config:
  model: claude-3-5-haiku-20241022  # Fast and cheap for preprocessing
  temperature: 0.3  # Lower for structured output
  max_tokens: 2048
  backend: claude_api  # Can be: claude_api, ollama, custom

# The 7 components this skill implements
components:
  - role_extraction           # Identify needed expertise
  - objective_clarification   # Define clear goals
  - process_methodology       # Step-by-step approach
  - format_specification      # Output structure
  - constraint_handling       # Boundaries and limitations
  - uncertainty_protocols     # Fallback behavior
  - validation_criteria       # Success metrics

# Use cases
use_cases:
  - Enhance casual prompts for better LLM results
  - Prepare prompts for GPT-5/Claude Opus
  - Reduce retry cycles via better initial prompts
  - Educational: teach good prompting practices

# Performance
performance:
  preprocessing_time: ~500ms
  cost_per_enhancement: ~$0.001 (Haiku)
  quality_improvement: +30-85% average
  success_rate_boost: +25% first-try success
