name: temp_sim
version: 1.0.0
category: meta-prompting
description: Temperature Simulation - Roleplay different confidence levels

config:
  confidence_levels:
    - high_confidence     # Very certain, bold
    - medium_confidence   # Balanced, cautious
    - low_confidence      # Uncertain, hedged

  require_all_levels: true
  timeout_seconds: 35

detection:
  high_confidence_keywords:
    - uncertain
    - not sure
    - confidence
    - hedging
    - cautious vs bold

  medium_confidence_keywords:
    - might
    - maybe
    - possibly
    - probably

  base_confidence: 0.20
  keyword_boost: 0.65

performance:
  typical_duration_ms: 160
  token_overhead: 320
  quality_improvement: 0.40  # +40% through confidence calibration
