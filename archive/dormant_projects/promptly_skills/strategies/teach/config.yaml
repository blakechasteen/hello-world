name: teach
version: 1.0.0
category: meta-prompting
description: Few-shot Edge Case Learning - Show boundary condition examples

config:
  min_examples: 3
  example_types:
    - typical_case
    - edge_case
    - error_case

  timeout_seconds: 30

detection:
  high_confidence_keywords:
    - show examples
    - give examples
    - demonstrate
    - edge cases
    - boundary conditions

  medium_confidence_keywords:
    - examples
    - instance
    - case
    - scenario

  base_confidence: 0.25
  keyword_boost: 0.60

performance:
  typical_duration_ms: 140
  token_overhead: 280
  quality_improvement: 0.50  # +50% clarity through examples
