name: debate
version: 1.0.0
category: meta-prompting
description: Multi-Persona Debate - Conflicting expert viewpoints

config:
  personas: 3
  debate_rounds: 2
  require_synthesis: true
  timeout_seconds: 40

detection:
  high_confidence_keywords:
    - different perspectives
    - debate
    - pros and cons
    - tradeoffs
    - conflicting views

  medium_confidence_keywords:
    - perspectives
    - viewpoints
    - opinions
    - arguments

  base_confidence: 0.30
  keyword_boost: 0.55

performance:
  typical_duration_ms: 200
  token_overhead: 450
  quality_improvement: 0.52  # +52% through multi-perspective analysis
