name: verify
version: 1.0.0
category: self-correction
description: Chain of Verification - Force model to critique its own output

# Strategy configuration
config:
  passes: 3
  depth: standard  # standard, deep, exhaustive

  # Quality thresholds
  min_confidence: 0.75
  target_quality: 0.85

  # Performance
  max_iterations: 5
  timeout_seconds: 30

# Auto-detection rules
detection:
  high_confidence_keywords:
    - analyze
    - review
    - check
    - verify
    - validate
    - audit
    - assess
    - evaluate

  medium_confidence_keywords:
    - explain
    - describe
    - what is
    - summarize

  context_triggers:
    # File paths that suggest verification needed
    file_patterns:
      - "**/security/**"
      - "**/auth/**"
      - "**/crypto/**"
      - "**/*contract*"
      - "**/*legal*"

  # Confidence calculation
  base_confidence: 0.3
  keyword_boost: 0.4
  context_boost: 0.3

# Composability
composable_with:
  - challenge  # Often chain verify -> challenge
  - deep      # Verify then force exhaustive depth

recommended_after:
  - optimize  # Optimize prompt then verify result

# Performance characteristics
performance:
  typical_duration_ms: 150
  token_overhead: 200
  quality_improvement: 0.35  # Average +35% quality

# Examples
examples:
  - query: "analyze this contract for risks"
    confidence: 0.92
    rationale: "High confidence - 'analyze' and 'contract' both match"

  - query: "explain how this works"
    confidence: 0.60
    rationale: "Medium confidence - 'explain' matches but not critical"

  - query: "write a function"
    confidence: 0.30
    rationale: "Low confidence - no verification keywords"
