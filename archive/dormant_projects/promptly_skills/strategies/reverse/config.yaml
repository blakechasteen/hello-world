name: reverse
version: 1.0.0
category: meta-prompting
description: Reverse Prompting - Model designs its own optimal prompt

# Strategy configuration
config:
  design_approach: comprehensive  # comprehensive, minimal, adaptive

  # What the model should consider
  design_considerations:
    - output_type         # What kind of output is needed
    - expertise_needed    # What domain knowledge is required
    - format_preference   # What structure makes sense
    - detail_level        # How deep to go
    - context_requirements # What context is essential

  # Should model explain its design choices?
  include_justification: true

  # Performance
  timeout_seconds: 30

# Auto-detection rules
detection:
  high_confidence_keywords:
    - design a prompt
    - create a prompt
    - what's the best prompt
    - optimal prompt
    - reverse prompt

  medium_confidence_keywords:
    - help me prompt
    - how should I ask
    - what should I say
    - prompt for

  # Confidence calculation
  base_confidence: 0.2
  keyword_boost: 0.6
  meta_boost: 0.3  # Boost for meta-prompting keywords

# Composability
composable_with:
  - verify      # Design prompt then verify it
  - challenge   # Design prompt then attack it
  - optimize    # Design prompt then optimize it

recommended_before:
  - verify      # Design then verify
  - optimize    # Design then optimize further

# Performance characteristics
performance:
  typical_duration_ms: 150
  token_overhead: 200
  quality_improvement: 0.45  # Average +45% vs manual prompting

# Examples
examples:
  - query: "design a prompt for analyzing financial data"
    confidence: 0.95
    rationale: "High confidence - explicit prompt design request"

  - query: "what's the best way to ask Claude about SQL optimization"
    confidence: 0.75
    rationale: "Medium-high confidence - implicit prompt design"

  - query: "help me ask about Python best practices"
    confidence: 0.60
    rationale: "Medium confidence - meta-level inquiry"
