# Minimal Synapse Configuration for Promptly Bot

server_name: "matrix.localhost"
pid_file: /data/homeserver.pid
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ['::1', '0.0.0.0']
    resources:
      - names: [client, federation]
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: postgres_secure_password_2024
    database: synapse
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 10

log_config: "/data/matrix.localhost.log.config"

media_store_path: "/data/media_store"
uploads_path: "/data/uploads"

max_upload_size: "50M"

enable_registration: true
enable_registration_without_verification: true

suppress_key_server_warning: true

report_stats: false
