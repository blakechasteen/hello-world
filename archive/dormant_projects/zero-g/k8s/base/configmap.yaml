apiVersion: v1
kind: ConfigMap
metadata:
  name: zerog-config
  labels:
    app: zerog-backend
data:
  environment: "production"
  log-level: "INFO"
  workers: "4"
  cors-origins: "http://localhost:3001,http://localhost:3000"
  enable-authentication: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'zerog-prod'
        environment: 'production'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files:
      - '/etc/prometheus/alerts.yml'

    scrape_configs:
      - job_name: 'zerog-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - zerog-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: zerog-backend
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:8000

      - job_name: 'neo4j'
        static_configs:
          - targets: ['neo4j:7474']
            labels:
              service: 'neo4j'
              tier: 'database'

      - job_name: 'qdrant'
        static_configs:
          - targets: ['qdrant:6333']
            labels:
              service: 'qdrant'
              tier: 'database'

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              service: 'prometheus'
              tier: 'monitoring'

  alerts.yml: |
    groups:
      - name: zerog_health
        interval: 30s
        rules:
          - alert: ZeroGBackendDown
            expr: up{job="zerog-backend"} < 1
            for: 1m
            labels:
              severity: critical
              component: backend
            annotations:
              summary: "Zero-G Backend is down"
              description: "Zero-G Backend has been down for more than 1 minute."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app: grafana
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'Zero-G Dashboards'
        orgId: 1
        folder: 'Zero-G'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
