# Prometheus Configuration for COZ Daily Brief Automation
#
# Usage:
#   1. Start metrics server: python elle/coz/metrics_server.py
#   2. Start Prometheus: prometheus --config.file=elle/coz/prometheus.yml
#   3. Access Prometheus UI: http://localhost:9090
#
# Created: 2025-11-22
# Part of: Production Deployment (Monitoring Setup)

global:
  scrape_interval: 1m          # Scrape every 1 minute
  evaluation_interval: 1m      # Evaluate rules every 1 minute
  scrape_timeout: 10s          # Timeout after 10 seconds

  # External labels (for multi-cluster setups)
  external_labels:
    monitor: 'coz-automation'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - localhost:9093

# Load alerting rules
rule_files:
  - 'prometheus_rules.yml'

# Scrape configurations
scrape_configs:
  # COZ Daily Brief Automation
  - job_name: 'coz-automation'

    # Scrape interval for this job (overrides global)
    scrape_interval: 1m
    scrape_timeout: 10s

    # Metrics path (default /metrics)
    metrics_path: /metrics

    # Static targets
    static_configs:
      - targets:
          - 'localhost:9090'  # Metrics server endpoint

        # Labels for all metrics from this target
        labels:
          service: 'coz-daily-brief'
          component: 'automation'

  # Health check endpoint (separate from metrics)
  - job_name: 'coz-health'

    scrape_interval: 5m  # Less frequent (health checks are slower)
    scrape_timeout: 30s

    metrics_path: /health/prometheus

    static_configs:
      - targets:
          - 'localhost:9090'

        labels:
          service: 'coz-daily-brief'
          component: 'health-check'

  # System metrics (optional - requires node_exporter)
  # - job_name: 'node'
  #   static_configs:
  #     - targets:
  #         - 'localhost:9100'

# Remote write (for long-term storage, optional)
# remote_write:
#   - url: "https://prometheus-remote-write-endpoint.example.com/api/v1/write"
#     basic_auth:
#       username: 'admin'
#       password: 'secret'

# Remote read (for querying remote storage, optional)
# remote_read:
#   - url: "https://prometheus-remote-read-endpoint.example.com/api/v1/read"
