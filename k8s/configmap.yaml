# EdWIN Kubernetes ConfigMap
# Environment configuration for all services
#
# Apply: kubectl apply -f k8s/configmap.yaml
#
# Implementation Date: November 15, 2025

apiVersion: v1
kind: ConfigMap
metadata:
  name: edwin-config
  namespace: edwin
  labels:
    app: edwin
    component: config
data:
  # Environment
  EDWIN_ENV: "production"
  LOG_LEVEL: "INFO"

  # Database Connections
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DASHBOARD_PORT: "8001"
  MOBILE_PORT: "8002"

  # Rate Limiting
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_PER_HOUR: "1000"

  # CORS
  CORS_ORIGINS: "*"  # Change in production!

  # Features
  ENABLE_ANALYTICS: "true"
  ENABLE_CACHING: "true"
  ENABLE_MULTIMODAL: "true"
