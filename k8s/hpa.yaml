# EdWIN Horizontal Pod Autoscalers
# Auto-scales deployments based on CPU/memory usage
#
# Implementation Date: November 17, 2025

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edwin-api-hpa
  namespace: edwin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edwin-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50  # Scale down 50% at a time
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60  # 1 minute before scaling up
      policies:
        - type: Percent
          value: 100  # Scale up 100% at a time
          periodSeconds: 60
        - type: Pods
          value: 2  # Or add 2 pods
          periodSeconds: 60
      selectPolicy: Max  # Use the policy that scales fastest

