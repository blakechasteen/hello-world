# EdWIN Neo4j StatefulSet
# Knowledge graph database with persistent storage
#
# Apply: kubectl apply -f k8s/neo4j-statefulset.yaml
#
# Implementation Date: November 15, 2025

---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: edwin
  labels:
    app: edwin
    component: neo4j
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - name: http
    port: 7474
    targetPort: 7474
    protocol: TCP
  - name: bolt
    port: 7687
    targetPort: 7687
    protocol: TCP
  selector:
    app: edwin
    component: neo4j

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: edwin
  labels:
    app: edwin
    component: neo4j
spec:
  serviceName: neo4j
  replicas: 1  # Single instance for simplicity (can cluster in advanced setup)
  selector:
    matchLabels:
      app: edwin
      component: neo4j
  template:
    metadata:
      labels:
        app: edwin
        component: neo4j
    spec:
      containers:
      - name: neo4j
        image: neo4j:5.13-community
        ports:
        - name: http
          containerPort: 7474
        - name: bolt
          containerPort: 7687
        env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              name: edwin-secrets
              key: NEO4J_PASSWORD
              # Format: neo4j/{password}
        - name: NEO4J_PLUGINS
          value: '["apoc"]'
        - name: NEO4J_dbms_memory_heap_max__size
          value: "2G"
        - name: NEO4J_dbms_memory_pagecache_size
          value: "1G"
        - name: NEO4J_dbms_security_procedures_unrestricted
          value: "apoc.*"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: neo4j-data
          mountPath: /data
        - name: neo4j-logs
          mountPath: /logs
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              cypher-shell -u neo4j -p "$NEO4J_PASSWORD" "RETURN 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              cypher-shell -u neo4j -p "$NEO4J_PASSWORD" "RETURN 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: neo4j-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard  # Change based on your cloud provider
      resources:
        requests:
          storage: 20Gi
  - metadata:
      name: neo4j-logs
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 5Gi
