# hololoom SaaS Docker Compose
#
# Includes:
# - PostgreSQL database
# - hololoom SaaS API
#
# Usage:
#   # Start services
#   docker-compose -f hololoom/saas/docker-compose.yml up -d
#
#   # View logs
#   docker-compose -f hololoom/saas/docker-compose.yml logs -f
#
#   # Stop services
#   docker-compose -f hololoom/saas/docker-compose.yml down
#
#   # Clean up (removes data)
#   docker-compose -f hololoom/saas/docker-compose.yml down -v

version: '3.8'

services:
  # =========================================================================
  # PostgreSQL Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hololoom-saas-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hololoom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hololoom_secure_password}
      POSTGRES_DB: hololoom_saas
    volumes:
      - hololoom_saas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hololoom -d hololoom_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hololoom-saas

  # =========================================================================
  # hololoom SaaS API
  # =========================================================================
  api:
    build:
      context: ../..
      dockerfile: hololoom/saas/Dockerfile
    container_name: hololoom-saas-api
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://hololoom:${POSTGRES_PASSWORD:-hololoom_secure_password}@postgres:5432/hololoom_saas

      # Features
      ENABLE_BILLING: ${ENABLE_BILLING:-false}
      ENABLE_USAGE_TRACKING: ${ENABLE_USAGE_TRACKING:-true}
      ENABLE_AUDIT_LOG: ${ENABLE_AUDIT_LOG:-true}

      # Stripe (optional)
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # Server
      PORT: 8000
      HOST: 0.0.0.0
      WORKERS: 4
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - hololoom-saas

volumes:
  hololoom_saas_postgres:
    driver: local

networks:
  hololoom-saas:
    driver: bridge
