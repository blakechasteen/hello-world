<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Trace Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --accent-blue: #4a90d9;
            --accent-green: #4caf50;
            --accent-orange: #ff9800;
            --accent-red: #f44336;
            --accent-purple: #9c27b0;
            --border-color: #2d2d44;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1::before {
            content: '◉';
            color: var(--accent-blue);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: var(--accent-red);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Layout */
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 1rem;
            padding: 1rem;
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Panels */
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            background: var(--bg-tertiary);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .panel-body {
            padding: 1rem;
        }

        /* Layer Heatmap */
        .heatmap-container {
            height: 300px;
            position: relative;
        }

        .heatmap-cell {
            stroke: var(--bg-primary);
            stroke-width: 1px;
            transition: opacity 0.2s;
        }

        .heatmap-cell:hover {
            opacity: 0.8;
            stroke: var(--accent-blue);
            stroke-width: 2px;
        }

        .heatmap-axis text {
            fill: var(--text-secondary);
            font-size: 10px;
        }

        .heatmap-axis line,
        .heatmap-axis path {
            stroke: var(--border-color);
        }

        /* Correlation Network */
        .network-container {
            height: 400px;
            position: relative;
        }

        .network-node {
            cursor: pointer;
            transition: r 0.2s;
        }

        .network-node:hover {
            r: 12;
        }

        .network-link {
            stroke: var(--border-color);
            stroke-opacity: 0.6;
        }

        .network-label {
            font-size: 10px;
            fill: var(--text-secondary);
            pointer-events: none;
        }

        /* Feature Details */
        .feature-details {
            grid-column: span 2;
        }

        .feature-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .feature-item {
            background: var(--bg-tertiary);
            border-radius: 4px;
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .feature-item:hover {
            background: var(--bg-primary);
        }

        .feature-name {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .feature-activation {
            font-size: 0.75rem;
            font-family: monospace;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: var(--bg-primary);
        }

        .feature-activation.high {
            color: var(--accent-orange);
        }

        .feature-activation.critical {
            color: var(--accent-red);
        }

        /* Statistics */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Sparklines */
        .sparkline {
            height: 30px;
            margin-top: 0.5rem;
        }

        .sparkline-line {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 1.5;
        }

        .sparkline-area {
            fill: var(--accent-blue);
            fill-opacity: 0.1;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.375rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn:hover {
            background: var(--bg-primary);
            border-color: var(--accent-blue);
        }

        .btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .tooltip-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .tooltip-value {
            color: var(--accent-blue);
            font-family: monospace;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }

            .feature-details {
                grid-column: span 1;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>Dark Trace Dashboard</h1>
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <!-- Dashboard -->
    <div class="dashboard-container">
        <!-- Layer Heatmap Panel -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Layer Activation Heatmap</span>
                <div class="controls">
                    <button class="btn active" data-layer="all">All</button>
                    <button class="btn" data-layer="0">L0</button>
                    <button class="btn" data-layer="1">L1</button>
                    <button class="btn" data-layer="2">L2</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="heatmap-container" id="heatmapContainer"></div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #1a1a2e"></div>
                        <span>0.0</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #4a90d9"></div>
                        <span>0.5</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff9800"></div>
                        <span>1.0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Correlation Network Panel -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Feature Correlation Network</span>
                <div class="controls">
                    <button class="btn" id="resetZoom">Reset</button>
                    <button class="btn" id="toggleLabels">Labels</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="network-container" id="networkContainer"></div>
            </div>
        </div>

        <!-- Statistics Panel -->
        <div class="panel" style="grid-column: span 2">
            <div class="panel-header">
                <span class="panel-title">Statistics</span>
            </div>
            <div class="panel-body">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="statActiveFeatures">0</div>
                        <div class="stat-label">Active Features</div>
                        <svg class="sparkline" id="sparklineActive"></svg>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statMeanActivation">0.00</div>
                        <div class="stat-label">Mean Activation</div>
                        <svg class="sparkline" id="sparklineMean"></svg>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statMaxActivation">0.00</div>
                        <div class="stat-label">Max Activation</div>
                        <svg class="sparkline" id="sparklineMax"></svg>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statSparsity">0%</div>
                        <div class="stat-label">Sparsity</div>
                        <svg class="sparkline" id="sparklineSparsity"></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Feature Details Panel -->
        <div class="panel feature-details">
            <div class="panel-header">
                <span class="panel-title">Top Activating Features</span>
                <div class="controls">
                    <button class="btn active" data-sort="activation">By Activation</button>
                    <button class="btn" data-sort="index">By Index</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="feature-list" id="featureList"></div>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip" style="display: none;"></div>

    <!-- Dashboard JavaScript -->
    <script src="dark_trace_dashboard.js"></script>
    <script>
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            const dashboard = new DarkTraceDashboard({
                wsUrl: `ws://${window.location.hostname}:8765`,
                apiUrl: `/api/dark-trace`,
                updateInterval: 1000,
            });

            dashboard.start();

            // For debugging
            window.dashboard = dashboard;
        });
    </script>
</body>
</html>
