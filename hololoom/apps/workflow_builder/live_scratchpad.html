<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Transcription Scratchpad</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .panel {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            overflow-y: auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4CAF50;
        }

        h2 {
            font-size: 18px;
            margin: 20px 0 12px;
            color: #64B5F6;
        }

        /* Domain Selection */
        .domain-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .domain-btn {
            padding: 12px;
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .domain-btn:hover {
            background: #4a4a4a;
            border-color: #64B5F6;
        }

        .domain-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        /* Recording Controls */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-record {
            background: #f44336;
            color: white;
            flex: 1;
        }

        .btn-record.recording {
            background: #e53935;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .btn-finalize {
            background: #4CAF50;
            color: white;
            flex: 1;
        }

        .btn-clear {
            background: #757575;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Transcription Display */
        .transcription-box {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 8px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #b0b0b0;
            margin-bottom: 20px;
        }

        /* Template Fields */
        .field-group {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #9e9e9e;
            margin-bottom: 6px;
        }

        .field-label.required::after {
            content: ' *';
            color: #f44336;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #64B5F6;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .field-suggestions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .suggestion-chip {
            padding: 4px 10px;
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            background: #4a4a4a;
            border-color: #64B5F6;
        }

        /* List Fields */
        .list-items {
            margin-top: 8px;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            padding: 8px;
            background: #1a1a1a;
            border-radius: 6px;
        }

        .list-item input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 4px;
        }

        .list-item-remove {
            background: #f44336;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .list-add-btn {
            padding: 8px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
        }

        /* Validation */
        .validation-errors {
            background: #3d1f1f;
            border-left: 4px solid #f44336;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .validation-errors ul {
            margin-left: 20px;
            color: #f44336;
        }

        .status-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-valid {
            background: #1b5e20;
            color: #4CAF50;
        }

        .status-invalid {
            background: #b71c1c;
            color: #f44336;
        }

        /* Detection Info */
        .detection-info {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .confidence-bar {
            width: 100%;
            height: 6px;
            background: #3a3a3a;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #64B5F6);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel: Controls & Transcription -->
        <div class="panel">
            <h1>🎙️ Live Scratchpad</h1>

            <h2>1. Select Domain</h2>
            <div class="domain-selector">
                <button class="domain-btn" data-domain="recipe">🍳 Recipe</button>
                <button class="domain-btn" data-domain="budget">💰 Budget</button>
                <button class="domain-btn" data-domain="expense">🧾 Expense</button>
                <button class="domain-btn" data-domain="time_tracking">⏱️ Time</button>
                <button class="domain-btn" data-domain="bee_inspection">🐝 Bee Check</button>
                <button class="domain-btn" data-domain="sop">📋 SOP</button>
            </div>

            <h2>2. Record Audio</h2>
            <div class="controls">
                <button class="btn btn-record" id="recordBtn">● Start Recording</button>
                <button class="btn btn-clear" id="clearBtn">Clear</button>
            </div>

            <h2>Live Transcription</h2>
            <div class="transcription-box" id="transcriptionBox">
                <em>Transcription will appear here...</em>
            </div>

            <div class="detection-info" id="detectionInfo" style="display: none;">
                <strong>Detected:</strong> <span id="detectedDomain">—</span>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
                <div style="margin-top: 4px; font-size: 12px; color: #9e9e9e;">
                    Confidence: <span id="confidenceText">0%</span>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button class="btn btn-finalize" id="finalizeBtn" disabled>✓ Finalize & Save</button>
            </div>
        </div>

        <!-- Right Panel: Template Editor -->
        <div class="panel">
            <h1>📝 Template Editor</h1>

            <div id="templateContainer">
                <em style="color: #757575;">Select a domain and start recording to populate template...</em>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8002';

        // State
        let isRecording = false;
        let selectedDomain = null;
        let currentData = {};
        let currentTemplate = null;
        let mediaRecorder = null;
        let audioChunks = [];

        // Elements
        const domainBtns = document.querySelectorAll('.domain-btn');
        const recordBtn = document.getElementById('recordBtn');
        const clearBtn = document.getElementById('clearBtn');
        const finalizeBtn = document.getElementById('finalizeBtn');
        const transcriptionBox = document.getElementById('transcriptionBox');
        const templateContainer = document.getElementById('templateContainer');
        const detectionInfo = document.getElementById('detectionInfo');

        // Domain selection
        domainBtns.forEach(btn => {
            btn.addEventListener('click', async () => {
                domainBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDomain = btn.dataset.domain;
                await loadTemplate(selectedDomain);
            });
        });

        // Recording controls
        recordBtn.addEventListener('click', toggleRecording);
        clearBtn.addEventListener('click', clearAll);
        finalizeBtn.addEventListener('click', finalize);

        async function toggleRecording() {
            if (!selectedDomain) {
                alert('Please select a domain first!');
                return;
            }

            if (!isRecording) {
                // Start recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);

                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await processAudio(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = '■ Stop Recording';
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert('Microphone access denied or unavailable');
                }
            } else {
                // Stop recording
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                recordBtn.textContent = '● Start Recording';
                recordBtn.classList.remove('recording');
            }
        }

        async function processAudio(audioBlob) {
            transcriptionBox.textContent = 'Transcribing...';

            // Send to backend for transcription
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.webm');
            formData.append('domain', selectedDomain);

            try {
                const response = await fetch(`${API_URL}/api/scratchpad/transcribe`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Transcription failed');
                }

                const result = await response.json();
                updateFromTranscription(result);
            } catch (err) {
                console.error('Transcription failed:', err);
                transcriptionBox.textContent = `[Error: ${err.message}]`;
                alert(`Transcription failed: ${err.message}`);
            }
        }

        function updateFromTranscription(result) {
            // Update transcription display
            transcriptionBox.textContent = result.transcription || '';

            // Update detection info
            if (result.detected_domain) {
                detectionInfo.style.display = 'block';
                document.getElementById('detectedDomain').textContent = result.detected_domain;
                const confidence = result.confidence || 0;
                document.getElementById('confidenceFill').style.width = `${confidence * 100}%`;
                document.getElementById('confidenceText').textContent = `${(confidence * 100).toFixed(0)}%`;
            }

            // Update template fields
            currentData = result.data || {};
            currentTemplate = result.template_fields || [];
            renderTemplate();

            // Enable finalize if valid
            finalizeBtn.disabled = !result.is_valid;
        }

        async function loadTemplate(domain) {
            try {
                // Start recording session
                const startResponse = await fetch(`${API_URL}/api/scratchpad/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, auto_detect: false })
                });

                const startResult = await startResponse.json();
                currentData = startResult.state.data || {};
                currentTemplate = startResult.state.template_fields || [];

                renderTemplate();
            } catch (err) {
                console.error('Failed to load template:', err);
                alert('Failed to load template');
            }
        }

        function renderTemplate() {
            if (!currentTemplate || currentTemplate.length === 0) {
                templateContainer.innerHTML = '<em style="color: #757575;">Select a domain to load template...</em>';
                return;
            }

            let html = '';

            // Validation status
            html += '<div class="status-indicator status-valid">Template Loaded</div>';
            html += '<div style="margin-top: 20px;"></div>';

            // Render fields
            currentTemplate.forEach(field => {
                html += renderField(field, currentData[field.name]);
            });

            templateContainer.innerHTML = html;

            // Attach event listeners
            attachFieldListeners();
        }

        function renderField(field, value) {
            let html = '<div class="field-group">';
            html += `<label class="field-label ${field.required ? 'required' : ''}">${formatFieldName(field.name)}</label>`;

            if (field.type === 'list') {
                html += renderListField(field, value || []);
            } else if (field.type === 'text') {
                html += `<textarea data-field="${field.name}">${value || ''}</textarea>`;
            } else {
                html += `<input type="text" data-field="${field.name}" value="${value || ''}" />`;
            }

            // Suggestions
            if (field.suggestions && field.suggestions.length > 0) {
                html += '<div class="field-suggestions">';
                field.suggestions.forEach(sug => {
                    html += `<span class="suggestion-chip" data-field="${field.name}" data-value="${sug}">${sug}</span>`;
                });
                html += '</div>';
            }

            html += '</div>';
            return html;
        }

        function renderListField(field, items) {
            let html = '<div class="list-items">';
            items.forEach((item, idx) => {
                html += `
                    <div class="list-item">
                        <input type="text" data-field="${field.name}" data-index="${idx}" value="${item}" />
                        <button class="list-item-remove" data-field="${field.name}" data-index="${idx}">×</button>
                    </div>
                `;
            });
            html += '</div>';
            html += `<button class="list-add-btn" data-field="${field.name}">+ Add Item</button>`;
            return html;
        }

        function formatFieldName(name) {
            return name.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function attachFieldListeners() {
            // Text/textarea fields
            templateContainer.querySelectorAll('input[data-field], textarea[data-field]').forEach(el => {
                el.addEventListener('input', (e) => {
                    const field = e.target.dataset.field;
                    const index = e.target.dataset.index;

                    if (index !== undefined) {
                        // List item
                        if (!currentData[field]) currentData[field] = [];
                        currentData[field][index] = e.target.value;
                    } else {
                        // Regular field
                        currentData[field] = e.target.value;
                    }

                    finalizeBtn.disabled = false;
                });
            });

            // Suggestion chips
            templateContainer.querySelectorAll('.suggestion-chip').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    const field = e.target.dataset.field;
                    const value = e.target.dataset.value;
                    currentData[field] = value;

                    // Update input
                    const input = templateContainer.querySelector(`[data-field="${field}"]`);
                    if (input) input.value = value;

                    finalizeBtn.disabled = false;
                });
            });

            // List add buttons
            templateContainer.querySelectorAll('.list-add-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const field = e.target.dataset.field;
                    if (!currentData[field]) currentData[field] = [];
                    currentData[field].push('');

                    // Re-render template
                    renderTemplate();
                });
            });

            // List remove buttons
            templateContainer.querySelectorAll('.list-item-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const field = e.target.dataset.field;
                    const index = parseInt(e.target.dataset.index);
                    currentData[field].splice(index, 1);

                    // Re-render template
                    renderTemplate();
                });
            });
        }

        async function clearAll() {
            if (!confirm('Clear all data?')) return;

            try {
                await fetch(`${API_URL}/api/scratchpad/clear`, { method: 'POST' });

                transcriptionBox.textContent = '';
                currentData = {};
                currentTemplate = null;
                templateContainer.innerHTML = '<em style="color: #757575;">Select a domain and start recording...</em>';
                detectionInfo.style.display = 'none';
                finalizeBtn.disabled = true;

                domainBtns.forEach(b => b.classList.remove('active'));
                selectedDomain = null;
            } catch (err) {
                console.error('Failed to clear:', err);
            }
        }

        async function finalize() {
            if (!selectedDomain) {
                alert('No active domain');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/scratchpad/finalize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        domain: selectedDomain,
                        data: currentData
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('✓ Saved to memory!');
                    await clearAll();
                } else {
                    alert('⚠️ Failed to save');
                }
            } catch (err) {
                console.error('Finalize failed:', err);
                alert(`⚠️ Error: ${err.message}`);
            }
        }

        // Load initial state
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_URL}/health`);
                const health = await response.json();
                console.log('API Health:', health);
            } catch (err) {
                console.error('API not available:', err);
                alert('Warning: API server not available. Please start the server with:\npython hololoom/server/scratchpad_api.py');
            }
        });
    </script>
</body>
</html>
