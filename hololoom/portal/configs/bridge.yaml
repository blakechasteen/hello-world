# hololoom Bridge Configuration
# Configure hololoom server connection, timeouts, retries, and fallback behavior

# hololoom server URL
hololoom_url: "http://localhost:8000"

# Request timeout in seconds
timeout_seconds: 30.0

# Number of retry attempts for failed requests
retry_count: 3

# Delay between retries in seconds
retry_delay: 1.0

# Use local hololoom if server unavailable
enable_local_fallback: true

# Default number of results for recall operations
default_recall_k: 5

# Default reasoning mode: bare, fast, or fused
default_weave_mode: "fast"
