# Test Generator Skill Template
# ==============================
# Generates comprehensive test cases for code

name: test-generator
version: "1.0.0"
description: "Generate comprehensive test cases with high coverage"

metadata:
  category: "development"
  tags: ["testing", "test-cases", "coverage", "quality-assurance"]
  author: "hololoom Agent System"
  created: "2025-11-16"

# Recursive reasoning configuration
reasoning:
  default_strategy: "explore"  # Explore different test scenarios
  max_iterations: 4
  quality_threshold: 0.85
  refinement_passes:
    - name: "happy_path"
      focus: "Generate tests for normal/expected inputs"
    - name: "edge_cases"
      focus: "Generate tests for boundary conditions"
    - name: "error_cases"
      focus: "Generate tests for error handling"
    - name: "coverage_analysis"
      focus: "Ensure all code paths are tested"

# Prompt template
system_prompt: |
  You are an expert test engineer specializing in:
  - Test-driven development (TDD)
  - Behavior-driven development (BDD)
  - Edge case identification
  - Mutation testing concepts
  - Code coverage analysis

  Your test suites:
  - Cover happy path, edge cases, and error conditions
  - Are independent and isolated
  - Use descriptive test names
  - Include assertions with clear failure messages
  - Follow AAA pattern (Arrange, Act, Assert)

user_prompt_template: |
  Generate comprehensive tests for the following code:

  **Language:** {language}
  **Testing Framework:** {framework}

  **Code to Test:**
  ```{language}
  {code}
  ```

  **Coverage Goals:**
  - Happy path: {happy_path}
  - Edge cases: {edge_cases}
  - Error handling: {error_handling}

  Generate:
  1. Test file with all test cases
  2. Coverage analysis (which scenarios are tested)
  3. Suggestions for additional tests

# Input parameters
parameters:
  - name: code
    type: string
    required: true
    description: "Code to generate tests for"

  - name: language
    type: string
    required: true
    description: "Programming language (python, javascript, go, etc.)"

  - name: framework
    type: string
    required: false
    default: "auto"
    description: "Testing framework (pytest, jest, mocha, unittest, etc.)"

  - name: happy_path
    type: boolean
    required: false
    default: true
    description: "Generate happy path tests"

  - name: edge_cases
    type: boolean
    required: false
    default: true
    description: "Generate edge case tests"

  - name: error_handling
    type: boolean
    required: false
    default: true
    description: "Generate error handling tests"

# Expected output structure
output:
  format: "structured"
  fields:
    - test_file: string  # Complete test file code
    - test_count: integer  # Number of tests generated
    - coverage_report: object  # Which scenarios are covered
    - additional_suggestions: list  # More tests to consider

# Quality checks
quality_checks:
  - name: "aaa_pattern"
    description: "Tests must follow Arrange-Act-Assert pattern"
  - name: "descriptive_names"
    description: "Test names must clearly describe what is being tested"
  - name: "assertions_included"
    description: "All tests must have at least one assertion"

# Example usage
examples:
  - name: "Python function tests"
    input:
      code: |
        def calculate_discount(price, discount_percent):
            if discount_percent < 0 or discount_percent > 100:
                raise ValueError("Discount must be between 0 and 100")
            return price * (1 - discount_percent / 100)
      language: "python"
      framework: "pytest"
    expected_tests:
      - "test_calculate_discount_valid_input"
      - "test_calculate_discount_zero_discount"
      - "test_calculate_discount_full_discount"
      - "test_calculate_discount_negative_raises_error"
      - "test_calculate_discount_over_100_raises_error"
