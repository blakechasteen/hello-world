# Bug Detective Skill Template
# ============================
# Analyzes code to find bugs and suggests fixes

name: bug-detective
version: "1.0.0"
description: "Systematically debug code, find root causes, and suggest fixes"

metadata:
  category: "development"
  tags: ["debugging", "troubleshooting", "root-cause-analysis", "testing"]
  author: "hololoom Agent System"
  created: "2025-11-16"

# Recursive reasoning configuration
reasoning:
  default_strategy: "decompose"  # Break down problem → analyze → solve
  max_iterations: 5
  quality_threshold: 0.90  # High threshold for bug fixes
  refinement_passes:
    - name: "symptom_analysis"
      focus: "Understand the bug symptoms and error messages"
    - name: "root_cause"
      focus: "Identify the root cause of the bug"
    - name: "solution_design"
      focus: "Design comprehensive fix that addresses root cause"
    - name: "verification"
      focus: "Verify fix works and doesn't introduce regressions"

# Prompt template
system_prompt: |
  You are an expert debugger with systematic problem-solving skills:
  - Root cause analysis using 5 Whys technique
  - Binary search debugging strategy
  - Stack trace interpretation
  - Memory leak detection
  - Concurrency issue identification
  - Edge case discovery

  Your debugging approach:
  1. Understand the expected behavior
  2. Identify the actual behavior (symptoms)
  3. Form hypotheses about root cause
  4. Design minimal reproducing test case
  5. Fix root cause (not symptoms)
  6. Verify fix with tests

user_prompt_template: |
  Debug the following issue:

  **Language:** {language}
  **File:** {filename}

  **Code:**
  ```{language}
  {code}
  ```

  **Bug Description:**
  {bug_description}

  **Error Message (if any):**
  {error_message}

  **Expected Behavior:**
  {expected_behavior}

  **Actual Behavior:**
  {actual_behavior}

  Please provide:
  1. Root cause analysis
  2. Suggested fix with code
  3. Minimal test case to verify fix
  4. Potential edge cases to watch for

# Input parameters
parameters:
  - name: code
    type: string
    required: true
    description: "Code with the bug"

  - name: bug_description
    type: string
    required: true
    description: "Description of the bug"

  - name: language
    type: string
    required: true
    description: "Programming language"

  - name: filename
    type: string
    required: false
    default: "untitled"

  - name: error_message
    type: string
    required: false
    default: "No error message"
    description: "Stack trace or error output"

  - name: expected_behavior
    type: string
    required: false
    default: "Not specified"
    description: "What should happen"

  - name: actual_behavior
    type: string
    required: false
    default: "Not specified"
    description: "What actually happens"

# Expected output structure
output:
  format: "structured"
  fields:
    - root_cause: string
    - hypothesis_chain: list  # Series of "why" questions leading to root cause
    - fixed_code: string
    - test_case: string
    - edge_cases: list
    - confidence: float  # 0.0-1.0 confidence in the fix

# Quality checks
quality_checks:
  - name: "root_cause_identified"
    description: "Must identify root cause, not just symptoms"
  - name: "fix_includes_test"
    description: "Fix must include test case to verify"
  - name: "edge_cases_considered"
    description: "Must list potential edge cases"

# Example usage
examples:
  - name: "Index out of bounds"
    input:
      code: |
        def get_last_item(items):
            return items[len(items)]
      language: "python"
      bug_description: "Function crashes with IndexError"
      error_message: "IndexError: list index out of range"
    expected_fix: "return items[len(items) - 1] or items[-1]"

  - name: "Null pointer exception"
    input:
      code: |
        function getUserName(user) {
          return user.profile.name;
        }
      language: "javascript"
      bug_description: "Function crashes when user has no profile"
      error_message: "TypeError: Cannot read property 'name' of undefined"
    expected_fix: "return user?.profile?.name || 'Unknown'"
