<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloLoom Spatial - WebXR Knowledge Graph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow: hidden;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        #overlay > * {
            pointer-events: auto;
        }

        .panel {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 1rem;
        }

        #status-panel {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        #xr-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #controls-panel {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 300px;
        }

        button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        button.danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #info-panel {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            max-width: 400px;
        }

        #node-info {
            display: none;
        }

        #node-info.visible {
            display: block;
        }

        #node-info h3 {
            color: #60a5fa;
            margin-bottom: 0.5rem;
        }

        #node-info p {
            font-size: 0.875rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .tag {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 4px;
            padding: 0.125rem 0.5rem;
            font-size: 0.75rem;
        }

        #metrics-panel {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            font-size: 0.875rem;
        }

        .metric-label {
            opacity: 0.7;
        }

        .metric-value {
            font-weight: 600;
            color: #60a5fa;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-screen h2 {
            margin-top: 1rem;
            color: #60a5fa;
        }

        #loading-screen p {
            margin-top: 0.5rem;
            opacity: 0.7;
        }

        .hidden {
            display: none !important;
        }

        /* Voice command indicator */
        #voice-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(59, 130, 246, 0.9);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #voice-indicator.listening {
            display: flex;
            animation: voice-pulse 1s infinite;
        }

        @keyframes voice-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Recording indicator */
        #recording-indicator {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        #recording-indicator.active {
            display: flex;
        }

        #recording-indicator .rec-dot {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            animation: rec-blink 1s infinite;
        }

        @keyframes rec-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <h2>HoloLoom Spatial</h2>
        <p>Initializing WebXR environment...</p>
    </div>

    <!-- Main Canvas -->
    <div id="canvas-container">
        <canvas id="xr-canvas"></canvas>
    </div>

    <!-- UI Overlay -->
    <div id="overlay">
        <div id="status-panel" class="panel">
            <div id="xr-status">
                <div class="status-dot" id="connection-dot"></div>
                <span id="connection-text">Disconnected</span>
            </div>
            <span id="session-type">Desktop Mode</span>
        </div>

        <div id="controls-panel" class="panel">
            <button id="enter-vr-btn" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 8a2 2 0 012-2h16a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8z"/>
                    <circle cx="8" cy="12" r="2"/>
                    <circle cx="16" cy="12" r="2"/>
                </svg>
                Enter VR
            </button>
            <button id="enter-ar-btn" class="secondary" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                    <path d="M8 21h8"/>
                    <path d="M12 17v4"/>
                </svg>
                Enter AR
            </button>
            <button id="record-btn" class="secondary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="4" fill="currentColor"/>
                </svg>
                Record Session
            </button>
            <button id="voice-btn" class="secondary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                    <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                    <path d="M12 19v4"/>
                </svg>
                Voice Commands
            </button>
        </div>
    </div>

    <!-- Node Info Panel -->
    <div id="info-panel" class="panel">
        <div id="node-info">
            <h3 id="node-title">Node Title</h3>
            <p id="node-description">Node description...</p>
            <div class="tag-list" id="node-tags"></div>
        </div>
    </div>

    <!-- Metrics Panel -->
    <div id="metrics-panel" class="panel">
        <div class="metric-row">
            <span class="metric-label">Nodes</span>
            <span class="metric-value" id="metric-nodes">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Edges</span>
            <span class="metric-value" id="metric-edges">0</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">FPS</span>
            <span class="metric-value" id="metric-fps">60</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Latency</span>
            <span class="metric-value" id="metric-latency">-</span>
        </div>
    </div>

    <!-- Voice Indicator -->
    <div id="voice-indicator">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
        </svg>
    </div>

    <!-- Recording Indicator -->
    <div id="recording-indicator">
        <div class="rec-dot"></div>
        <span>Recording</span>
        <span id="rec-time">00:00</span>
    </div>

    <script>
        // HoloLoom WebXR Client
        class HoloLoomXR {
            constructor() {
                this.canvas = document.getElementById('xr-canvas');
                this.gl = this.canvas.getContext('webgl2', { xrCompatible: true });

                this.xrSession = null;
                this.xrReferenceSpace = null;
                this.xrFrame = null;

                // State
                this.nodes = new Map();
                this.edges = [];
                this.selectedNode = null;

                // WebSocket connection
                this.ws = null;
                this.wsUrl = 'ws://localhost:8000/ws/spatial';

                // Recording
                this.isRecording = false;
                this.recordingStartTime = null;

                // Voice
                this.voiceEnabled = false;
                this.recognition = null;

                // Metrics
                this.frameCount = 0;
                this.lastFpsUpdate = Date.now();
                this.fps = 60;

                this.init();
            }

            async init() {
                // Check WebXR support
                if ('xr' in navigator) {
                    await this.checkXRSupport();
                } else {
                    console.log('WebXR not supported, falling back to desktop mode');
                }

                // Initialize WebSocket connection
                this.connectWebSocket();

                // Initialize voice recognition
                this.initVoiceRecognition();

                // Setup event listeners
                this.setupEventListeners();

                // Start render loop
                this.startRenderLoop();

                // Hide loading screen
                setTimeout(() => {
                    document.getElementById('loading-screen').classList.add('hidden');
                }, 1000);
            }

            async checkXRSupport() {
                try {
                    const vrSupported = await navigator.xr.isSessionSupported('immersive-vr');
                    const arSupported = await navigator.xr.isSessionSupported('immersive-ar');

                    document.getElementById('enter-vr-btn').disabled = !vrSupported;
                    document.getElementById('enter-ar-btn').disabled = !arSupported;

                    if (vrSupported || arSupported) {
                        console.log(`XR Support - VR: ${vrSupported}, AR: ${arSupported}`);
                    }
                } catch (e) {
                    console.error('Error checking XR support:', e);
                }
            }

            connectWebSocket() {
                try {
                    this.ws = new WebSocket(this.wsUrl);

                    this.ws.onopen = () => {
                        console.log('Connected to HoloLoom server');
                        this.updateConnectionStatus(true);
                        this.requestGraphState();
                    };

                    this.ws.onmessage = (event) => {
                        this.handleMessage(JSON.parse(event.data));
                    };

                    this.ws.onclose = () => {
                        console.log('Disconnected from server');
                        this.updateConnectionStatus(false);
                        // Reconnect after 3 seconds
                        setTimeout(() => this.connectWebSocket(), 3000);
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                    };
                } catch (e) {
                    console.log('WebSocket connection failed, running in offline mode');
                    this.updateConnectionStatus(false);
                }
            }

            updateConnectionStatus(connected) {
                const dot = document.getElementById('connection-dot');
                const text = document.getElementById('connection-text');

                if (connected) {
                    dot.classList.add('connected');
                    text.textContent = 'Connected';
                } else {
                    dot.classList.remove('connected');
                    text.textContent = 'Disconnected';
                }
            }

            handleMessage(message) {
                switch (message.type) {
                    case 'graph_state':
                        this.updateGraph(message.data);
                        break;
                    case 'node_update':
                        this.updateNode(message.data);
                        break;
                    case 'edge_update':
                        this.updateEdge(message.data);
                        break;
                    case 'query_response':
                        this.handleQueryResponse(message.data);
                        break;
                    case 'spatial_audio':
                        this.playAudio(message.data);
                        break;
                }
            }

            requestGraphState() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ type: 'get_graph' }));
                }
            }

            updateGraph(data) {
                // Clear existing
                this.nodes.clear();
                this.edges = [];

                // Add nodes
                for (const node of data.nodes || []) {
                    this.nodes.set(node.id, {
                        id: node.id,
                        label: node.label,
                        position: node.position || { x: 0, y: 0, z: 0 },
                        color: node.color || '#3b82f6',
                        size: node.size || 0.1,
                        metadata: node.metadata || {}
                    });
                }

                // Add edges
                this.edges = (data.edges || []).map(edge => ({
                    source: edge.source,
                    target: edge.target,
                    type: edge.type || 'default',
                    weight: edge.weight || 1.0
                }));

                this.updateMetrics();
            }

            updateNode(data) {
                if (this.nodes.has(data.id)) {
                    const node = this.nodes.get(data.id);
                    Object.assign(node, data);
                } else {
                    this.nodes.set(data.id, data);
                }
                this.updateMetrics();
            }

            updateEdge(data) {
                const existingIndex = this.edges.findIndex(
                    e => e.source === data.source && e.target === data.target
                );
                if (existingIndex >= 0) {
                    this.edges[existingIndex] = data;
                } else {
                    this.edges.push(data);
                }
                this.updateMetrics();
            }

            updateMetrics() {
                document.getElementById('metric-nodes').textContent = this.nodes.size;
                document.getElementById('metric-edges').textContent = this.edges.length;
            }

            handleQueryResponse(data) {
                console.log('Query response:', data);
                // Could show notification or update UI
            }

            playAudio(data) {
                // Spatial audio integration
                if (data.url && window.AudioContext) {
                    const audioContext = new AudioContext();
                    // Implementation would use Web Audio API for 3D positioning
                }
            }

            initVoiceRecognition() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = true;
                    this.recognition.interimResults = false;

                    this.recognition.onresult = (event) => {
                        const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                        this.handleVoiceCommand(transcript);
                    };

                    this.recognition.onerror = (event) => {
                        console.error('Speech recognition error:', event.error);
                        this.toggleVoice(false);
                    };
                }
            }

            handleVoiceCommand(transcript) {
                console.log('Voice command:', transcript);

                // Check for wake word
                if (transcript.includes('hey hololoom') || transcript.includes('hey loom')) {
                    // Send to server for processing
                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(JSON.stringify({
                            type: 'voice_command',
                            transcript: transcript
                        }));
                    }
                }
            }

            toggleVoice(enable) {
                this.voiceEnabled = enable;
                const indicator = document.getElementById('voice-indicator');

                if (enable && this.recognition) {
                    this.recognition.start();
                    indicator.classList.add('listening');
                    document.getElementById('voice-btn').textContent = 'Stop Voice';
                } else if (this.recognition) {
                    this.recognition.stop();
                    indicator.classList.remove('listening');
                    document.getElementById('voice-btn').textContent = 'Voice Commands';
                }
            }

            setupEventListeners() {
                // VR button
                document.getElementById('enter-vr-btn').addEventListener('click', () => {
                    this.startXRSession('immersive-vr');
                });

                // AR button
                document.getElementById('enter-ar-btn').addEventListener('click', () => {
                    this.startXRSession('immersive-ar');
                });

                // Record button
                document.getElementById('record-btn').addEventListener('click', () => {
                    this.toggleRecording();
                });

                // Voice button
                document.getElementById('voice-btn').addEventListener('click', () => {
                    this.toggleVoice(!this.voiceEnabled);
                });

                // Canvas interaction
                this.canvas.addEventListener('click', (e) => {
                    this.handleCanvasClick(e);
                });

                // Resize
                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                });

                this.resizeCanvas();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                if (this.gl) {
                    this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
                }
            }

            handleCanvasClick(event) {
                // Convert click to 3D raycast
                const rect = this.canvas.getBoundingClientRect();
                const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                // Find clicked node (simplified 2D check for desktop mode)
                for (const [id, node] of this.nodes) {
                    const screenX = (node.position.x + 1) / 2;
                    const screenY = (-node.position.y + 1) / 2;
                    const dist = Math.sqrt(
                        Math.pow(x - (screenX * 2 - 1), 2) +
                        Math.pow(y - (1 - screenY * 2), 2)
                    );
                    if (dist < 0.1) {
                        this.selectNode(id);
                        return;
                    }
                }

                // Deselect if clicked empty space
                this.selectNode(null);
            }

            selectNode(nodeId) {
                this.selectedNode = nodeId;
                const infoPanel = document.getElementById('node-info');

                if (nodeId && this.nodes.has(nodeId)) {
                    const node = this.nodes.get(nodeId);
                    document.getElementById('node-title').textContent = node.label || node.id;
                    document.getElementById('node-description').textContent =
                        node.metadata?.description || 'No description available';

                    // Update tags
                    const tagContainer = document.getElementById('node-tags');
                    tagContainer.innerHTML = '';
                    for (const tag of node.metadata?.tags || []) {
                        const tagEl = document.createElement('span');
                        tagEl.className = 'tag';
                        tagEl.textContent = tag;
                        tagContainer.appendChild(tagEl);
                    }

                    infoPanel.classList.add('visible');

                    // Notify server
                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(JSON.stringify({
                            type: 'node_selected',
                            nodeId: nodeId
                        }));
                    }
                } else {
                    infoPanel.classList.remove('visible');
                }
            }

            async startXRSession(mode) {
                if (!navigator.xr) {
                    console.error('WebXR not available');
                    return;
                }

                try {
                    const options = {
                        requiredFeatures: ['local-floor'],
                        optionalFeatures: ['hand-tracking', 'eye-tracking']
                    };

                    if (mode === 'immersive-ar') {
                        options.optionalFeatures.push('dom-overlay');
                        options.domOverlay = { root: document.getElementById('overlay') };
                    }

                    this.xrSession = await navigator.xr.requestSession(mode, options);

                    this.xrSession.addEventListener('end', () => {
                        this.xrSession = null;
                        document.getElementById('session-type').textContent = 'Desktop Mode';
                    });

                    await this.gl.makeXRCompatible();
                    const layer = new XRWebGLLayer(this.xrSession, this.gl);
                    await this.xrSession.updateRenderState({ baseLayer: layer });

                    this.xrReferenceSpace = await this.xrSession.requestReferenceSpace('local-floor');

                    document.getElementById('session-type').textContent =
                        mode === 'immersive-vr' ? 'VR Mode' : 'AR Mode';

                    this.xrSession.requestAnimationFrame(this.xrRenderLoop.bind(this));

                } catch (e) {
                    console.error('Failed to start XR session:', e);
                }
            }

            xrRenderLoop(time, frame) {
                if (!this.xrSession) return;

                this.xrFrame = frame;
                const pose = frame.getViewerPose(this.xrReferenceSpace);

                if (pose) {
                    const glLayer = this.xrSession.renderState.baseLayer;
                    this.gl.bindFramebuffer(this.gl.FRAMEBUFFER, glLayer.framebuffer);

                    this.gl.clearColor(0.1, 0.1, 0.15, 1.0);
                    this.gl.clear(this.gl.COLOR_BUFFER_BIT | this.gl.DEPTH_BUFFER_BIT);

                    for (const view of pose.views) {
                        const viewport = glLayer.getViewport(view);
                        this.gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);

                        // Render scene for this view
                        this.renderScene(view.transform, view.projectionMatrix);
                    }

                    // Check for hand input
                    this.processXRInput(frame);
                }

                // Record if active
                if (this.isRecording) {
                    this.recordFrame(pose);
                }

                this.xrSession.requestAnimationFrame(this.xrRenderLoop.bind(this));
            }

            processXRInput(frame) {
                // Hand tracking
                for (const inputSource of this.xrSession.inputSources) {
                    if (inputSource.hand) {
                        const handedness = inputSource.handedness;
                        const wrist = frame.getJointPose(inputSource.hand.get('wrist'), this.xrReferenceSpace);
                        if (wrist) {
                            // Send hand pose to server
                            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                                this.ws.send(JSON.stringify({
                                    type: 'hand_pose',
                                    hand: handedness,
                                    position: {
                                        x: wrist.transform.position.x,
                                        y: wrist.transform.position.y,
                                        z: wrist.transform.position.z
                                    }
                                }));
                            }
                        }
                    }
                }
            }

            renderScene(viewTransform, projectionMatrix) {
                // Simplified rendering - in production would use proper 3D graphics
                // This is a placeholder for WebGL node/edge rendering

                // Render nodes
                for (const [id, node] of this.nodes) {
                    this.renderNode(node, node.id === this.selectedNode);
                }

                // Render edges
                for (const edge of this.edges) {
                    const sourceNode = this.nodes.get(edge.source);
                    const targetNode = this.nodes.get(edge.target);
                    if (sourceNode && targetNode) {
                        this.renderEdge(sourceNode, targetNode, edge);
                    }
                }
            }

            startRenderLoop() {
                const render = () => {
                    if (!this.xrSession) {
                        // Desktop rendering
                        this.gl.clearColor(0.06, 0.06, 0.1, 1.0);
                        this.gl.clear(this.gl.COLOR_BUFFER_BIT | this.gl.DEPTH_BUFFER_BIT);

                        // Simple 2D fallback rendering
                        this.render2DFallback();
                    }

                    // Update FPS
                    this.frameCount++;
                    const now = Date.now();
                    if (now - this.lastFpsUpdate >= 1000) {
                        this.fps = this.frameCount;
                        this.frameCount = 0;
                        this.lastFpsUpdate = now;
                        document.getElementById('metric-fps').textContent = this.fps;
                    }

                    requestAnimationFrame(render);
                };

                render();
            }

            render2DFallback() {
                // Simple 2D visualization for non-XR mode
                const ctx = this.canvas.getContext('2d');
                if (!ctx) return;

                ctx.fillStyle = '#0f0f1a';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const scale = 200;

                // Draw edges
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.3)';
                ctx.lineWidth = 1;
                for (const edge of this.edges) {
                    const source = this.nodes.get(edge.source);
                    const target = this.nodes.get(edge.target);
                    if (source && target) {
                        ctx.beginPath();
                        ctx.moveTo(
                            centerX + source.position.x * scale,
                            centerY - source.position.y * scale
                        );
                        ctx.lineTo(
                            centerX + target.position.x * scale,
                            centerY - target.position.y * scale
                        );
                        ctx.stroke();
                    }
                }

                // Draw nodes
                for (const [id, node] of this.nodes) {
                    const x = centerX + node.position.x * scale;
                    const y = centerY - node.position.y * scale;
                    const radius = (node.size || 0.1) * scale;

                    // Node circle
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = node.id === this.selectedNode ? '#60a5fa' : (node.color || '#3b82f6');
                    ctx.fill();

                    // Label
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(node.label || node.id, x, y + radius + 15);
                }
            }

            toggleRecording() {
                if (this.isRecording) {
                    this.stopRecording();
                } else {
                    this.startRecording();
                }
            }

            startRecording() {
                this.isRecording = true;
                this.recordingStartTime = Date.now();
                document.getElementById('recording-indicator').classList.add('active');
                document.getElementById('record-btn').classList.add('danger');
                document.getElementById('record-btn').innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="1"/>
                    </svg>
                    Stop Recording
                `;

                // Notify server
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'start_recording',
                        timestamp: this.recordingStartTime
                    }));
                }

                // Update timer
                this.recordingTimer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - this.recordingStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById('rec-time').textContent =
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }

            stopRecording() {
                this.isRecording = false;
                clearInterval(this.recordingTimer);
                document.getElementById('recording-indicator').classList.remove('active');
                document.getElementById('record-btn').classList.remove('danger');
                document.getElementById('record-btn').innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="4" fill="currentColor"/>
                    </svg>
                    Record Session
                `;

                // Notify server
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'stop_recording',
                        duration: Date.now() - this.recordingStartTime
                    }));
                }
            }

            recordFrame(pose) {
                if (!pose) return;

                // Send pose data for recording
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'record_frame',
                        timestamp: Date.now() - this.recordingStartTime,
                        pose: {
                            position: {
                                x: pose.transform.position.x,
                                y: pose.transform.position.y,
                                z: pose.transform.position.z
                            },
                            orientation: {
                                x: pose.transform.orientation.x,
                                y: pose.transform.orientation.y,
                                z: pose.transform.orientation.z,
                                w: pose.transform.orientation.w
                            }
                        }
                    }));
                }
            }

            // Public API
            sendQuery(queryText) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'query',
                        text: queryText
                    }));
                }
            }

            focusNode(nodeId) {
                // Animate camera to node
                const node = this.nodes.get(nodeId);
                if (node) {
                    this.selectNode(nodeId);
                    // In XR, would move view to node
                }
            }

            expandNode(nodeId) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'expand_node',
                        nodeId: nodeId
                    }));
                }
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            window.holoLoomXR = new HoloLoomXR();
        });
    </script>
</body>
</html>
