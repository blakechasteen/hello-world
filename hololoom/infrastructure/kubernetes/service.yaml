# hololoom API Service
# Part 5: Production Hardening - Day 25
#
# Service for hololoom API:
# - ClusterIP for internal communication
# - HTTP and metrics ports
# - Session affinity for sticky sessions

apiVersion: v1
kind: Service
metadata:
  name: hololoom-api
  namespace: hololoom
  labels:
    app: hololoom-api
    component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP  # Sticky sessions
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

  selector:
    app: hololoom-api
    component: backend

  ports:
    # HTTP API port
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

    # Prometheus metrics port
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

---
# Headless service for StatefulSet (if needed)
apiVersion: v1
kind: Service
metadata:
  name: hololoom-api-headless
  namespace: hololoom
  labels:
    app: hololoom-api
    component: backend
spec:
  type: ClusterIP
  clusterIP: None  # Headless
  selector:
    app: hololoom-api
    component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
