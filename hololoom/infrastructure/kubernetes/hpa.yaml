# hololoom API HorizontalPodAutoscaler
# Part 5: Production Hardening - Day 25
#
# Auto-scaling configuration based on:
# - CPU utilization
# - Memory utilization
# - Custom metrics (QPS, latency)

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hololoom-api
  namespace: hololoom
  labels:
    app: hololoom-api
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hololoom-api

  # Replica limits
  minReplicas: 3  # Minimum for HA
  maxReplicas: 10  # Maximum for cost control

  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes before scale down
      policies:
        - type: Percent
          value: 50  # Scale down 50% at a time
          periodSeconds: 60
        - type: Pods
          value: 2  # Or remove 2 pods at a time
          periodSeconds: 60
      selectPolicy: Min  # Use conservative approach

    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 100  # Double capacity
          periodSeconds: 30
        - type: Pods
          value: 4  # Or add 4 pods
          periodSeconds: 30
      selectPolicy: Max  # Use aggressive approach

  # Metrics
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Target 70% CPU

    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Target 80% memory

    # Custom metric: Queries per second (QPS)
    # Requires metrics server with custom metrics
    - type: Pods
      pods:
        metric:
          name: hololoom_qps
        target:
          type: AverageValue
          averageValue: "80"  # Target 80 QPS per pod

    # Custom metric: Request latency p95
    - type: Pods
      pods:
        metric:
          name: hololoom_latency_p95_ms
        target:
          type: AverageValue
          averageValue: "800"  # Scale if p95 > 800ms

---
# Example: Custom metrics with Prometheus Adapter
# Requires prometheus-adapter to be installed

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: monitoring
data:
  config.yaml: |
    rules:
      # hololoom QPS metric
      - seriesQuery: 'hololoom_query_total{namespace="hololoom"}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^hololoom_query_total"
          as: "hololoom_qps"
        metricsQuery: 'rate(hololoom_query_total{<<.LabelMatchers>>}[2m])'

      # hololoom latency p95
      - seriesQuery: 'hololoom_query_latency_seconds_bucket{namespace="hololoom"}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^hololoom_query_latency_seconds_bucket"
          as: "hololoom_latency_p95_ms"
        metricsQuery: 'histogram_quantile(0.95, rate(hololoom_query_latency_seconds_bucket{<<.LabelMatchers>>}[2m])) * 1000'

---
# VerticalPodAutoscaler (optional, for rightsizing)
# Requires VPA to be installed
#
# VPA automatically adjusts resource requests/limits
# DO NOT use VPA and HPA together on CPU/memory metrics

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hololoom-api
  namespace: hololoom
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hololoom-api

  # Update policy
  updatePolicy:
    updateMode: "Auto"  # or "Initial", "Recreate", "Off"

  # Resource policy
  resourcePolicy:
    containerPolicies:
      - containerName: hololoom-api
        minAllowed:
          cpu: 500m
          memory: 1Gi
        maxAllowed:
          cpu: 4000m
          memory: 8Gi
        controlledResources:
          - cpu
          - memory

---
# PodDisruptionBudget for high availability
# Ensures minimum availability during voluntary disruptions

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hololoom-api
  namespace: hololoom
  labels:
    app: hololoom-api
spec:
  minAvailable: 2  # Always keep at least 2 replicas running

  selector:
    matchLabels:
      app: hololoom-api
      component: backend

---
# Example scaling scenarios:
#
# Scenario 1: Traffic spike (100 → 500 QPS)
# - QPS per pod: 80 → 400
# - Trigger: QPS > 80 per pod
# - Action: Scale up from 3 to 7 replicas (aggressive)
# - Time: ~30 seconds
#
# Scenario 2: Slow queries (p95: 300ms → 900ms)
# - Trigger: Latency p95 > 800ms
# - Action: Scale up from 3 to 5 replicas
# - Time: ~30 seconds
#
# Scenario 3: High CPU (50% → 85%)
# - Trigger: CPU > 70%
# - Action: Scale up from 3 to 4 replicas
# - Time: ~30 seconds
#
# Scenario 4: Traffic drop (500 → 50 QPS)
# - QPS per pod: 80 → 10
# - Trigger: QPS < 50 per pod for 5 minutes
# - Action: Scale down from 7 to 3 replicas (conservative)
# - Time: ~5 minutes (stabilization)
