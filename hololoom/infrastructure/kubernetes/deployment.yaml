# HoloLoom API Deployment
# Part 5: Production Hardening - Day 25
#
# Production-ready deployment with:
# - Resource limits and requests
# - Health checks (liveness, readiness, startup)
# - Rolling update strategy
# - Security context
# - Production hardening enabled

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hololoom-api
  namespace: hololoom
  labels:
    app: hololoom-api
    component: backend
    version: v1.0.0
    part: production-hardening
spec:
  replicas: 3  # Start with 3 replicas for HA
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployment

  selector:
    matchLabels:
      app: hololoom-api
      component: backend

  template:
    metadata:
      labels:
        app: hololoom-api
        component: backend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"

    spec:
      # Service account for RBAC
      serviceAccountName: hololoom-api

      # Security context (non-root)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Init container to wait for dependencies
      initContainers:
        - name: wait-for-neo4j
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for Neo4j..."
              until nc -z neo4j 7687; do
                echo "Neo4j not ready, waiting..."
                sleep 2
              done
              echo "Neo4j is ready!"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000

        - name: wait-for-qdrant
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for Qdrant..."
              until nc -z qdrant 6333; do
                echo "Qdrant not ready, waiting..."
                sleep 2
              done
              echo "Qdrant is ready!"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000

      # Main container
      containers:
        - name: hololoom-api
          image: hololoom/api:1.0.0  # Replace with your image
          imagePullPolicy: IfNotPresent

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          # Ports
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment variables from ConfigMap and Secret
          env:
            # Environment
            - name: CONTEXT_ENV
              valueFrom:
                configMapKeyRef:
                  name: hololoom-config
                  key: environment

            # Neo4j configuration
            - name: NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: hololoom-config
                  key: neo4j.uri
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: hololoom-secrets
                  key: neo4j.user
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hololoom-secrets
                  key: neo4j.password

            # Qdrant configuration
            - name: QDRANT_URI
              valueFrom:
                configMapKeyRef:
                  name: hololoom-config
                  key: qdrant.uri

            # Production hardening
            - name: ENABLE_PRODUCTION_HARDENING
              value: "true"
            - name: RATE_LIMIT_QPS
              valueFrom:
                configMapKeyRef:
                  name: hololoom-config
                  key: rate_limit.global_qps
            - name: MAX_CONCURRENT
              valueFrom:
                configMapKeyRef:
                  name: hololoom-config
                  key: rate_limit.max_concurrent
            - name: MAX_MEMORY_MB
              valueFrom:
                configMapKeyRef:
                  name: hololoom-config
                  key: resource.max_memory_mb

            # Python configuration
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONIOENCODING
              value: "utf-8"

          # Resource requests and limits
          resources:
            requests:
              cpu: 500m  # 0.5 CPU cores
              memory: 1Gi  # 1GB RAM
            limits:
              cpu: 2000m  # 2 CPU cores
              memory: 4Gi  # 4GB RAM

          # Health checks
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 12  # 60 seconds to start

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2

          # Volume mounts
          volumeMounts:
            # Logs
            - name: logs
              mountPath: /var/log/hololoom

            # Cache (tmpfs for speed)
            - name: cache
              mountPath: /tmp/hololoom-cache

            # Configuration files
            - name: config
              mountPath: /etc/hololoom
              readOnly: true

          # Lifecycle hooks
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15  # Allow time for graceful shutdown

      # Volumes
      volumes:
        # Logs (emptyDir for ephemeral logs)
        - name: logs
          emptyDir:
            sizeLimit: 1Gi

        # Cache (tmpfs for speed)
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

        # Configuration
        - name: config
          configMap:
            name: hololoom-config
            items:
              - key: config.yaml
                path: config.yaml

      # Scheduling preferences
      affinity:
        # Pod anti-affinity (spread across nodes)
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - hololoom-api
                topologyKey: kubernetes.io/hostname

        # Node affinity (prefer nodes with SSD)
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: disk-type
                    operator: In
                    values:
                      - ssd

      # Tolerations for tainted nodes
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "hololoom"
          effect: "NoSchedule"

      # DNS policy
      dnsPolicy: ClusterFirst

      # Restart policy
      restartPolicy: Always

      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# ServiceAccount for RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hololoom-api
  namespace: hololoom
  labels:
    app: hololoom-api

---
# Role for accessing ConfigMaps and Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hololoom-api
  namespace: hololoom
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hololoom-api
  namespace: hololoom
subjects:
  - kind: ServiceAccount
    name: hololoom-api
    namespace: hololoom
roleRef:
  kind: Role
  name: hololoom-api
  apiGroup: rbac.authorization.k8s.io
