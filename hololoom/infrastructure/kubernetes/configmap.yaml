# hololoom API ConfigMap
# Part 5: Production Hardening - Day 25
#
# Non-sensitive configuration values

apiVersion: v1
kind: ConfigMap
metadata:
  name: hololoom-config
  namespace: hololoom
  labels:
    app: hololoom-api
    component: config
data:
  # Environment
  environment: "production"

  # Backend URIs
  neo4j.uri: "bolt://neo4j:7687"
  qdrant.uri: "http://qdrant:6333"

  # Rate limiting
  rate_limit.global_qps: "1000.0"
  rate_limit.session_qps: "50.0"
  rate_limit.max_concurrent: "100"

  # Circuit breaker
  circuit_breaker.enabled: "true"
  circuit_breaker.failure_threshold: "3"
  circuit_breaker.recovery_timeout: "120.0"

  # Resources
  resource.max_memory_mb: "2048"
  resource.max_cache_size: "10000"

  # Monitoring
  monitoring.enabled: "true"
  monitoring.log_level: "WARNING"
  monitoring.metrics_export: "prometheus"

  # Learning
  learning.enabled: "true"
  learning.calibration: "true"

  # Configuration file (YAML)
  config.yaml: |
    # hololoom Production Configuration
    environment: production

    # Execution mode
    execution_mode: FAST

    # Production hardening
    production_hardening:
      enabled: true

      # Error handling
      error_handling:
        max_retries: 5
        retry_backoff: 2.0
        fallback_enabled: true

      # Circuit breakers
      circuit_breaker:
        enabled: true
        failure_threshold: 3
        recovery_timeout: 120.0

      # Rate limiting
      rate_limit:
        enabled: true
        global_qps: 1000.0
        session_qps: 50.0
        max_concurrent: 100

      # Health checks
      health_check:
        enabled: true
        error_rate_threshold: 0.10
        latency_threshold_ms: 1000
        calibration_threshold: 0.15

    # Resources
    resource:
      max_memory_mb: 2048
      max_cache_size: 10000
      cache_eviction_policy: LRU
      cache_eviction_threshold: 0.8

    # Monitoring
    monitoring:
      enabled: true
      log_level: WARNING
      metrics_export: prometheus

    # Learning
    learning:
      enabled: true
      calibration: true
      strategy_updates: true

    # Backends
    backends:
      neo4j:
        uri: bolt://neo4j:7687
        max_pool_size: 50
        connection_timeout: 30.0
      qdrant:
        uri: http://qdrant:6333
        timeout: 30.0

    # Retrieval
    retrieval:
      max_memories: 50
      max_depth: 2
      similarity_threshold: 0.5
      timeout_ms: 100

    # Embeddings
    embeddings:
      model: sentence-transformers/all-MiniLM-L6-v2
      scales: [96, 192, 384]
      device: cpu

    # Phase 5: Compositional Cache
    compositional_cache:
      enabled: true
      parse_cache_size: 10000
      merge_cache_size: 50000
      semantic_cache_size: 20000

    # Linguistic gate
    linguistic_gate:
      enabled: true
      mode: both  # prefilter + embedding
      weight: 0.3
      prefilter_similarity_threshold: 0.3
      prefilter_keep_ratio: 0.7
