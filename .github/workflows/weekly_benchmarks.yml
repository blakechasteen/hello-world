name: Weekly Benchmarks

# Run every Monday at 00:00 UTC
on:
  schedule:
    - cron: '0 0 * * 1'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal dependencies for benchmarks (no heavy ML libraries needed)
          pip install dataclasses pathlib

      - name: Run Wikipedia benchmark
        run: |
          python benchmarks/recall_accuracy/wikipedia_benchmark.py

      - name: Run arXiv benchmark
        run: |
          python benchmarks/recall_accuracy/arxiv_benchmark.py

      - name: Run Books benchmark
        run: |
          python benchmarks/recall_accuracy/books_benchmark.py

      - name: Create benchmark summary
        run: |
          echo "# Weekly Benchmark Results" > benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "**Date:** $(date +%Y-%m-%d)" >> benchmark_summary.md
          echo "" >> benchmark_summary.md

          # Add latest Wikipedia results
          echo "## Wikipedia Benchmark" >> benchmark_summary.md
          cat benchmarks/results/recall_accuracy_wikipedia_*.md | tail -n +3 >> benchmark_summary.md
          echo "" >> benchmark_summary.md

          # Add latest arXiv results
          echo "## arXiv Benchmark" >> benchmark_summary.md
          cat benchmarks/results/recall_accuracy_arxiv_*.md | tail -n +3 >> benchmark_summary.md
          echo "" >> benchmark_summary.md

          # Add latest Books results
          echo "## Books Benchmark" >> benchmark_summary.md
          cat benchmarks/results/recall_accuracy_books_*.md | tail -n +3 >> benchmark_summary.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results-${{ github.run_number }}
          path: |
            benchmarks/results/*.json
            benchmarks/results/*.md
            benchmark_summary.md

      - name: Commit results to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add benchmarks/results/
          git commit -m "chore: Weekly benchmark results $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed (may need permissions)"

      - name: Create GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: benchmarks-${{ github.run_number }}
          release_name: Weekly Benchmarks ${{ github.run_number }}
          body_path: benchmark_summary.md
          draft: false
          prerelease: false
