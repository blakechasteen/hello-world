name: HoloLoom Test Suite

on:
  push:
    branches: [master, main, 'feature/**', 'claude/**']
    paths:
      - 'hololoom/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/hololoom-test-suite.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'hololoom/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

env:
  PYTHONPATH: .
  PYTHONWARNINGS: ignore
  PYTHONIOENCODING: utf-8

jobs:
  # ============================================================================
  # Lint — Fast feedback (<1 minute)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff black
      - name: Ruff check
        run: ruff check hololoom/
      - name: Black check
        run: black --check hololoom/

  # ============================================================================
  # Test Collection — Verify 0 collection errors
  # ============================================================================
  collect:
    name: Test Collection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Verify test collection
        run: |
          output=$(python -m pytest --collect-only hololoom/tests/ 2>&1)
          echo "$output" | tail -5
          errors=$(echo "$output" | grep -c "^ERROR" || true)
          echo "Collection errors: $errors"
          if [ "$errors" -gt 0 ]; then
            echo "$output" | grep "^ERROR"
            exit 1
          fi

  # ============================================================================
  # Unit Tests — Fast feedback (<5 minutes)
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: |
          python -m pytest hololoom/tests/unit/ -v \
            --timeout=30 \
            --tb=short \
            -x

  # ============================================================================
  # Integration Tests — Multi-component (<10 minutes)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,nlp,ml]"
      - name: Run integration tests
        run: |
          python -m pytest hololoom/tests/integration/ -v \
            --timeout=60 \
            --tb=short

  # ============================================================================
  # Import Smoke Test — Verify clean import
  # ============================================================================
  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core only
        run: pip install -e .
      - name: Verify import with core deps only
        run: |
          python -c "from hololoom import HoloLoom; print('OK')"
