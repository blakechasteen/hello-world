name: Rust Clustering CI

on:
  push:
    branches: [master, main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-clustering.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'rust/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================
  # Core Rust Tests
  # ============================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}

      - name: Run tests (with SIMD)
        working-directory: rust
        run: cargo test --workspace --release

      - name: Run tests (scalar fallback)
        working-directory: rust
        run: cargo test --workspace --release --no-default-features

  # ============================================
  # Python Wheels (maturin)
  # ============================================
  build-python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Install maturin
        run: pip install maturin pytest numpy

      - name: Build wheel
        working-directory: rust/hololoom-python
        run: maturin build --release

      - name: Install and test
        working-directory: rust/hololoom-python
        run: |
          pip install target/wheels/*.whl
          python -c "from hololoom_rust import cosine_similarity_batch, kmeans; print('Import OK')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: rust/hololoom-python/target/wheels/*.whl

  # ============================================
  # WASM Build (wasm-pack)
  # ============================================
  build-wasm:
    name: WASM Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM (web)
        working-directory: rust/hololoom-wasm
        run: wasm-pack build --target web

      - name: Build WASM (bundler)
        working-directory: rust/hololoom-wasm
        run: wasm-pack build --target bundler --out-dir pkg-bundler

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: |
            rust/hololoom-wasm/pkg/
            rust/hololoom-wasm/pkg-bundler/

  # ============================================
  # Benchmarks
  # ============================================
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Run benchmarks
        working-directory: rust
        run: cargo bench --workspace -- --noplot

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: rust/target/criterion/

  # ============================================
  # Release (on tag)
  # ============================================
  release-pypi:
    name: Release to PyPI
    needs: [test, build-python]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/rust-v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  release-npm:
    name: Release to npm
    needs: [test, build-wasm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/rust-v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download WASM package
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: rust/hololoom-wasm/

      - name: Publish to npm
        working-directory: rust/hololoom-wasm/pkg-bundler
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
