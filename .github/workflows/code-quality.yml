name: Code Quality Checks

# Run on push to any branch and on pull requests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, master, develop]

# Allow only one concurrent run per branch (cancel old runs)
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Pre-Commit Hooks (all checks)
  # ============================================================================
  pre-commit:
    name: Pre-Commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper linting

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3
        with:
          extra_dependencies: ["safety"]  # Optional security check

  # ============================================================================
  # Type Checking (mypy)
  # ============================================================================
  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-PyYAML types-requests

      - name: Run mypy
        run: |
          mypy hololoom/ \
            --ignore-missing-imports \
            --no-implicit-optional \
            --warn-redundant-casts \
            --warn-unused-ignores

  # ============================================================================
  # Security Check (bandit)
  # ============================================================================
  security:
    name: Security Check (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run bandit
        run: |
          bandit -r hololoom/ \
            -ll \
            --skip B101  # Skip assert_used
        continue-on-error: true  # Don't fail the workflow (optional)

  # ============================================================================
  # Unit Tests
  # ============================================================================
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest hololoom/tests/unit/ -v --tb=short

  # ============================================================================
  # Integration Tests (optional, may be slow)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Only on PRs to save time
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          pytest hololoom/tests/integration/ -v --tb=short
        continue-on-error: true

  # ============================================================================
  # Code Coverage
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate coverage report
        run: |
          pytest hololoom/tests/unit/ \
            --cov=hololoom \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false  # Don't fail if upload fails
          verbose: true

  # ============================================================================
  # Docstring Coverage (interrogate)
  # ============================================================================
  docstring-coverage:
    name: Docstring Coverage (interrogate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install interrogate
        run: |
          python -m pip install --upgrade pip
          pip install interrogate

      - name: Run interrogate
        run: |
          interrogate hololoom/ \
            --fail-under 80 \
            --verbose \
            --ignore-init-method \
            --ignore-init-module \
            --ignore-magic \
            --ignore-semiprivate \
            --ignore-private \
            --exclude hololoom/tests \
            --exclude hololoom/**/tests
        continue-on-error: true  # Non-blocking initially while coverage improves

  # ============================================================================
  # README Existence Validation
  # ============================================================================
  readme-validation:
    name: README Existence Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required READMEs exist
        run: |
          echo "Checking for required README files..."
          required_readmes=(
            "README.md"
            "CLAUDE.md"
            "hololoom/memory/README.md"
            "hololoom/rag/README.md"
            "hololoom/spinningWheel/README.md"
            "hololoom/visualization/README.md"
            "hololoom/dark_trace/README.md"
            "hololoom/alignment/README.md"
          )

          missing=0
          for readme in "${required_readmes[@]}"; do
            if [ -f "$readme" ]; then
              echo "✅ Found: $readme"
            else
              echo "❌ Missing: $readme"
              missing=$((missing + 1))
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "⚠️ $missing required README(s) missing"
            exit 1
          fi
          echo "✅ All required READMEs present"

  # ============================================================================
  # Markdown Link Checker
  # ============================================================================
  link-checker:
    name: Markdown Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/markdown-link-check-config.json'
          folder-path: 'docs/, hololoom/'
          file-extension: '.md'
          check-modified-files-only: 'no'
        continue-on-error: true  # Non-blocking initially

  # ============================================================================
  # Status Check (require all to pass before merge)
  # ============================================================================
  status:
    name: Status Check
    needs: [pre-commit, type-check, security, tests, coverage, docstring-coverage, readme-validation, link-checker]
    runs-on: ubuntu-latest
    if: always()  # Run even if previous jobs failed
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.pre-commit.result }}" != "success" ]; then
            echo "❌ Pre-commit checks failed"
            exit 1
          fi
          if [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "❌ Type checking failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" == "failure" ]; then
            echo "⚠️ Security check failed (non-blocking)"
          fi
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [ "${{ needs.readme-validation.result }}" != "success" ]; then
            echo "❌ README validation failed"
            exit 1
          fi
          if [ "${{ needs.docstring-coverage.result }}" == "failure" ]; then
            echo "⚠️ Docstring coverage below threshold (non-blocking)"
          fi
          if [ "${{ needs.link-checker.result }}" == "failure" ]; then
            echo "⚠️ Markdown link check failed (non-blocking)"
          fi
          echo "✅ All required checks passed"
