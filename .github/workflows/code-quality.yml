name: Code Quality Checks

# Run on push to any branch and on pull requests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, master, develop]

# Allow only one concurrent run per branch (cancel old runs)
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Pre-Commit Hooks (all checks)
  # ============================================================================
  pre-commit:
    name: Pre-Commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper linting

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3
        with:
          extra_dependencies: ["safety"]  # Optional security check

  # ============================================================================
  # Type Checking (mypy)
  # ============================================================================
  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-PyYAML types-requests

      - name: Run mypy
        run: |
          mypy HoloLoom/ \
            --ignore-missing-imports \
            --no-implicit-optional \
            --warn-redundant-casts \
            --warn-unused-ignores
        continue-on-error: true  # Don't fail the workflow (optional)

  # ============================================================================
  # Security Check (bandit)
  # ============================================================================
  security:
    name: Security Check (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run bandit
        run: |
          bandit -r HoloLoom/ \
            -ll \
            --skip B101  # Skip assert_used
        continue-on-error: true  # Don't fail the workflow (optional)

  # ============================================================================
  # Unit Tests
  # ============================================================================
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest HoloLoom/tests/unit/ -v --tb=short

  # ============================================================================
  # Integration Tests (optional, may be slow)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Only on PRs to save time
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          pytest HoloLoom/tests/integration/ -v --tb=short
        continue-on-error: true

  # ============================================================================
  # Code Coverage
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate coverage report
        run: |
          pytest HoloLoom/tests/unit/ \
            --cov=HoloLoom \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false  # Don't fail if upload fails
          verbose: true

  # ============================================================================
  # Status Check (require all to pass before merge)
  # ============================================================================
  status:
    name: Status Check
    needs: [pre-commit, type-check, security, tests, coverage]
    runs-on: ubuntu-latest
    if: always()  # Run even if previous jobs failed
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.pre-commit.result }}" != "success" ]; then
            echo "❌ Pre-commit checks failed"
            exit 1
          fi
          if [ "${{ needs.type-check.result }}" == "failure" ]; then
            echo "⚠️ Type checking failed (non-blocking)"
          fi
          if [ "${{ needs.security.result }}" == "failure" ]; then
            echo "⚠️ Security check failed (non-blocking)"
          fi
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All required checks passed"
