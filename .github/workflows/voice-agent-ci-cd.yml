# HoloLoom VoiceAgent CI/CD Pipeline
# =====================================
# Automated testing, building, and deployment
# Date: November 15, 2025

name: VoiceAgent CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'HoloLoom/voice/**'
      - 'Dockerfile.voice'
      - 'docker-compose.voice.yml'
      - 'deployment/**'
      - '.github/workflows/voice-agent-ci-cd.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'HoloLoom/voice/**'
      - 'Dockerfile.voice'
      - 'deployment/**'
  workflow_dispatch:  # Manual trigger

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: hololoom/voice-agent
  PYTHON_VERSION: '3.10'

jobs:
  # ============================================================================
  # Test Job - Run all tests
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r HoloLoom/voice/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest HoloLoom/voice/tests/test_voice_agent.py -v --cov=HoloLoom.voice --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: voice-agent
          name: voice-agent-coverage

  # ============================================================================
  # Lint Job - Code quality checks
  # ============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          pip install flake8 black mypy

      - name: Run flake8
        run: |
          flake8 HoloLoom/voice --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 HoloLoom/voice --count --max-line-length=127 --statistics

      - name: Run black (check only)
        run: |
          black --check HoloLoom/voice

      - name: Run mypy
        run: |
          mypy HoloLoom/voice --ignore-missing-imports
        continue-on-error: true  # Type hints are strict

  # ============================================================================
  # Security Scan Job - Vulnerability scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # Build Job - Build and push Docker image
  # ============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]  # Only build if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.voice
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-image-results.sarif'

  # ============================================================================
  # Helm Validation Job - Validate Helm chart
  # ============================================================================
  helm-validate:
    name: Validate Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Lint Helm chart
        run: |
          helm lint deployment/helm/hololoom-voice

      - name: Template Helm chart
        run: |
          helm template hololoom-voice deployment/helm/hololoom-voice \
            --set voiceAgent.secrets.openaiApiKey.secretName=test-secret \
            --debug

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          helm template hololoom-voice deployment/helm/hololoom-voice \
            --set voiceAgent.secrets.openaiApiKey.secretName=test-secret | \
            kubeconform -strict -summary

  # ============================================================================
  # Deploy to Staging - Automatic on develop branch
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, helm-validate]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://voice-staging.hololoom.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig

      - name: Create namespace
        run: |
          kubectl create namespace hololoom-voice-staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          kubectl create secret generic voice-agent-secrets \
            --from-literal=OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY_STAGING }}' \
            --from-literal=NEO4J_PASSWORD='${{ secrets.NEO4J_PASSWORD_STAGING }}' \
            -n hololoom-voice-staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install hololoom-voice deployment/helm/hololoom-voice \
            --namespace hololoom-voice-staging \
            --set voiceAgent.image.tag=${{ github.sha }} \
            --set voiceAgent.replicaCount=2 \
            --set voiceAgent.env[0].name=ENVIRONMENT \
            --set voiceAgent.env[0].value=staging \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/hololoom-voice-hololoom-voice \
            -n hololoom-voice-staging \
            --timeout=5m

  # ============================================================================
  # Deploy to Production - Manual approval required
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, helm-validate]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://voice.hololoom.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig

      - name: Create namespace
        run: |
          kubectl create namespace hololoom-voice --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          kubectl create secret generic voice-agent-secrets \
            --from-literal=OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY_PRODUCTION }}' \
            --from-literal=NEO4J_PASSWORD='${{ secrets.NEO4J_PASSWORD_PRODUCTION }}' \
            -n hololoom-voice \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install hololoom-voice deployment/helm/hololoom-voice \
            --namespace hololoom-voice \
            --set voiceAgent.image.tag=${{ github.sha }} \
            --set voiceAgent.replicaCount=5 \
            --set voiceAgent.autoscaling.minReplicas=5 \
            --set voiceAgent.autoscaling.maxReplicas=50 \
            --set voiceAgent.env[0].name=ENVIRONMENT \
            --set voiceAgent.env[0].value=production \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/hololoom-voice-hololoom-voice \
            -n hololoom-voice \
            --timeout=10m

      - name: Run smoke tests
        run: |
          # Add smoke tests here
          kubectl run smoke-test \
            --image=curlimages/curl:latest \
            --rm -i --restart=Never \
            --namespace=hololoom-voice \
            -- curl -f http://hololoom-voice-hololoom-voice:8080/health

  # ============================================================================
  # Release Job - Create GitHub release
  # ============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            ## VoiceAgent Release v${{ github.run_number }}

            ### Changes
            ${{ github.event.head_commit.message }}

            ### Deployment
            - ✅ Deployed to production
            - Docker image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          draft: false
          prerelease: false
