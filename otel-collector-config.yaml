# OpenTelemetry Collector Configuration
# ======================================
# This is an advanced configuration for production deployments.
# The collector receives traces from HoloLoom and forwards them to Jaeger/Zipkin.

receivers:
  # OTLP gRPC receiver
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Jaeger receiver (for backwards compatibility)
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268

  # Zipkin receiver
  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  # Batch processor - groups spans before export (reduces network calls)
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Memory limiter - prevents OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # Attributes processor - add/remove span attributes
  attributes:
    actions:
      - key: environment
        value: production
        action: insert

  # Sampling processor (optional - for high-volume scenarios)
  # probabilistic_sampler:
  #   sampling_percentage: 50  # Sample 50% of traces

exporters:
  # Jaeger exporter
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # Zipkin exporter
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans

  # Prometheus exporter (for metrics)
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logging exporter (for debugging)
  logging:
    loglevel: info

  # OTLP exporter (for forwarding to other collectors)
  # otlp:
  #   endpoint: otelcol-prod:4317

service:
  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [memory_limiter, batch, attributes]
      exporters: [jaeger, zipkin, logging]

    # Metrics pipeline (future)
    # metrics:
    #   receivers: [otlp]
    #   processors: [batch]
    #   exporters: [prometheus]

  # Extensions
  extensions: []

  # Telemetry
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888

# Health check endpoint: http://localhost:13133
