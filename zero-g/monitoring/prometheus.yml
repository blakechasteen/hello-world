# Prometheus Configuration for Zero-G

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'zerog-dev'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load rules from files
rule_files:
  - '/etc/prometheus/alerts.yml'

# Scrape configurations
scrape_configs:
  # Zero-G Backend
  - job_name: 'zerog-backend'
    static_configs:
      - targets: ['zerog-backend:8000']
        labels:
          service: 'zerog-backend'
          tier: 'application'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Neo4j Database
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:7474']
        labels:
          service: 'neo4j'
          tier: 'database'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Qdrant Vector Store
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'
          tier: 'database'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'
