# NOTE: These are placeholder secrets for demonstration only.
# In production, use proper secrets management:
# - kubectl create secret generic zerog-secrets --from-literal=...
# - Or use external secrets management (HashiCorp Vault, AWS Secrets Manager, etc.)
# - Or use sealed-secrets (https://github.com/bitnami-labs/sealed-secrets)

apiVersion: v1
kind: Secret
metadata:
  name: zerog-secrets
  labels:
    app: zerog-backend
type: Opaque
stringData:
  # Neo4j credentials (change in production!)
  neo4j-auth: "neo4j/CHANGE_ME_IN_PRODUCTION"
  neo4j-password: "CHANGE_ME_IN_PRODUCTION"

  # Backend secret key (change in production!)
  secret-key: "CHANGE_ME_IN_PRODUCTION_USE_RANDOM_STRING"

  # Grafana admin credentials (change in production!)
  grafana-admin-user: "admin"
  grafana-admin-password: "CHANGE_ME_IN_PRODUCTION"

---
# Example of how to create secrets from command line (recommended):
# kubectl create secret generic zerog-secrets \
#   --from-literal=neo4j-auth='neo4j/your-secure-password' \
#   --from-literal=neo4j-password='your-secure-password' \
#   --from-literal=secret-key='your-random-secret-key-here' \
#   --from-literal=grafana-admin-user='admin' \
#   --from-literal=grafana-admin-password='your-secure-password' \
#   --namespace=zerog-prod
