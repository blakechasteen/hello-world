apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zerog-staging

bases:
  - ../../base

patchesStrategicMerge:
  - configmap-patch.yaml

commonLabels:
  environment: staging

images:
  - name: zerog-backend
    newName: your-registry.io/zerog-backend
    newTag: staging-latest

replicas:
  - name: zerog-backend
    count: 2

configMapGenerator:
  - name: zerog-config
    behavior: merge
    literals:
      - environment=staging
      - log-level=DEBUG
      - workers=4
