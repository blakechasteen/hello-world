apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zerog-prod

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - configmap-patch.yaml

commonLabels:
  environment: production

images:
  - name: zerog-backend
    newName: your-registry.io/zerog-backend
    newTag: v1.0.0

replicas:
  - name: zerog-backend
    count: 3

configMapGenerator:
  - name: zerog-config
    behavior: merge
    literals:
      - environment=production
      - log-level=INFO
      - workers=8
