# HoloLoom API Secret
# Part 5: Production Hardening - Day 25
#
# Sensitive configuration values
#
# IMPORTANT: This file contains placeholder values.
# In production, use proper secret management:
# - Kubernetes Secrets (base64 encoded)
# - External secret managers (Vault, AWS Secrets Manager, etc.)
# - Sealed Secrets
#
# DO NOT commit real secrets to version control!

apiVersion: v1
kind: Secret
metadata:
  name: hololoom-secrets
  namespace: hololoom
  labels:
    app: hololoom-api
    component: config
type: Opaque

# Base64-encoded values
# To encode: echo -n 'value' | base64
# To decode: echo 'encoded_value' | base64 -d

data:
  # Neo4j credentials
  # neo4j.user: neo4j (base64: bmVvNGo=)
  neo4j.user: bmVvNGo=

  # neo4j.password: CHANGE_THIS_PASSWORD (base64: Q0hBTkdFX1RISVNfUEFTU1dPUkQ=)
  neo4j.password: Q0hBTkdFX1RISVNfUEFTU1dPUkQ=

  # API keys (if needed)
  # api.key: your-secret-api-key (base64: eW91ci1zZWNyZXQtYXBpLWtleQ==)
  api.key: eW91ci1zZWNyZXQtYXBpLWtleQ==

  # JWT secret (if needed)
  # jwt.secret: your-jwt-secret-key (base64: eW91ci1qd3Qtc2VjcmV0LWtleQ==)
  jwt.secret: eW91ci1qd3Qtc2VjcmV0LWtleQ==

---
# Alternative: Use external secret manager (recommended for production)
# Example with External Secrets Operator

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hololoom-secrets-external
  namespace: hololoom
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager  # or vault, gcpsm, etc.
    kind: SecretStore

  target:
    name: hololoom-secrets
    creationPolicy: Owner

  data:
    # Fetch from AWS Secrets Manager
    - secretKey: neo4j.user
      remoteRef:
        key: hololoom/production/neo4j
        property: username

    - secretKey: neo4j.password
      remoteRef:
        key: hololoom/production/neo4j
        property: password

    - secretKey: api.key
      remoteRef:
        key: hololoom/production/api
        property: key

    - secretKey: jwt.secret
      remoteRef:
        key: hololoom/production/jwt
        property: secret

---
# SecretStore for AWS Secrets Manager (example)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: hololoom
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: hololoom-api

---
# Instructions for creating secrets manually:
#
# 1. Create base64-encoded values:
#    echo -n 'neo4j' | base64
#    echo -n 'your-strong-password' | base64
#
# 2. Create secret imperatively:
#    kubectl create secret generic hololoom-secrets \
#      --from-literal=neo4j.user=neo4j \
#      --from-literal=neo4j.password=your-strong-password \
#      --namespace=hololoom
#
# 3. Or use kustomize secretGenerator:
#    secretGenerator:
#    - name: hololoom-secrets
#      namespace: hololoom
#      literals:
#      - neo4j.user=neo4j
#      - neo4j.password=your-strong-password
#
# 4. For production, use Sealed Secrets:
#    kubeseal --format yaml <secret.yaml >sealed-secret.yaml
#    kubectl apply -f sealed-secret.yaml
