<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloLoom Collaborative Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        header .session-info {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Main layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .sidebar-section h2 {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* User list */
        .user-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 5px;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: #f5f5f5;
        }

        .user-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .status-online { background: #4caf50; }
        .status-idle { background: #ff9800; }
        .status-offline { background: #9e9e9e; }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 500;
            font-size: 14px;
            color: #333;
        }

        .user-role {
            font-size: 12px;
            color: #666;
        }

        /* Activity feed */
        .activity-feed {
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
        }

        .activity-item {
            padding: 8px;
            font-size: 12px;
            color: #666;
            border-left: 2px solid transparent;
            margin-bottom: 5px;
        }

        .activity-item:hover {
            background: #f5f5f5;
            border-left-color: #667eea;
        }

        .activity-time {
            color: #999;
            font-size: 11px;
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .message-author {
            font-weight: 600;
            color: #667eea;
            margin-right: 10px;
        }

        .message-time {
            font-size: 12px;
            color: #999;
        }

        .message-content {
            background: #f5f5f5;
            padding: 12px 15px;
            border-radius: 8px;
            line-height: 1.5;
            color: #333;
        }

        .message.own .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.own .message-author {
            color: #764ba2;
        }

        /* System messages */
        .system-message {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin: 15px 0;
            font-style: italic;
        }

        /* Typing indicator */
        .typing-indicator {
            padding: 10px 20px;
            color: #666;
            font-size: 13px;
            font-style: italic;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots span {
            animation: blink 1.4s infinite;
            opacity: 0;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0; }
            30% { opacity: 1; }
        }

        /* Input area */
        .input-area {
            border-top: 1px solid #e0e0e0;
            padding: 20px;
            background: white;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Connection status */
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .connection-status.connected {
            background: #4caf50;
            color: white;
        }

        .connection-status.connecting {
            background: #ff9800;
            color: white;
        }

        .connection-status.disconnected {
            background: #f44336;
            color: white;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <!-- Connection status -->
    <div id="connectionStatus" class="connection-status connecting">Connecting...</div>

    <!-- Header -->
    <header>
        <h1>🌀 HoloLoom Collaborative Chat</h1>
        <div class="session-info" id="sessionInfo">Session: <span id="sessionId">-</span></div>
    </header>

    <!-- Main container -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Users -->
            <div class="sidebar-section">
                <h2>Users (<span id="userCount">0</span>)</h2>
                <div class="user-list" id="userList">
                    <!-- Users populated by JS -->
                </div>
            </div>

            <!-- Activity feed -->
            <div class="sidebar-section">
                <h2>Activity</h2>
                <div class="activity-feed" id="activityFeed">
                    <!-- Activity populated by JS -->
                </div>
            </div>
        </div>

        <!-- Chat area -->
        <div class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <!-- Messages populated by JS -->
            </div>

            <div id="typingIndicator" class="typing-indicator" style="display: none;">
                <span id="typingUser"></span> is typing<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >
                    <button id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========================================================================
        // Configuration
        // ========================================================================

        const SESSION_ID = new URLSearchParams(window.location.search).get('session') || 'default';
        const TOKEN = localStorage.getItem('access_token');
        const WS_URL = `ws://${window.location.hostname}:8001/ws/collaborate/${SESSION_ID}?token=${TOKEN}`;

        // ========================================================================
        // State
        // ========================================================================

        let ws = null;
        let currentUser = null;
        let users = new Map();
        let reconnectAttempts = 0;
        let heartbeatInterval = null;

        // ========================================================================
        // DOM Elements
        // ========================================================================

        const elements = {
            connectionStatus: document.getElementById('connectionStatus'),
            sessionId: document.getElementById('sessionId'),
            userList: document.getElementById('userList'),
            userCount: document.getElementById('userCount'),
            activityFeed: document.getElementById('activityFeed'),
            messagesContainer: document.getElementById('messagesContainer'),
            messageInput: document.getElementById('messageInput'),
            sendButton: document.getElementById('sendButton'),
            typingIndicator: document.getElementById('typingIndicator'),
            typingUser: document.getElementById('typingUser')
        };

        // ========================================================================
        // WebSocket Management
        // ========================================================================

        function connect() {
            setConnectionStatus('connecting');

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('WebSocket connected');
                setConnectionStatus('connected');
                reconnectAttempts = 0;

                // Join session
                sendMessage({
                    type: 'join',
                    user_id: currentUser || 'anonymous',
                    username: currentUser || 'Anonymous'
                });

                // Start heartbeat
                startHeartbeat();
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                setConnectionStatus('disconnected');
                stopHeartbeat();

                // Reconnect after delay
                reconnectAttempts++;
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                setTimeout(connect, delay);
            };
        }

        function sendMessage(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(message));
            }
        }

        function startHeartbeat() {
            heartbeatInterval = setInterval(() => {
                sendMessage({ type: 'heartbeat' });
            }, 10000); // Every 10 seconds
        }

        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        // ========================================================================
        // Message Handling
        // ========================================================================

        function handleMessage(message) {
            console.log('Received:', message);

            switch (message.type) {
                case 'sync':
                    handleSync(message.data);
                    break;
                case 'user_joined':
                    handleUserJoined(message.data);
                    break;
                case 'user_left':
                    handleUserLeft(message.data);
                    break;
                case 'update':
                    handleUpdate(message.data);
                    break;
                case 'cursor':
                    handleCursor(message.data);
                    break;
                case 'presence':
                    handlePresence(message.data);
                    break;
                default:
                    console.log('Unknown message type:', message.type);
            }
        }

        function handleSync(data) {
            // Update users
            if (data.users) {
                users.clear();
                data.users.forEach(user => {
                    users.set(user.user_id, user);
                });
                updateUserList();
            }

            // Update presence
            if (data.presence && data.presence.users) {
                data.presence.users.forEach(presence => {
                    const user = users.get(presence.user_id);
                    if (user) {
                        user.status = presence.status;
                    }
                });
                updateUserList();
            }

            addSystemMessage('Synchronized with session');
        }

        function handleUserJoined(data) {
            users.set(data.user_id, {
                user_id: data.user_id,
                username: data.username,
                status: 'online'
            });

            updateUserList();
            addSystemMessage(`${data.username} joined`);
            addActivity(`${data.username} joined`, 'join');
        }

        function handleUserLeft(data) {
            const user = users.get(data.user_id);
            if (user) {
                users.delete(data.user_id);
                updateUserList();
                addSystemMessage(`${data.username} left`);
                addActivity(`${data.username} left`, 'leave');
            }
        }

        function handleUpdate(data) {
            // Handle CRDT delta update
            const { delta, username } = data;

            // For chat messages, extract and display
            if (delta.path === 'messages' && delta.operation === 'add') {
                addMessage(username, delta.value, data.user_id === currentUser);
            }

            addActivity(`${username} updated state`, 'update');
        }

        function handleCursor(data) {
            // Update cursor position for user
            const user = users.get(data.user_id);
            if (user) {
                user.cursor = data.cursor;
                // Could show cursor position in UI
            }
        }

        function handlePresence(data) {
            const user = users.get(data.user_id);
            if (user) {
                user.status = data.status;
                updateUserList();
            }
        }

        // ========================================================================
        // UI Updates
        // ========================================================================

        function setConnectionStatus(status) {
            elements.connectionStatus.className = `connection-status ${status}`;

            const statusText = {
                'connected': 'Connected',
                'connecting': 'Connecting...',
                'disconnected': 'Disconnected'
            };

            elements.connectionStatus.textContent = statusText[status] || status;
        }

        function updateUserList() {
            elements.userCount.textContent = users.size;
            elements.userList.innerHTML = '';

            users.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.className = 'user-item';

                const statusClass = {
                    'online': 'status-online',
                    'idle': 'status-idle',
                    'offline': 'status-offline'
                }[user.status] || 'status-offline';

                userDiv.innerHTML = `
                    <div class="user-status ${statusClass}"></div>
                    <div class="user-info">
                        <div class="user-name">${user.username}</div>
                        <div class="user-role">${user.role || 'editor'}</div>
                    </div>
                `;

                elements.userList.appendChild(userDiv);
            });
        }

        function addMessage(author, content, isOwn = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'own' : ''}`;

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="message-author">${author}</div>
                    <div class="message-time">${timeStr}</div>
                </div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;

            elements.messagesContainer.appendChild(messageDiv);
            elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message';
            messageDiv.textContent = text;

            elements.messagesContainer.appendChild(messageDiv);
            elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
        }

        function addActivity(text, type) {
            const activityDiv = document.createElement('div');
            activityDiv.className = 'activity-item';

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            activityDiv.innerHTML = `
                <div>${text}</div>
                <div class="activity-time">${timeStr}</div>
            `;

            elements.activityFeed.insertBefore(activityDiv, elements.activityFeed.firstChild);

            // Keep only last 50 activities
            while (elements.activityFeed.children.length > 50) {
                elements.activityFeed.removeChild(elements.activityFeed.lastChild);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========================================================================
        // User Interactions
        // ========================================================================

        function sendChatMessage() {
            const text = elements.messageInput.value.trim();

            if (!text) return;

            // Create CRDT delta for message
            const delta = {
                operation: 'add',
                path: 'messages',
                value: text,
                user_id: currentUser,
                timestamp: new Date().toISOString()
            };

            // Send update
            sendMessage({
                type: 'update',
                data: {
                    delta: delta
                }
            });

            // Clear input
            elements.messageInput.value = '';
        }

        elements.sendButton.addEventListener('click', sendChatMessage);

        elements.messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        });

        // ========================================================================
        // Initialization
        // ========================================================================

        async function init() {
            // Get current user
            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    currentUser = user.username;
                } else {
                    currentUser = 'anonymous';
                }
            } catch (error) {
                console.error('Failed to get user:', error);
                currentUser = 'anonymous';
            }

            // Update session ID
            elements.sessionId.textContent = SESSION_ID;

            // Connect WebSocket
            connect();
        }

        // Start
        init();
    </script>
</body>
</html>
