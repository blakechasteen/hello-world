<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloLoom Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .status {
            font-size: 14px;
            opacity: 0.9;
        }

        .status.connected {
            color: #4ade80;
        }

        .status.disconnected {
            color: #f87171;
        }

        .messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            text-align: left;
        }

        .thinking {
            display: inline-flex;
            align-items: center;
            padding: 12px 18px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            color: #6b7280;
            font-style: italic;
        }

        .thinking::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin-right: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .input-area {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .timestamp {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧵 HoloLoom Chat</h1>
            <div class="status disconnected" id="status">● Connecting...</div>
        </div>

        <div class="messages" id="messages">
            <div class="message assistant">
                <div class="message-content">
                    Welcome to HoloLoom! I'm your neural decision-making assistant.
                    Ask me about Thompson Sampling, reinforcement learning, or how HoloLoom works.
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // WebSocket connection
        const sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
        let ws = null;
        let currentResponseElement = null;
        let currentResponseText = '';

        function connect() {
            const wsUrl = `ws://${window.location.host}/ws/chat/${sessionId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('status').textContent = '● Connected';
                document.getElementById('status').className = 'status connected';

                // Start heartbeat
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 30000);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('status').textContent = '● Disconnected';
                document.getElementById('status').className = 'status disconnected';

                // Reconnect after 3 seconds
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
        }

        function handleMessage(data) {
            const messagesDiv = document.getElementById('messages');

            if (data.type === 'thinking') {
                // Show thinking indicator
                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'message assistant';
                thinkingDiv.id = 'thinking';
                thinkingDiv.innerHTML = '<div class="thinking">Processing your request...</div>';
                messagesDiv.appendChild(thinkingDiv);
                scrollToBottom();
            }
            else if (data.type === 'response_chunk') {
                // Remove thinking indicator
                const thinking = document.getElementById('thinking');
                if (thinking) {
                    thinking.remove();
                }

                // Create or update response element
                if (!currentResponseElement) {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message assistant';
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'message-content';
                    messageDiv.appendChild(contentDiv);
                    messagesDiv.appendChild(messageDiv);
                    currentResponseElement = contentDiv;
                    currentResponseText = '';
                }

                // Append chunk
                currentResponseText += data.text;
                currentResponseElement.textContent = currentResponseText;

                // If done, reset
                if (data.done) {
                    currentResponseElement = null;
                    currentResponseText = '';
                }

                scrollToBottom();
            }
            else if (data.type === 'error') {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message assistant';
                messageDiv.innerHTML = `<div class="message-content" style="background: #fee; border-color: #fcc;">Error: ${data.error}</div>`;
                messagesDiv.appendChild(messageDiv);
                scrollToBottom();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            // Display user message
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `<div class="message-content">${escapeHtml(message)}</div>`;
            messagesDiv.appendChild(messageDiv);

            // Send to server
            ws.send(JSON.stringify({
                type: 'message',
                text: message
            }));

            // Clear input
            input.value = '';
            scrollToBottom();
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Connect on load
        connect();
    </script>
</body>
</html>
