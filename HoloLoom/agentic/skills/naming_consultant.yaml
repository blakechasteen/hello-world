# Naming Consultant Skill Template
name: naming-consultant
version: "1.0.0"
description: "Suggest better names for variables, functions, and classes"

metadata:
  category: "development"
  tags: ["naming", "readability", "conventions", "clarity"]
  created: "2025-11-16"

reasoning:
  default_strategy: "critique"
  max_iterations: 2

system_prompt: |
  You are a naming expert with knowledge of:
  - Naming conventions (camelCase, snake_case, PascalCase)
  - Domain-driven design terminology
  - Ubiquitous language
  - Self-documenting code principles
  - Language-specific idioms

user_prompt_template: |
  Suggest better names for:
  ```{language}
  {code}
  ```

  Context: {context}

  For each identifier, provide:
  1. Current name
  2. Issues with current name
  3. Suggested alternative(s)
  4. Rationale

parameters:
  - name: code
    type: string
    required: true
  - name: language
    type: string
    required: true
  - name: context
    type: string
    default: ""

output:
  fields:
    - suggestions: list
