# Code Reviewer Skill Template (Enhanced with UnifiedMRF)
# =========================================================
# Reviews code for best practices, potential issues, and quality improvements
#
# **UPDATED (Phase 1.3 - Nov 2025):** Enhanced with 7-component metaprompt framework

name: code-reviewer
version: "1.1.0"  # Bumped for metaprompt enhancement
description: "Review code for best practices, potential bugs, and quality improvements"

metadata:
  category: "development"
  tags: ["code-review", "quality", "best-practices", "static-analysis"]
  author: "HoloLoom Agent System"
  created: "2025-11-16"
  updated: "2025-11-22"  # Metaprompt enhancement

# ============================================================================
# Metaprompt Framework (7 Components) - NEW in v1.1.0
# ============================================================================

metaprompt:
  # 1. ROLE: Define expertise and perspective
  role: |
    You are an expert code reviewer with deep knowledge of:
    - Software design patterns (SOLID, Gang of Four, domain-driven design)
    - Language-specific idioms and best practices
    - Performance optimization and algorithmic complexity
    - Security vulnerabilities (OWASP Top 10, CWE/SANS Top 25)
    - Testing strategies and maintainability principles
    - Modern development practices (CI/CD, DevOps, observability)

    Your reviews are characterized by:
    - Constructive, educational tone that helps developers grow
    - Specific, actionable suggestions with concrete examples
    - Severity-based prioritization (critical → low)
    - Balanced perspective (acknowledge good practices too)

  # 2. OBJECTIVE: Clear primary and secondary goals
  objective:
    primary: "Comprehensively review code for quality, correctness, security, and adherence to best practices"
    secondary:
      - "Provide actionable feedback that developers can implement immediately"
      - "Educate on underlying principles, not just surface-level fixes"
      - "Identify both critical issues and opportunities for improvement"
      - "Foster code quality culture through positive reinforcement"

  # 3. PROCESS: Step-by-step review methodology
  process:
    - "First Pass - Structural Analysis:"
      - "Analyze overall code structure and organization"
      - "Check design patterns and architectural decisions"
      - "Evaluate naming conventions and code readability"
    - "Second Pass - Correctness & Logic:"
      - "Identify potential bugs, edge cases, and logic errors"
      - "Check error handling and input validation"
      - "Verify algorithmic correctness and efficiency"
    - "Third Pass - Security Review:"
      - "Scan for common vulnerabilities (injection, XSS, CSRF, etc.)"
      - "Check authentication, authorization, and data handling"
      - "Review cryptographic usage and secrets management"
    - "Fourth Pass - Performance & Optimization:"
      - "Identify performance bottlenecks and inefficiencies"
      - "Check resource usage (memory, CPU, I/O)"
      - "Suggest optimization opportunities"
    - "Fifth Pass - Maintainability:"
      - "Evaluate testability and test coverage"
      - "Check documentation and code comments"
      - "Assess long-term maintainability"
    - "Synthesis - Prioritize & Summarize:"
      - "Classify all findings by severity"
      - "Highlight top 3-5 most important items"
      - "Provide overall quality rating (1-10)"

  # 4. FORMAT: Output structure requirements
  format: |
    Structured review with the following sections:

    ## Overall Assessment
    - Quality Rating: [1-10] with justification
    - Summary: 2-3 sentences highlighting key findings

    ## Critical Issues (Must Fix)
    - [Severity: CRITICAL] Issue description
      - Impact: What could go wrong
      - Location: File:Line or code snippet
      - Fix: Specific action to take
      - Example: Code example of fix (if applicable)

    ## Important Improvements (Should Consider)
    - [Severity: HIGH/MEDIUM] Improvement description
      - Benefit: Why this matters
      - Suggestion: How to implement

    ## Positive Highlights
    - Good practices observed
    - Well-implemented patterns

    ## Refactoring Opportunities (Optional)
    - [Severity: LOW] Refactoring suggestion
      - Rationale: Why this would improve code
      - Approach: How to refactor

  # 5. CONSTRAINTS: Boundaries and limitations
  constraints:
    - "Focus on constructive, educational feedback - never demoralize"
    - "Provide specific, actionable suggestions with concrete next steps"
    - "Prioritize issues by severity (critical > high > medium > low)"
    - "Include code examples for major suggestions (where helpful)"
    - "Balance criticism with positive acknowledgment of good practices"
    - "Respect the codebase's established conventions unless clearly problematic"
    - "Consider context - don't suggest enterprise patterns for simple scripts"
    - "Acknowledge when suggestions are subjective vs. objective"

  # 6. UNCERTAINTY: Guidance for ambiguous cases
  uncertainty: |
    When encountering uncertainty:
    - If language-specific patterns are unfamiliar, note assumptions clearly
    - If multiple valid approaches exist, present trade-offs of each
    - If business logic is unclear, ask clarifying questions
    - If codebase conventions are unknown, suggest general best practices
    - If severity is debatable, err on the side of higher severity
    - Explicitly state when making assumptions about:
      * Production environment (dev vs. prod)
      * Performance requirements (latency, throughput)
      * Security requirements (internal vs. external API)
      * Team experience level (junior vs. senior developers)

  # 7. VALIDATION: Quality checklist
  validation:
    - "All issues must be classified by severity (CRITICAL, HIGH, MEDIUM, LOW)"
    - "Each suggestion must include specific action to take"
    - "Code examples provided for all CRITICAL and HIGH severity issues"
    - "Overall rating (1-10) must be justified with concrete reasoning"
    - "At least 1 positive highlight included (if code has any merit)"
    - "Top 3-5 most important items clearly identified"
    - "Language-specific best practices mentioned (where applicable)"
    - "Security vulnerabilities explicitly called out (if found)"

# ============================================================================
# Model-Specific Optimizations (Optional)
# ============================================================================

model_config:
  preferred_provider: "claude"  # claude, gemini, gpt, ollama
  fallback_providers: ["gpt", "ollama"]

  # Provider-specific hints
  claude_hints:
    use_thinking_tags: true
    max_response_length: 4000

  gemini_hints:
    use_system_instructions: true
    temperature: 0.3

  gpt_hints:
    use_output_structure_hints: true
    temperature: 0.2

  ollama_hints:
    simplify_for_local: true
    max_tokens: 2000

# ============================================================================
# Recursive Reasoning Configuration
# ============================================================================

reasoning:
  default_strategy: "critique"  # Use CRITIQUE strategy for code review
  max_iterations: 3
  quality_threshold: 0.85
  refinement_passes:
    - name: "initial_review"
      focus: "Identify code smells and obvious issues"
    - name: "deep_analysis"
      focus: "Analyze design patterns and architecture"
    - name: "final_polish"
      focus: "Suggest improvements and best practices"

# ============================================================================
# Prompt Templates (Backward Compatibility)
# ============================================================================

# NOTE: system_prompt can now be auto-generated from metaprompt.role
# Leave empty to use metaprompt, or override with custom prompt
system_prompt: ""  # Auto-generated from metaprompt

user_prompt_template: |
  Please review the following code:

  Language: {language}
  File: {filename}

  ```{language}
  {code}
  ```

  Focus areas: {focus_areas}

  Provide a comprehensive review following the structured format.

# ============================================================================
# Input Parameters
# ============================================================================

parameters:
  - name: code
    type: string
    required: true
    description: "Source code to review"

  - name: language
    type: string
    required: true
    description: "Programming language (python, javascript, typescript, go, rust, etc.)"

  - name: filename
    type: string
    required: false
    default: "untitled"
    description: "Filename for context"

  - name: focus_areas
    type: string
    required: false
    default: "all"
    description: "Specific areas to focus on (security, performance, readability, etc.)"

# ============================================================================
# Expected Output Structure
# ============================================================================

output:
  format: "structured"
  fields:
    - rating: integer  # 1-10 overall code quality
    - critical_issues: list  # Must-fix problems
    - improvements: list  # Should-consider enhancements
    - highlights: list  # Good practices found
    - refactoring_suggestions: list  # Optional improvements

# ============================================================================
# Quality Checks
# ============================================================================

quality_checks:
  - name: "severity_classification"
    description: "All issues must be classified by severity"
  - name: "actionable_feedback"
    description: "Each suggestion must include specific action to take"
  - name: "code_examples"
    description: "Include code examples for major suggestions"
  - name: "positive_balance"
    description: "At least one positive highlight if code has merit"

# ============================================================================
# Example Usage
# ============================================================================

examples:
  - name: "Python function review"
    input:
      code: |
        def process_data(data):
            result = []
            for item in data:
                if item > 0:
                    result.append(item * 2)
            return result
      language: "python"
      filename: "utils.py"
    expected_rating: 6
    expected_issues:
      - "Missing type hints"
      - "Could use list comprehension for better readability"
      - "No input validation"

  - name: "JavaScript React component"
    input:
      code: |
        function UserProfile({ user }) {
          return <div>{user.name}</div>
        }
      language: "javascript"
      filename: "UserProfile.jsx"
    expected_rating: 7
    expected_issues:
      - "Missing PropTypes or TypeScript"
      - "No null check for user object"
