[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "hololoom-rust"
version = "0.1.0"
description = "High-performance Rust algorithms for HoloLoom clustering"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "HoloLoom Contributors"}
]
keywords = ["clustering", "machine-learning", "embeddings", "simd", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
]

[project.urls]
Homepage = "https://github.com/hololoom/hololoom"
Repository = "https://github.com/hololoom/hololoom"

[tool.maturin]
# Build for the Python interpreter that's running maturin
python-source = "python"
module-name = "hololoom_rust"
features = ["pyo3/extension-module"]

# Strip symbols for smaller binaries
strip = true

# Build with release optimizations
profile = "release"
