[workspace]
resolver = "2"
members = [
    "hololoom-core",
    "hololoom-python",
    "hololoom-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HoloLoom Contributors"]
license = "MIT"
repository = "https://github.com/hololoom/hololoom"

[workspace.dependencies]
# Core math
ndarray = "0.15"
rayon = "1.8"
num-traits = "0.2"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"

# Testing
approx = "0.5"
criterion = "0.5"

# Internal
hololoom-core = { path = "hololoom-core" }
