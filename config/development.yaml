# EdWIN Development Configuration
# Configuration for local development environment
#
# Implementation Date: November 15, 2025

environment: development

# Application
app:
  name: EdWIN AI Tutor
  version: 1.0.0
  debug: true
  log_level: DEBUG

# Server
server:
  api_host: 0.0.0.0
  api_port: 8000
  dashboard_port: 8001
  mobile_port: 8002
  workers: 1
  reload: true  # Auto-reload on code changes

# Database
database:
  use_persistent_storage: false  # Use in-memory for dev
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: neo4j_dev_password
    max_connection_pool_size: 10
  qdrant:
    host: localhost
    port: 6333
    timeout: 30
  redis:
    host: localhost
    port: 6379
    db: 0
    password: null
    max_connections: 20

# Authentication
auth:
  jwt_secret_key: dev_secret_key_not_for_production
  algorithm: HS256
  access_token_expire_minutes: 1440  # 24 hours
  refresh_token_expire_days: 30
  password:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_digit: true
    require_special: true

# CORS
cors:
  allow_origins:
    - http://localhost:3000
    - http://localhost:8000
    - http://localhost:8001
    - http://localhost:8002
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - "*"
  allow_credentials: true

# Rate Limiting
rate_limit:
  enabled: false  # Disabled for dev
  per_minute: 1000
  per_hour: 10000

# Features
features:
  analytics: true
  caching: true
  multimodal: true
  safety_layer: true
  adaptive_difficulty: true

# LLM
llm:
  provider: anthropic  # anthropic, openai, ollama
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-3-5-sonnet-20241022
    max_tokens: 4096
  openai:
    api_key: ${OPENAI_API_KEY}
    model: gpt-4
  ollama:
    base_url: http://localhost:11434
    model: llama3.2:3b

# Monitoring
monitoring:
  prometheus:
    enabled: false  # Disabled for dev
    port: 9090
  sentry:
    enabled: false
    dsn: null

# Logging
logging:
  level: DEBUG
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  dir: ./logs
  rotation_days: 7
  file_size_mb: 10
