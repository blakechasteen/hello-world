[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hololoom"
version = "1.0.0-alpha.1"
description = "An AI assistant that learns from you - self-improving with recursive learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Blake Chasteen", email = "blakechasteen@users.noreply.github.com" }
]
keywords = [
    "ai",
    "machine-learning",
    "recursive-learning",
    "thompson-sampling",
    "knowledge-graph",
    "memory-system",
    "neurosymbolic",
    "self-improvement",
    "provenance",
    "graphrag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "asyncio",
]

[project.urls]
"Bug Tracker" = "https://github.com/blakechasteen/mythRL/issues"
"Documentation" = "https://github.com/blakechasteen/mythRL/blob/master/README.md"
"Source Code" = "https://github.com/blakechasteen/mythRL"
"Release Notes" = "https://github.com/blakechasteen/mythRL/blob/master/RELEASE_v1.0.0.md"

[project.optional-dependencies]
nlp = [
    "spacy>=3.7.0,<4.0.0",
    "sentence-transformers>=2.2.0,<3.0.0",
]
voice = [
    "openai-whisper>=20231117",
    "librosa>=0.10.0,<1.0.0",
]
vision = [
    "opencv-python>=4.8.0,<5.0.0",
    "ultralytics>=8.0.0,<9.0.0",
]
server = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn>=0.24.0,<1.0.0",
    "websockets>=12.0,<14.0",
]
ml = [
    "scipy>=1.11.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
]
rl = ["gymnasium>=0.29.0,<1.0.0"]
production = [
    "qdrant-client>=1.7.0,<2.0.0",
    "neo4j>=5.0.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=23.0.0,<24.0.0",
    "mypy>=1.5.0,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
    "isort>=5.13.0,<6.0.0",
    "pre-commit>=3.5.0,<4.0.0",
]
viz = ["matplotlib>=3.7.0,<4.0.0", "plotly>=5.17.0,<6.0.0"]
all = [
    "hololoom[nlp,voice,vision,server,ml,rl,production,viz]",
]

[project.scripts]
hololoom = "hololoom.cli:main"

# ============================================================================
# Black Configuration
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | tests
)/
'''
skip-string-normalization = false
skip-magic-trailing-comma = false

# ============================================================================
# isort Configuration (must match Black)
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".venv", "build", "dist", ".tox"]
known_first_party = ["hololoom"]
known_third_party = ["torch", "numpy", "gymnasium", "spacy", "networkx", "pytest"]

# ============================================================================
# Ruff Configuration (fast linter, replaces flake8)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "F",     # Pyflakes: undefined names, unused imports
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort: import sorting
    "C",     # mccabe: complexity checking
    "UP",    # pyupgrade: modernize code
    "B",     # flake8-bugbear: common bugs
    "A",     # flake8-builtins: shadowed builtins
    "C90",   # mccabe: complexity
]
ignore = [
    "E501",  # line-too-long (handled by Black)
    "W503",  # line-break-before-binary-operator
    "W504",  # line-break-after-binary-operator
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    ".tox",
    "tests",
    "archive",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**" = ["F841"]     # Allow unused variables in tests

[tool.ruff.mccabe]
max-complexity = 10

# ============================================================================
# mypy Configuration (type checking)
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = false  # Too strict for first pass

# Exclude tests and build directories
exclude = ["tests/", "build/", "dist/", ".venv/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "numpy",
    "gymnasium",
    "spacy",
    "networkx",
    "nltk",
    "sklearn",
    "scipy",
]
ignore_missing_imports = true

# ============================================================================
# pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["hololoom/tests", "tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests (medium)",
    "e2e: End-to-end tests (slow)",
    "slow: Slow tests",
    "requires_gpu: Tests requiring GPU",
    "performance: Performance benchmarks",
    "timeout: Tests with timeout requirements",
    "smoke: Smoke tests",
    "trough: Trough detector tests",
    "bosspig: BossPig AI tests",
    "edge_case: Edge case tests",
]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["hololoom"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "if not TYPE_CHECKING:",
    "@abstractmethod",
    "@abstractproperty",
    "pass",
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

# ============================================================================
# Build Configuration
# ============================================================================
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hololoom*"]

[tool.setuptools.package-data]
hololoom = [
    "*.md",
    "config/*.yaml",
    "visualization/*.css",
    "visualization/*.js",
]
