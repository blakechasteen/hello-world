apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hololoom.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Neo4j credentials
  neo4j-password: {{ .Values.secrets.neo4j.password | quote }}
  neo4j-auth: "{{ .Values.neo4j.auth.username }}/{{ .Values.secrets.neo4j.password }}"

  # Redis password
  redis-password: {{ .Values.secrets.redis.password | quote }}

  # RabbitMQ credentials
  rabbitmq-username: {{ .Values.secrets.rabbitmq.username | quote }}
  rabbitmq-password: {{ .Values.secrets.rabbitmq.password | quote }}
  rabbitmq-erlang-cookie: {{ .Values.secrets.rabbitmq.erlangCookie | quote }}

  # Grafana admin password
  grafana-admin-password: {{ .Values.secrets.grafana.adminPassword | quote }}

  # API keys and tokens
  api-secret-key: {{ .Values.secrets.api.secretKey | quote }}
  jwt-secret: {{ .Values.secrets.api.jwtSecret | quote }}
