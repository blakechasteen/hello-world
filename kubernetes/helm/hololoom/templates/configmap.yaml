apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hololoom.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
data:
  # Application configuration
  {{- range $key, $value := .Values.configMap.app }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

  # Database configuration
  {{- range $key, $value := .Values.configMap.database }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

  # Queue configuration
  {{- range $key, $value := .Values.configMap.queue }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

  # Monitoring configuration
  {{- range $key, $value := .Values.configMap.monitoring }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
