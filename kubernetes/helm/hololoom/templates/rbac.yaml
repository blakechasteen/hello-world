{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hololoom.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hololoom.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
rules:
  # Allow reading pods for service discovery
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Allow reading endpoints for service discovery
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # Allow reading configmaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading secrets (for application use)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hololoom.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hololoom.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hololoom.serviceAccountName" . }}
    namespace: {{ .Values.global.namespace }}
{{- end }}
