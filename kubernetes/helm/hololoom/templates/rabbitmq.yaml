{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hololoom.fullname" . }}-rabbitmq
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: {{ include "hololoom.fullname" . }}-rabbitmq
  replicas: {{ .Values.rabbitmq.replicaCount }}
  selector:
    matchLabels:
      {{- include "hololoom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "hololoom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hololoom.serviceAccountName" . }}
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      initContainers:
        - name: setup-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chmod 400 /var/lib/rabbitmq/.erlang.cookie || true
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: management
              containerPort: 15672
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: dist
              containerPort: 25672
              protocol: TCP
          env:
            # Authentication
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hololoom.fullname" . }}-secrets
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "hololoom.fullname" . }}-secrets
                  key: rabbitmq-password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ include "hololoom.fullname" . }}-secrets
                  key: rabbitmq-erlang-cookie
            # Configuration
            - name: RABBITMQ_VM_MEMORY_HIGH_WATERMARK
              value: {{ .Values.rabbitmq.config.vm_memory_high_watermark | quote }}
            - name: RABBITMQ_DISK_FREE_LIMIT
              value: {{ .Values.rabbitmq.config.disk_free_limit | quote }}
            - name: RABBITMQ_CLUSTER_PARTITION_HANDLING
              value: {{ .Values.rabbitmq.config.cluster_partition_handling | quote }}
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_NODENAME
              value: rabbit@$(POD_NAME).{{ include "hololoom.fullname" . }}-rabbitmq.{{ .Values.global.namespace }}.svc.cluster.local
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.rabbitmq.cluster.enabled }}
            # Cluster configuration
            - name: RABBITMQ_CLUSTER_FORMATION_K8S_ADDRESS_TYPE
              value: hostname
            - name: RABBITMQ_CLUSTER_FORMATION_K8S_HOSTNAME_SUFFIX
              value: .{{ include "hololoom.fullname" . }}-rabbitmq.{{ .Values.global.namespace }}.svc.cluster.local
            {{- end }}
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq
      volumes:
        - name: config
          configMap:
            name: {{ include "hololoom.fullname" . }}-rabbitmq-config
  {{- if .Values.rabbitmq.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "hololoom.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.rabbitmq.persistence.accessMode }}
        {{- if .Values.rabbitmq.persistence.storageClass }}
        {{- if (eq "-" .Values.rabbitmq.persistence.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.rabbitmq.persistence.storageClass }}
        {{- end }}
        {{- else }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.persistence.size }}
  {{- else }}
        - name: data
          emptyDir: {}
  {{- end }}
---
# RabbitMQ ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hololoom.fullname" . }}-rabbitmq-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_peer_discovery_k8s,rabbitmq_prometheus,rabbitmq_shovel,rabbitmq_shovel_management].

  rabbitmq.conf: |
    # Clustering
    {{- if .Values.rabbitmq.cluster.enabled }}
    cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type = hostname
    cluster_formation.k8s.hostname_suffix = .{{ include "hololoom.fullname" . }}-rabbitmq.{{ .Values.global.namespace }}.svc.cluster.local
    cluster_formation.node_cleanup.interval = 30
    cluster_formation.node_cleanup.only_log_warning = true
    cluster_partition_handling = {{ .Values.rabbitmq.config.cluster_partition_handling }}
    {{- end }}

    # Memory and disk limits
    vm_memory_high_watermark.relative = {{ .Values.rabbitmq.config.vm_memory_high_watermark }}
    disk_free_limit.absolute = {{ .Values.rabbitmq.config.disk_free_limit }}

    # Networking
    listeners.tcp.default = 5672
    management.tcp.port = 15672

    # Logging
    log.console = true
    log.console.level = info
    log.file.level = info

    # Performance
    channel_max = 2047
    heartbeat = 60
    frame_max = 131072

    # Queue defaults
    queue_master_locator = min-masters
{{- end }}
