# API Service
{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hololoom.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "hololoom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
{{- end }}
---
# Neo4j Headless Service for StatefulSet
{{- if .Values.neo4j.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hololoom.fullname" . }}-neo4j
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.neo4j.service.port }}
      targetPort: 7687
      protocol: TCP
      name: bolt
    - port: {{ .Values.neo4j.service.httpPort }}
      targetPort: 7474
      protocol: TCP
      name: http
    - port: {{ .Values.neo4j.service.httpsPort }}
      targetPort: 7473
      protocol: TCP
      name: https
    - port: 6000
      targetPort: 6000
      protocol: TCP
      name: backup
    - port: 7688
      targetPort: 7688
      protocol: TCP
      name: discovery
  selector:
    {{- include "hololoom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
{{- end }}
---
# Neo4j Client Service
{{- if .Values.neo4j.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hololoom.fullname" . }}-neo4j-client
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.neo4j.service.port }}
      targetPort: 7687
      protocol: TCP
      name: bolt
    - port: {{ .Values.neo4j.service.httpPort }}
      targetPort: 7474
      protocol: TCP
      name: http
  selector:
    {{- include "hololoom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
{{- end }}
---
