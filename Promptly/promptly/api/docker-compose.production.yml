version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: promptly-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-promptly}
      - POSTGRES_USER=${POSTGRES_USER:-promptly}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promptly}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - promptly-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: promptly-redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - promptly-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Promptly API Service
  api:
    build:
      context: ../..
      dockerfile: promptly/api/Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VCS_REF=${VCS_REF}
    container_name: promptly-api
    environment:
      # API Configuration
      - PROMPTLY_APP_NAME=${PROMPTLY_APP_NAME:-Promptly API}
      - PROMPTLY_APP_VERSION=${PROMPTLY_APP_VERSION:-1.0.0}
      - PROMPTLY_API_PREFIX=/api/v1
      - PROMPTLY_LOG_LEVEL=${PROMPTLY_LOG_LEVEL:-INFO}
      - PROMPTLY_LOG_FORMAT=json
      - PROMPTLY_HOST=0.0.0.0
      - PROMPTLY_PORT=8000
      - PROMPTLY_WORKERS=${PROMPTLY_WORKERS:-4}
      - PROMPTLY_RELOAD=false

      # CORS
      - PROMPTLY_CORS_ORIGINS=${PROMPTLY_CORS_ORIGINS}
      - PROMPTLY_CORS_ALLOW_CREDENTIALS=true

      # Security
      - PROMPTLY_SECRET_KEY=${PROMPTLY_SECRET_KEY}
      - PROMPTLY_API_KEY_HEADER=X-API-Key
      - PROMPTLY_JWT_ALGORITHM=HS256
      - PROMPTLY_ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      # Rate Limiting
      - PROMPTLY_RATE_LIMIT_ENABLED=true
      - PROMPTLY_RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-100}
      - PROMPTLY_RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-200}

      # Database (PostgreSQL)
      - PROMPTLY_DATABASE_URL=postgresql://${POSTGRES_USER:-promptly}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-promptly}
      - PROMPTLY_STORAGE_BACKEND=postgresql

      # Redis
      - PROMPTLY_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

      # Storage
      - PROMPTLY_ROOT_DIR=/data

      # Monitoring
      - PROMPTLY_ENABLE_METRICS=true
      - PROMPTLY_METRICS_PORT=9090

      # WebSocket
      - PROMPTLY_WS_HEARTBEAT_INTERVAL=30
      - PROMPTLY_WS_MAX_CONNECTIONS=${WS_MAX_CONNECTIONS:-100}

    volumes:
      - promptly-data:/data
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - promptly-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: promptly-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - promptly-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  promptly-data:
    driver: local
  nginx-cache:
    driver: local

networks:
  promptly-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
