# Prometheus Configuration for HoloLoom
# =======================================
# Scrapes metrics from HoloLoom API server
#
# Author: HoloLoom Team
# Date: 2025-11-18 (Week 8B)

global:
  scrape_interval: 15s  # Scrape every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'hololoom-production'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (optional - for alerts and recording rules)
# rule_files:
#   - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # HoloLoom API Server
  - job_name: 'hololoom-api'
    static_configs:
      - targets: ['hololoom-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis exporter (if enabled)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # Node exporter (system metrics, if enabled)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
