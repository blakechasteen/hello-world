groups:
  - name: hololoom_phase3_adaptive_learning
    interval: 30s
    rules:
      # ===================================
      # Accuracy Alerts
      # ===================================

      - alert: ClassifierAccuracyLow
        expr: moonshot_accuracy{complexity="overall"} < 0.90
        for: 5m
        labels:
          severity: warning
          component: adaptive_learning
          team: ml-engineering
        annotations:
          summary: "Classifier accuracy below 90%"
          description: "Overall accuracy is {{ $value | humanizePercentage }}. Expected >90%. Investigate recent pattern deployments."
          runbook_url: "https://docs.hololoom.example.com/runbooks/classifier-accuracy-low"

      - alert: ClassifierAccuracyCritical
        expr: moonshot_accuracy{complexity="overall"} < 0.85
        for: 2m
        labels:
          severity: critical
          component: adaptive_learning
          team: ml-engineering
          page: "true"
        annotations:
          summary: "Classifier accuracy critically low"
          description: "Overall accuracy is {{ $value | humanizePercentage }}. Expected >85%. IMMEDIATE ACTION REQUIRED - consider rollback."
          runbook_url: "https://docs.hololoom.example.com/runbooks/classifier-accuracy-critical"

      # ===================================
      # Per-Complexity Accuracy Alerts
      # ===================================

      - alert: ComplexityAccuracyLow
        expr: moonshot_accuracy < 0.80
        for: 5m
        labels:
          severity: warning
          component: adaptive_learning
          team: ml-engineering
        annotations:
          summary: "Low accuracy for {{ $labels.complexity }} queries"
          description: "Accuracy for {{ $labels.complexity }} is {{ $value | humanizePercentage }}. Expected >80%."
          runbook_url: "https://docs.hololoom.example.com/runbooks/complexity-accuracy-low"

      # ===================================
      # Regression Alerts
      # ===================================

      - alert: RegressionDetected
        expr: increase(moonshot_regressions_detected[1h]) > 0
        labels:
          severity: warning
          component: adaptive_learning
          team: ml-engineering
        annotations:
          summary: "Regression detected in classifier"
          description: "{{ $value }} regressions detected in last hour. Review validation logs."
          runbook_url: "https://docs.hololoom.example.com/runbooks/regression-detected"

      - alert: HighRegressionRate
        expr: increase(moonshot_regressions_detected[24h]) > 3
        labels:
          severity: critical
          component: adaptive_learning
          team: ml-engineering
          page: "true"
        annotations:
          summary: "High regression rate detected"
          description: "{{ $value }} regressions in last 24 hours. System stability compromised. Investigation required."
          runbook_url: "https://docs.hololoom.example.com/runbooks/high-regression-rate"

      # ===================================
      # Latency Alerts
      # ===================================

      - alert: HighClassificationLatency
        expr: moonshot_latency_ms > 200
        for: 5m
        labels:
          severity: warning
          component: adaptive_learning
          team: platform-engineering
        annotations:
          summary: "High classification latency"
          description: "Average latency is {{ $value }}ms. Expected <150ms. Check system resources."
          runbook_url: "https://docs.hololoom.example.com/runbooks/high-latency"

      - alert: CriticalClassificationLatency
        expr: moonshot_latency_ms > 500
        for: 2m
        labels:
          severity: critical
          component: adaptive_learning
          team: platform-engineering
          page: "true"
        annotations:
          summary: "Critical classification latency"
          description: "Average latency is {{ $value }}ms. Expected <150ms. User experience severely degraded."
          runbook_url: "https://docs.hololoom.example.com/runbooks/critical-latency"

      # ===================================
      # Pattern Deployment Alerts
      # ===================================

      - alert: NoPatternDeployment
        expr: increase(moonshot_patterns_deployed[7d]) == 0
        labels:
          severity: info
          component: adaptive_learning
          team: ml-engineering
        annotations:
          summary: "No patterns deployed in 7 days"
          description: "No new patterns have been deployed in the last 7 days. System may not be learning. Check pattern miner logs."
          runbook_url: "https://docs.hololoom.example.com/runbooks/no-pattern-deployment"

      - alert: HighPatternDeploymentRate
        expr: increase(moonshot_patterns_deployed[1h]) > 10
        labels:
          severity: warning
          component: adaptive_learning
          team: ml-engineering
        annotations:
          summary: "Unusually high pattern deployment rate"
          description: "{{ $value }} patterns deployed in last hour. Normal rate is 0-3/hour. Investigate pattern quality."
          runbook_url: "https://docs.hololoom.example.com/runbooks/high-pattern-deployment"

      # ===================================
      # Query Volume Alerts
      # ===================================

      - alert: LowQueryVolume
        expr: rate(moonshot_queries_total[5m]) < 1
        for: 10m
        labels:
          severity: warning
          component: adaptive_learning
          team: platform-engineering
        annotations:
          summary: "Low query volume"
          description: "Query rate is {{ $value }}/s. Expected >1/s in production. Check upstream services."
          runbook_url: "https://docs.hololoom.example.com/runbooks/low-query-volume"

      - alert: NoQueries
        expr: rate(moonshot_queries_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
          component: adaptive_learning
          team: platform-engineering
          page: "true"
        annotations:
          summary: "No queries received"
          description: "No queries in last 5 minutes. Service may be down or unreachable."
          runbook_url: "https://docs.hololoom.example.com/runbooks/no-queries"

      - alert: HighQueryVolume
        expr: rate(moonshot_queries_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: adaptive_learning
          team: platform-engineering
        annotations:
          summary: "Unusually high query volume"
          description: "Query rate is {{ $value }}/s. Expected <50/s. Monitor for capacity issues."
          runbook_url: "https://docs.hololoom.example.com/runbooks/high-query-volume"

      # ===================================
      # System Health Alerts
      # ===================================

      - alert: ClassifierDown
        expr: up{job="hololoom-phase3"} == 0
        for: 1m
        labels:
          severity: critical
          component: adaptive_learning
          team: platform-engineering
          page: "true"
        annotations:
          summary: "HoloLoom Phase 3 classifier is down"
          description: "Classifier has been unreachable for 1 minute. Service outage."
          runbook_url: "https://docs.hololoom.example.com/runbooks/classifier-down"

      # ===================================
      # Data Quality Alerts
      # ===================================

      - alert: ValidationSetStale
        expr: time() - moonshot_validation_last_updated_timestamp > 2592000  # 30 days
        labels:
          severity: info
          component: adaptive_learning
          team: ml-engineering
        annotations:
          summary: "Validation set is stale"
          description: "Validation set hasn't been updated in 30+ days. Consider refreshing with recent production examples."
          runbook_url: "https://docs.hololoom.example.com/runbooks/validation-set-stale"
