# Kubernetes Service for HoloLoom VoiceAgent
# ============================================
# Exposes Voice Agent pods
# Date: November 15, 2025

apiVersion: v1
kind: Service
metadata:
  name: voice-agent-service
  namespace: hololoom-voice
  labels:
    app: voice-agent
    component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"

spec:
  type: ClusterIP
  selector:
    app: voice-agent
    component: backend

  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

  sessionAffinity: ClientIP  # Sticky sessions for conversation continuity
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300  # 5 minutes

---
# Headless Service for StatefulSet (if needed)
apiVersion: v1
kind: Service
metadata:
  name: voice-agent-headless
  namespace: hololoom-voice
  labels:
    app: voice-agent
    component: backend
spec:
  clusterIP: None
  selector:
    app: voice-agent
    component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
# LoadBalancer Service (for external access)
apiVersion: v1
kind: Service
metadata:
  name: voice-agent-external
  namespace: hololoom-voice
  labels:
    app: voice-agent
    component: backend
  annotations:
    # AWS Load Balancer annotations (example)
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

spec:
  type: LoadBalancer
  selector:
    app: voice-agent
    component: backend

  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

  # External traffic policy
  externalTrafficPolicy: Local  # Preserve client IPs

  # Health check node port
  healthCheckNodePort: 30000
