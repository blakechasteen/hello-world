# Kubernetes Deployment for HoloLoom VoiceAgent
# ===============================================
# Production-ready deployment with health checks, resource limits, and scaling
# Date: November 15, 2025

apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-agent
  namespace: hololoom-voice
  labels:
    app: voice-agent
    component: backend
    version: v1.0.0

spec:
  # Replicas - will be controlled by HPA
  replicas: 3

  # Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime

  # Pod selector
  selector:
    matchLabels:
      app: voice-agent
      component: backend

  # Pod template
  template:
    metadata:
      labels:
        app: voice-agent
        component: backend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"

    spec:
      # Service account
      serviceAccountName: voice-agent

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Init containers
      initContainers:
        # Wait for Neo4j to be ready
        - name: wait-for-neo4j
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z neo4j-service 7687; do
                echo "Waiting for Neo4j..."
                sleep 2
              done
              echo "Neo4j is ready!"

        # Wait for Qdrant to be ready
        - name: wait-for-qdrant
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z qdrant-service 6333; do
                echo "Waiting for Qdrant..."
                sleep 2
              done
              echo "Qdrant is ready!"

      # Main containers
      containers:
        - name: voice-agent
          image: hololoom/voice-agent:latest
          imagePullPolicy: IfNotPresent

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Set to true if possible
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          # Ports
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: voice-agent-config

          # Environment variables from Secrets
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voice-agent-secrets
                  key: OPENAI_API_KEY

            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voice-agent-secrets
                  key: NEO4J_PASSWORD

          # Resource limits and requests
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"

          # Volume mounts
          volumeMounts:
            - name: sessions-data
              mountPath: /data/sessions
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp

          # Liveness probe
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from HoloLoom.voice import VoiceAgent; print('alive')"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from HoloLoom.voice import VoiceAgent; print('ready')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup probe (for slow-starting apps)
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "from HoloLoom.voice import VoiceAgent; print('started')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # 5 minutes to start

      # Volumes
      volumes:
        - name: sessions-data
          persistentVolumeClaim:
            claimName: voice-sessions-pvc
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}

      # Node selector (optional - for dedicated nodes)
      # nodeSelector:
      #   workload: voice-agent

      # Tolerations (optional - for tainted nodes)
      # tolerations:
      #   - key: "workload"
      #     operator: "Equal"
      #     value: "voice-agent"
      #     effect: "NoSchedule"

      # Affinity rules
      affinity:
        # Prefer spreading pods across nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - voice-agent
                topologyKey: kubernetes.io/hostname

      # Pod disruption budget (defined separately)
      # See: pdb.yaml

      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# ServiceAccount for Voice Agent
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voice-agent
  namespace: hololoom-voice
  labels:
    app: voice-agent

---
# Role for Voice Agent (if RBAC is enabled)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voice-agent-role
  namespace: hololoom-voice
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding for Voice Agent
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voice-agent-rolebinding
  namespace: hololoom-voice
subjects:
  - kind: ServiceAccount
    name: voice-agent
    namespace: hololoom-voice
roleRef:
  kind: Role
  name: voice-agent-role
  apiGroup: rbac.authorization.k8s.io
