# Kubernetes Secret for HoloLoom VoiceAgent
# ==========================================
# Sensitive configuration (base64 encoded)
# Date: November 15, 2025
#
# IMPORTANT: DO NOT commit real secrets to git!
# Use external secret management (e.g., Sealed Secrets, External Secrets Operator)

apiVersion: v1
kind: Secret
metadata:
  name: voice-agent-secrets
  namespace: hololoom-voice
  labels:
    app: voice-agent
    component: secrets

type: Opaque

# Example values (base64 encoded)
# Replace these with actual values in production
data:
  # OpenAI API Key (required for TTS)
  # Example: echo -n "sk-your-api-key" | base64
  OPENAI_API_KEY: c2stZXhhbXBsZS1hcGkta2V5  # "sk-example-api-key"

  # Neo4j Password
  # Example: echo -n "your-neo4j-password" | base64
  NEO4J_PASSWORD: cGFzc3dvcmQ=  # "password"

  # Redis Password (if using authentication)
  # Example: echo -n "your-redis-password" | base64
  REDIS_PASSWORD: ""

---
# Secret for pulling private Docker images (if needed)
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: hololoom-voice
  labels:
    app: voice-agent
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6e319  # Empty for public images


# Production Secret Management Best Practices:
# ============================================
#
# 1. Use External Secrets Operator
#    - Sync secrets from AWS Secrets Manager, Azure Key Vault, etc.
#    - Automatic rotation
#
# 2. Use Sealed Secrets
#    - Encrypt secrets that can be safely committed to git
#    - Only cluster can decrypt
#
# 3. Use Vault
#    - HashiCorp Vault for dynamic secret generation
#    - Short-lived credentials
#
# 4. Use RBAC
#    - Limit who can read secrets
#    - Audit secret access
#
# Example with External Secrets Operator:
# ----------------------------------------
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: voice-agent-secrets
#   namespace: hololoom-voice
# spec:
#   secretStoreRef:
#     name: aws-secrets-manager
#     kind: SecretStore
#   target:
#     name: voice-agent-secrets
#   data:
#   - secretKey: OPENAI_API_KEY
#     remoteRef:
#       key: prod/hololoom/openai-api-key
