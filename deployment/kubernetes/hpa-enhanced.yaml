# Enhanced Horizontal Pod Autoscaler for HoloLoom VoiceAgent
# ========================================================
# Production-ready HPA with comprehensive metrics and scaling policies
# Updated: 2025-11-16 (Wave 3 - Production Hardening)

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-agent-hpa
  namespace: hololoom-voice
  labels:
    app: voice-agent
    component: autoscaling
    version: "1.0"
  annotations:
    description: "Scales voice-agent pods based on CPU, memory, and custom metrics"
    prometheus_scrape: "true"
    load_test_date: "2025-11-16"

spec:
  # ======================================================================
  # Scaling Target
  # ======================================================================

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-agent

  # ======================================================================
  # Pod Replica Limits
  # ======================================================================

  minReplicas: 2      # Minimum 2 pods (HA requirement)
  maxReplicas: 20     # Maximum 20 pods (cost control)

  # ======================================================================
  # Scaling Metrics
  # ======================================================================

  metrics:
    # Primary Metric 1: CPU Utilization (70% target)
    # Rationale:
    #   - Voice command processing: ~150-300ms p95
    #   - LLM reasoning: CPU-bound (~30% per query)
    #   - 70% target = headroom for GC/bursts
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Primary Metric 2: Memory Utilization (80% target)
    # Rationale:
    #   - Embeddings: ~100MB per scale (96d, 192d, 384d)
    #   - LLM context: ~50MB per session
    #   - 80% target = prevent OOM kills
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

    # Custom Metric 1: Request Queue Depth
    # Enabled if Prometheus/metrics-server available
    # Scales up if queue > 100 pending requests
    - type: Pods
      pods:
        metric:
          name: request_queue_depth
        target:
          type: AverageValue
          averageValue: "100"  # Queue per pod

    # Custom Metric 2: Active Voice Sessions (optional)
    # Useful for tracking concurrent users more accurately
    # Disabled by default (remove comment to enable)
    # - type: Pods
    #   pods:
    #     metric:
    #       name: active_voice_sessions
    #     target:
    #       type: AverageValue
    #       averageValue: "10"  # 10 concurrent sessions per pod

    # Custom Metric 3: Cache Hit Rate (optional)
    # Scales down if cache hit rate is high (can reduce pods)
    # Disabled by default (requires custom metrics)
    # - type: Object
    #   object:
    #     metric:
    #       name: cache_hit_rate
    #     describedObject:
    #       apiVersion: v1
    #       kind: Service
    #       name: voice-agent-service
    #     target:
    #       type: Value
    #       value: "75"  # Target 75% hit rate

  # ======================================================================
  # Scaling Behavior (Advanced Tuning)
  # ======================================================================

  behavior:
    # Scale-UP behavior: Aggressive (respond quickly to demand)
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 60s before stabilizing

      policies:
        # Policy 1: Percent-based (double pods if needed)
        - type: Percent
          value: 100        # Scale up by 100% (double)
          periodSeconds: 30 # Check every 30s

        # Policy 2: Pod-based (add up to 4 pods)
        - type: Pods
          value: 4          # Add 4 pods max
          periodSeconds: 30 # Check every 30s

      selectPolicy: Max  # Choose the most aggressive policy (larger increase)

    # Scale-DOWN behavior: Conservative (avoid thrashing)
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down

      policies:
        # Policy 1: Percent-based (remove 50% max)
        - type: Percent
          value: 50         # Remove up to 50%
          periodSeconds: 60 # Check every 60s

        # Policy 2: Pod-based (remove 2 pods max)
        - type: Pods
          value: 2          # Remove max 2 pods
          periodSeconds: 60 # Check every 60s

      selectPolicy: Min  # Choose the most conservative policy (smaller decrease)

# ============================================================================
# Load Test Integration Notes
# ============================================================================
#
# Baseline Test (10 users):
#   - Expected CPU: 15-25%
#   - Expected Memory: 200-300MB
#   - Expected Latency p95: 280ms
#   - HPA Action: None (below thresholds)
#   - Replicas: 2 (minimum)
#
# Stress Test (100 users):
#   - Expected CPU: 50-70% (approaching threshold)
#   - Expected Memory: 400-500MB
#   - Expected Latency p95: 400-600ms
#   - HPA Action: Scale up to 4-6 replicas
#   - Replicas: 4-6 (scale-up triggered at ~2 min mark)
#
# Spike Test (200 users):
#   - Expected CPU: 80-95% (exceeds threshold)
#   - Expected Memory: 600-800MB
#   - Expected Latency p95: 800-1200ms (initial)
#   - HPA Action: Aggressive scale-up to 10+ replicas
#   - Replicas: 8-10 (scale-up within 60s)
#   - Expected Result: p95 drops to 400-500ms after scaling
#
# Endurance Test (50 users, 1 hour):
#   - Expected CPU: 30-40% (stable)
#   - Expected Memory: 300-350MB (stable after warmup)
#   - Expected Latency p95: 250-400ms (stable)
#   - HPA Action: Scale to 3-4 replicas, then stable
#   - Replicas: 3-4 (scale-up at 15 min, then stabilize)
#   - Expected Result: No memory leaks, consistent latency
#
# ============================================================================

---

# ServiceMonitor for Prometheus (Prometheus Operator only)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: voice-agent-metrics
  namespace: hololoom-voice
  labels:
    app: voice-agent
spec:
  selector:
    matchLabels:
      app: voice-agent
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics

---

# PrometheusRule for Alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: voice-agent-alerts
  namespace: hololoom-voice
  labels:
    app: voice-agent
spec:
  groups:
    - name: voice-agent.rules
      interval: 30s
      rules:
        # Alert 1: High Latency (p95 > 500ms for 5 minutes)
        - alert: VoiceAgentHighLatency
          expr: |
            histogram_quantile(0.95, rate(voice_agent_request_duration_ms[5m])) > 500
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Voice Agent p95 latency > 500ms"
            description: "Voice Agent p95 latency: {{ $value }}ms"

        # Alert 2: Very High Latency (p95 > 1000ms for 2 minutes)
        - alert: VoiceAgentCriticalLatency
          expr: |
            histogram_quantile(0.95, rate(voice_agent_request_duration_ms[5m])) > 1000
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Voice Agent p95 latency > 1000ms (CRITICAL)"
            description: "Voice Agent p95 latency: {{ $value }}ms"

        # Alert 3: High Error Rate (>2% for 5 minutes)
        - alert: VoiceAgentHighErrorRate
          expr: |
            rate(voice_agent_requests_failed_total[5m]) / rate(voice_agent_requests_total[5m]) > 0.02
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Voice Agent error rate > 2%"
            description: "Error rate: {{ $value | humanizePercentage }}"

        # Alert 4: Critical Error Rate (>5% for 2 minutes)
        - alert: VoiceAgentCriticalErrorRate
          expr: |
            rate(voice_agent_requests_failed_total[5m]) / rate(voice_agent_requests_total[5m]) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Voice Agent error rate > 5% (CRITICAL)"
            description: "Error rate: {{ $value | humanizePercentage }}"

        # Alert 5: Memory Leak Detection
        - alert: VoiceAgentMemoryLeak
          expr: |
            (rate(container_memory_rss_bytes[10m]) > 50 * 1024 * 1024)
            and
            (container_memory_rss_bytes / container_spec_memory_limit_bytes > 0.9)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Possible memory leak in Voice Agent"
            description: "Memory growing {{ $value }}MB/min"

        # Alert 6: HPA Max Replicas Reached
        - alert: VoiceAgentHPAMaxReached
          expr: |
            kube_hpa_status_current_replicas{hpa="voice-agent-hpa"}
            ==
            kube_hpa_status_desired_replicas{hpa="voice-agent-hpa"}
            and
            kube_hpa_status_desired_replicas{hpa="voice-agent-hpa"} >= 18  # Near max of 20
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Voice Agent HPA at maximum replicas ({{ $value }})"
            description: "Consider increasing max replicas or investigating cause"

        # Alert 7: HPA Scaling Failures
        - alert: VoiceAgentHPAScalingFailure
          expr: |
            increase(kube_hpa_scaled[1h] == 0) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Voice Agent HPA unable to scale up"
            description: "HPA scaling failed multiple times"

        # Alert 8: Cache Hit Rate Low
        - alert: VoiceAgentLowCacheHitRate
          expr: |
            rate(voice_agent_cache_hits_total[5m]) /
            (rate(voice_agent_cache_hits_total[5m]) + rate(voice_agent_cache_misses_total[5m]))
            < 0.4
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "Voice Agent cache hit rate low"
            description: "Cache hit rate: {{ $value | humanizePercentage }}"
