# Horizontal Pod Autoscaler for HoloLoom VoiceAgent
# ===================================================
# Automatically scales pods based on CPU/memory usage
# Date: November 15, 2025

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-agent-hpa
  namespace: hololoom-voice
  labels:
    app: voice-agent
    component: autoscaling

spec:
  # Target deployment
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-agent

  # Min/max replicas
  minReplicas: 3
  maxReplicas: 20

  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50  # Scale down max 50% of current pods
          periodSeconds: 60
        - type: Pods
          value: 2  # Scale down max 2 pods
          periodSeconds: 60
      selectPolicy: Min  # Use most conservative policy

    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 1 minute before scaling up
      policies:
        - type: Percent
          value: 100  # Scale up max 100% of current pods
          periodSeconds: 30
        - type: Pods
          value: 4  # Scale up max 4 pods
          periodSeconds: 30
      selectPolicy: Max  # Use most aggressive policy

  # Metrics for scaling decisions
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Target 70% CPU

    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Target 80% memory

    # Custom metric: Active voice sessions (if metrics server provides it)
    # - type: Pods
    #   pods:
    #     metric:
    #       name: active_voice_sessions
    #     target:
    #       type: AverageValue
    #       averageValue: "10"  # 10 sessions per pod

    # Custom metric: Request queue depth
    # - type: Object
    #   object:
    #     metric:
    #       name: request_queue_depth
    #     describedObject:
    #       apiVersion: v1
    #       kind: Service
    #       name: voice-agent-service
    #     target:
    #       type: Value
    #       value: "100"
