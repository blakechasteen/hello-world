# PersistentVolumeClaim for HoloLoom VoiceAgent
# ===============================================
# Persistent storage for voice sessions
# Date: November 15, 2025

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voice-sessions-pvc
  namespace: hololoom-voice
  labels:
    app: voice-agent
    component: storage

spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can read/write

  # Storage class (use appropriate storage class for your cluster)
  storageClassName: standard  # Change to: fast-ssd, efs, nfs, etc.

  resources:
    requests:
      storage: 50Gi  # 50GB for session storage

  # Volume mode
  volumeMode: Filesystem

---
# Optional: PersistentVolume (if using static provisioning)
# apiVersion: v1
# kind: PersistentVolume
# metadata:
#   name: voice-sessions-pv
#   labels:
#     app: voice-agent
# spec:
#   capacity:
#     storage: 100Gi
#   accessModes:
#     - ReadWriteMany
#   persistentVolumeReclaimPolicy: Retain
#   storageClassName: standard
#   nfs:
#     server: nfs-server.example.com
#     path: "/exports/voice-sessions"

---
# PodDisruptionBudget to maintain availability during disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voice-agent-pdb
  namespace: hololoom-voice
  labels:
    app: voice-agent

spec:
  # Ensure at least 2 pods are always available
  minAvailable: 2

  # Or: allow max 1 pod to be unavailable
  # maxUnavailable: 1

  selector:
    matchLabels:
      app: voice-agent
      component: backend
