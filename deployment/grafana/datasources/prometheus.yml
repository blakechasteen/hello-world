# Grafana Datasource Configuration
# ==================================
# Connects Grafana to Prometheus
# Date: November 15, 2025

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"
