{{- if .Values.voiceAgent.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hololoom-voice.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom-voice.labels" . | nindent 4 }}
  {{- with .Values.voiceAgent.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.voiceAgent.service.type }}
  ports:
    - port: {{ .Values.voiceAgent.service.port }}
      targetPort: {{ .Values.voiceAgent.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "hololoom-voice.selectorLabels" . | nindent 4 }}
{{- end }}
