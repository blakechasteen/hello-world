{{- if and .Values.voiceAgent.enabled .Values.voiceAgent.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hololoom-voice.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom-voice.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hololoom-voice.fullname" . }}
  minReplicas: {{ .Values.voiceAgent.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.voiceAgent.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.voiceAgent.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.voiceAgent.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
