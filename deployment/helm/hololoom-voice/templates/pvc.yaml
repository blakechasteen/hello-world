{{- if and .Values.voiceAgent.enabled .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hololoom-voice.fullname" . }}-sessions
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom-voice.labels" . | nindent 4 }}
  {{- with .Values.persistence.voiceSessions.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.voiceSessions.accessMode }}
  storageClassName: {{ .Values.persistence.voiceSessions.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.voiceSessions.size }}
{{- end }}
