{{- if and .Values.voiceAgent.enabled .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hololoom-voice.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom-voice.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
