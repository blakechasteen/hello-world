{{- if and .Values.voiceAgent.enabled .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hololoom-voice.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom-voice.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hololoom-voice.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hololoom-voice.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hololoom-voice.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hololoom-voice.serviceAccountName" . }}
    namespace: {{ .Values.global.namespace }}
{{- end }}
