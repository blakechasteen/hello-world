# Default values for hololoom-voice
# ===================================
# Override these values with --set or custom values file
# Date: November 15, 2025

# Global settings
global:
  namespace: hololoom-voice
  imageRegistry: docker.io
  imagePullSecrets: []

# VoiceAgent deployment
voiceAgent:
  enabled: true

  # Image configuration
  image:
    repository: hololoom/voice-agent
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  # Replica configuration
  replicaCount: 3

  # Resource limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  # Autoscaling (HPA)
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Health probes
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  # Environment variables
  env:
    # HoloLoom configuration
    - name: HOLOLOOM_MODE
      value: "FUSED"
    - name: LOG_LEVEL
      value: "INFO"
    - name: ENABLE_METRICS
      value: "true"

    # Audio configuration
    - name: SAMPLE_RATE
      value: "16000"
    - name: CHUNK_DURATION
      value: "1.0"
    - name: MAX_QUEUE_SIZE
      value: "100"

    # TTS configuration
    - name: TTS_PROVIDER
      value: "openai"
    - name: TTS_VOICE
      value: "nova"

    # Turn-taking configuration
    - name: TURN_MODE
      value: "hybrid"
    - name: SILENCE_THRESHOLD
      value: "1.5"

  # Secrets (injected from Kubernetes secret)
  secrets:
    # OpenAI API key
    openaiApiKey:
      secretName: voice-agent-secrets
      key: OPENAI_API_KEY

    # Neo4j credentials
    neo4jPassword:
      secretName: voice-agent-secrets
      key: NEO4J_PASSWORD

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: voice.hololoom.ai
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: voice-tls
        hosts:
          - voice.hololoom.ai

  # Pod annotations (Prometheus scraping)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity (pod anti-affinity for HA)
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - voice-agent
            topologyKey: kubernetes.io/hostname

# Persistent storage
persistence:
  enabled: true

  # PersistentVolumeClaim
  voiceSessions:
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 50Gi
    annotations: {}

# PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# ServiceAccount
serviceAccount:
  create: true
  name: voice-agent-sa
  annotations: {}

# RBAC
rbac:
  create: true

# NetworkPolicy
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: hololoom-voice
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 7687  # Neo4j
        - protocol: TCP
          port: 6333  # Qdrant
        - protocol: TCP
          port: 443   # HTTPS (OpenAI API)

# Dependencies (optional external services)
neo4j:
  enabled: true
  uri: "bolt://neo4j:7687"
  database: "neo4j"
  # Password injected from secret

qdrant:
  enabled: true
  host: "qdrant"
  port: 6333
  collection: "hololoom_embeddings"

redis:
  enabled: true
  host: "redis"
  port: 6379
  db: 0

# Monitoring
monitoring:
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s

  grafana:
    enabled: true
    dashboards:
      enabled: true

# Alerting
alerting:
  enabled: true
  rules:
    highErrorRate:
      enabled: true
      threshold: 0.1
      duration: 5m
    highLatency:
      enabled: true
      threshold: 2000  # ms
      duration: 5m
    podDown:
      enabled: true
      threshold: 1
      duration: 5m
