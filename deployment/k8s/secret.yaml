---
# HoloLoom Secrets
# =================
# Sensitive credentials (base64 encoded)
#
# To create secrets:
#   echo -n 'your-password' | base64
#
# IMPORTANT: In production, use external secret management (e.g., Sealed Secrets, Vault)

apiVersion: v1
kind: Secret
metadata:
  name: hololoom-secrets
  namespace: hololoom
  labels:
    app: hololoom
type: Opaque
data:
  # Neo4j credentials
  # Default: neo4j / hololoom123 (CHANGE IN PRODUCTION!)
  NEO4J_USER: bmVvNGo=
  NEO4J_PASSWORD: aG9sb2xvb20xMjM=

  # PostgreSQL credentials
  # Default: hololoom / hololoom123 (CHANGE IN PRODUCTION!)
  POSTGRES_USER: aG9sb2xvb20=
  POSTGRES_PASSWORD: aG9sb2xvb20xMjM=
  POSTGRES_DB: aG9sb2xvb20=

  # Redis password (optional)
  REDIS_PASSWORD: ""

  # Grafana admin credentials
  # Default: admin / admin (CHANGE IN PRODUCTION!)
  GRAFANA_ADMIN_USER: YWRtaW4=
  GRAFANA_ADMIN_PASSWORD: YWRtaW4=
