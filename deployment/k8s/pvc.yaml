---
# HoloLoom Persistent Volume Claims
# ==================================
# Persistent storage for data, logs, and caches

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hololoom-data-pvc
  namespace: hololoom
  labels:
    app: hololoom
spec:
  accessModes:
    - ReadWriteMany  # Shared across pods
  storageClassName: standard  # Replace with your storage class
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data-pvc
  namespace: hololoom
  labels:
    app: neo4j
spec:
