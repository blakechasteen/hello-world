# HoloLoom Production Docker Compose
# ====================================
# Complete production stack with monitoring, databases, and application
# Date: November 17, 2025

version: '3.8'

services:
  # ===========================================================================
  # Application Services
  # ===========================================================================

  # Main HoloLoom API server
  hololoom-api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.production
    container_name: hololoom-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application config
      - HOLOLOOM_ENV=production
      - PYTHONUNBUFFERED=1
      - LOGLEVEL=INFO

      # Database connections
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-hololoom123}
      - QDRANT_URI=http://qdrant:6333
      - POSTGRES_URI=postgresql://hololoom:${POSTGRES_PASSWORD:-hololoom123}@postgres:5432/hololoom
      - REDIS_URI=redis://redis:6379/0

      # Prometheus metrics
      - PROMETHEUS_MULTIPROC_DIR=/app/.prometheus
    volumes:
      - hololoom-logs:/app/logs
      - hololoom-data:/app/data
      - hololoom-checkpoints:/app/checkpoints
      - hololoom-cache:/app/.cache
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hololoom-network
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8000"
      - "prometheus.io/path=/metrics"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Database Services
  # ===========================================================================

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.14.0
    container_name: hololoom-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-hololoom123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_logs_query_enabled=INFO
      - NEO4J_metrics_prometheus_enabled=true
      - NEO4J_metrics_prometheus_endpoint=0.0.0.0:2004
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    networks:
      - hololoom-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=2004"

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hololoom-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP/REST
      - "6334:6334"  # gRPC
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=32
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - hololoom-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=6333"
      - "prometheus.io/path=/metrics"

  # PostgreSQL (for workflow state persistence)
  postgres:
    image: postgres:16-alpine
    container_name: hololoom-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=hololoom
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hololoom123}
      - POSTGRES_DB=hololoom
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - hololoom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hololoom"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "prometheus.io/scrape=false"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hololoom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - hololoom-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "prometheus.io/scrape=false"

  # Redis Exporter (for Prometheus)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: hololoom-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - hololoom-network
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=9121"

  # ===========================================================================
  # Monitoring Stack
  # ===========================================================================

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: hololoom-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ../prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - hololoom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: hololoom-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hololoom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: hololoom-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ../alertmanager:/etc/alertmanager
      - alertmanager-data:/alertmanager
    networks:
      - hololoom-network

  # ===========================================================================
  # Load Balancer (Nginx)
  # ===========================================================================

  nginx:
    image: nginx:alpine
    container_name: hololoom-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - hololoom-api
    networks:
      - hololoom-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  # Application volumes
  hololoom-logs:
    driver: local
  hololoom-data:
    driver: local
  hololoom-checkpoints:
    driver: local
  hololoom-cache:
    driver: local

  # Database volumes
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  neo4j-import:
    driver: local
  neo4j-plugins:
    driver: local
  qdrant-storage:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

  # Monitoring volumes
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  nginx-logs:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  hololoom-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
